<html lang="ja">

<title>モグラ叩き</title>
<style>
:root {
  --accent: #fb8500;
  --accent2: #ff9f24;
  --bg: #0f0f1a;
  --bg2: #070710;
  --panel: rgba(255,133,0,0.07);
  --text: #f0e8ff;
  --text-sub: #a090c0;
  --radius: 16px;
  --shadow: 0 0 30px rgba(251,133,0,0.45), 0 0 80px rgba(251,133,0,0.15), 0 24px 64px rgba(0,0,0,0.85);
}
* { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
body {
  background:
    radial-gradient(ellipse at 25% 20%, rgba(251,133,0,0.18) 0%, transparent 50%),
    radial-gradient(ellipse at 75% 80%, rgba(180,70,0,0.12) 0%, transparent 50%),
    radial-gradient(ellipse at 50% 50%, #0f0f1a 0%, #070710 100%);
  display: flex; justify-content: center; align-items: flex-start;
  min-height: 100vh; padding: 16px 8px 80px;
  font-family: Arial, sans-serif; overflow-x: hidden;
}
#stars { position: fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:0; }
.window {
  position: relative; z-index: 1;
  background: linear-gradient(160deg, #181828 0%, #0f0f1a 100%);
  border: 2px solid var(--accent); border-radius: var(--radius);
  box-shadow: var(--shadow);
  max-width: 460px; width: 100%; overflow: hidden;
}
.titlebar {
  background: linear-gradient(90deg, rgba(251,133,0,0.08) 0%, rgba(251,133,0,0.18) 50%, rgba(251,133,0,0.08) 100%);
  color: var(--accent); font-size: 14px; font-weight: 900; padding: 7px 14px;
  text-align: center; letter-spacing: 2px;
  text-shadow: 0 0 12px var(--accent);
  border-bottom: 1px solid rgba(251,133,0,0.3);
  display: flex; justify-content: space-between; align-items: center;
}
.action-bar {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 600;
  display: flex; gap: 6px; padding: 8px 12px 10px;
  background: linear-gradient(0deg, rgba(7,7,16,0.98) 0%, rgba(10,10,22,0.96) 100%);
  border-top: 1px solid rgba(251,133,0,0.25);
  box-shadow: 0 -4px 20px rgba(0,0,0,0.85), 0 -1px 0 rgba(251,133,0,0.2);
  flex-wrap: wrap; justify-content: center;
  backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
}
.act-btn {
  padding: 5px 14px; font-size: 11px; border-radius: 14px;
  background: linear-gradient(160deg, color-mix(in srgb, var(--accent) 60%, white) 0%, var(--accent) 100%);
  color: #fff; border: none;
  box-shadow: 0 2px 0 rgba(0,0,0,0.4), 0 4px 14px rgba(251,133,0,0.35);
  cursor: pointer; font-weight: bold;
  transition: transform 0.18s cubic-bezier(0.34,1.56,0.64,1), box-shadow 0.15s;
  touch-action: manipulation;
}
.act-btn:active { transform: scale(0.94); box-shadow: 0 1px 0 rgba(0,0,0,0.5), 0 2px 6px rgba(251,133,0,0.2); }
.modal-overlay {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,0.78); z-index: 10000;
  justify-content: center; align-items: center; padding: 16px;
  backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
}
.modal-overlay.visible { display: flex; }
.modal-box {
  background: linear-gradient(160deg, #181828 0%, #0f0f1a 100%);
  border: 2px solid var(--accent); border-radius: var(--radius);
  box-shadow: 0 0 40px rgba(251,133,0,0.5), 0 24px 64px rgba(0,0,0,0.9);
  max-width: 360px; width: 100%; max-height: 88vh; overflow-y: auto;
}
.modal-title {
  background: linear-gradient(90deg, rgba(251,133,0,0.08) 0%, rgba(251,133,0,0.18) 50%, rgba(251,133,0,0.08) 100%);
  color: var(--accent); font-size: 14px; font-weight: 900; padding: 8px 14px;
  text-align: center; letter-spacing: 2px; border-radius: 14px 14px 0 0;
  text-shadow: 0 0 10px var(--accent);
  display: flex; justify-content: space-between; align-items: center;
}
.modal-close { background: none; border: none; font-size: 18px; cursor: pointer; color: var(--accent); }
.modal-body { padding: 14px; color: #c0b0e8; font-size: 13px; line-height: 1.6; }
.led {
  color: var(--accent);
  font-size: 28px; font-weight: 900;
  min-width: 64px; text-align: center;
  text-shadow: 0 0 12px var(--accent), 0 0 24px rgba(251,133,0,0.5);
  display: inline-block; line-height: 1.1;
}
.led-label { font-size: 9px; color: var(--text-sub); display: block; text-align: center; margin-top: 2px; letter-spacing: 1px; }
.status-panel {
  background: var(--panel);
  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  border: 1px solid rgba(251,133,0,0.2); border-radius: 12px;
  padding: 8px 12px; margin: 8px;

  box-shadow: inset 0 1px 0 rgba(255,255,255,0.04), 0 4px 16px rgba(0,0,0,0.4);
}
.led-group { display: flex; flex-direction: column; align-items: center; gap: 2px; }
.content { padding: 8px; }

/* Whack-a-mole specific */
.grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  padding: 10px;
  max-width: 360px;
  margin: 0 auto;
}
.hole-wrap {
  display: flex;
  flex-direction: column;
  align-items: center;
  position: relative;
}
.hole {
  background: radial-gradient(ellipse at 40% 35%, #2d4a1a 0%, #1a2e0e 40%, #0e1a06 100%);
  border: 2px solid rgba(58,125,42,0.5);
  border-radius: 50%;
  width: 100%;
  aspect-ratio: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  position: relative;
  box-shadow: inset 0 6px 20px rgba(0,0,0,0.85), inset 0 -2px 8px rgba(80,140,40,0.1), 0 2px 8px rgba(0,0,0,0.5);
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}
.hole::before {
  content: '';
  position: absolute;
  bottom: 0; left: 8%; right: 8%;
  height: 35%;
  background: radial-gradient(ellipse, rgba(0,0,0,0.7) 0%, transparent 70%);
  border-radius: 50%;
}
.hole::after {
  content: '';
  position: absolute;
  top: 8%; left: 15%; right: 15%;
  height: 20%;
  background: radial-gradient(ellipse, rgba(100,180,60,0.15) 0%, transparent 70%);
  border-radius: 50%;
}
.mole {
  font-size: 40px;
  transform: scale(0) translateY(10px);
  transition: transform 0.15s cubic-bezier(0.34,1.56,0.64,1);
  cursor: pointer;
  z-index: 2;
  line-height: 1;
  filter: drop-shadow(0 0 6px rgba(251,133,0,0.4));
}
.mole.up { transform: scale(1) translateY(0); }
.mole.hit { transform: scale(1.4) translateY(-4px); filter: brightness(1.8) drop-shadow(0 0 14px var(--accent)); }

.float-text {
  position: absolute;
  top: 10%;
  left: 50%;
  transform: translateX(-50%);
  color: var(--accent);
  font-size: 16px;
  font-weight: 900;
  text-shadow: 0 0 10px var(--accent);
  pointer-events: none;
  z-index: 100;
  animation: floatUp 0.8s ease-out forwards;
}
@keyframes floatUp {
  0% { opacity: 1; transform: translateX(-50%) translateY(0); }
  100% { opacity: 0; transform: translateX(-50%) translateY(-40px); }
}

#start-overlay {
  text-align: center;
  padding: 20px 10px 10px;
  color: var(--text-sub);
}
#start-overlay .big-title {
  font-size: 26px;

.miss-row {

.hs-row{display:flex;justify-content:space-between;align-items:center;padding:5px 10px;background:rgba(251,133,0,0.06);border:1px solid rgba(251,133,0,0.15);border-radius:8px;margin:3px 0;}
.hs-period{color:#a090c0;font-size:12px;font-weight:bold;min-width:50px;}
.hs-record{color:#fb8500;font-weight:900;text-shadow:0 0 6px rgba(251,133,0,0.6);}
.hs-val{color:#6050a0;}
.hs-date{color:#7060a0;font-size:9px;margin-left:4px;}

<script>
// Stars
(function(){
  const c=document.getElementById('stars'),ctx=c.getContext('2d');let stars=[];
  function resize(){c.width=window.innerWidth;c.height=window.innerHeight;stars=[];for(let i=0;i<120;i++)stars.push({x:Math.random()*c.width,y:Math.random()*c.height,r:Math.random()*1.5+0.3,a:Math.random(),da:(Math.random()-0.5)*0.008});}
  function draw(){ctx.clearRect(0,0,c.width,c.height);stars.forEach(s=>{s.a=Math.max(0.1,Math.min(1,s.a+s.da));if(s.a<=0.1||s.a>=1)s.da*=-1;ctx.globalAlpha=s.a;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,6.28);ctx.fill();});ctx.globalAlpha=1;requestAnimationFrame(draw);}
  window.addEventListener('resize',resize);resize();draw();
})();

// Visual Viewport fix
const actionBar = document.querySelector('.action-bar');
function fixActionBar() {
  const vv = window.visualViewport;
  if (!vv) return;
  const layoutWidth = document.documentElement.clientWidth || window.innerWidth;
  const scaleRatio = layoutWidth / vv.width;
  const isZoomed = vv.scale > 1.05 || scaleRatio > 1.05;
  if (!isZoomed) {
    actionBar.style.top = actionBar.style.bottom = '';
    actionBar.style.left = actionBar.style.right = '';
    actionBar.style.width = actionBar.style.transform = '';
    actionBar.style.transformOrigin = '';
    return;
  }
  const scale = Math.max(vv.scale, scaleRatio);
  const inv = 1 / scale;
  const barH = actionBar.offsetHeight || 52;
  const layoutW = document.documentElement.clientWidth || Math.round(vv.width * scale);
  actionBar.style.top = Math.round(vv.offsetTop + vv.height - barH) + 'px';
  actionBar.style.bottom = 'auto';
  actionBar.style.left = Math.round(vv.offsetLeft) + 'px';
  actionBar.style.width = layoutW + 'px';
  actionBar.style.right = 'auto';
  actionBar.style.transform = `scale(${inv})`;
  actionBar.style.transformOrigin = 'bottom left';
}
if (window.visualViewport) {
  window.visualViewport.addEventListener('resize', fixActionBar);
  window.visualViewport.addEventListener('scroll', fixActionBar);
  fixActionBar();
}

function getDateKey(){return new Date().toISOString().slice(0,10);}
function getWeekKey(){const d=new Date(),day=d.getDay()||7,mon=new Date(d);mon.setDate(d.getDate()-day+1);return mon.toISOString().slice(0,10);}
function getMonthKey(){return new Date().toISOString().slice(0,7);}
function fmtDate(s){const p=s.slice(5).split('-');return`${parseInt(p[0])}/${parseInt(p[1])}`;}
function saveHiRec(key,val){const today=getDateKey(),wk=getWeekKey(),mo=getMonthKey();let d=JSON.parse(localStorage.getItem(key+'_rec')||'{}');if(!d.all||val>d.all.v)d.all={v:val,date:today};if(!d.today||d.today.date!==today||val>d.today.v)d.today={v:val,date:today};if(!d.week||d.week.key!==wk||val>d.week.v)d.week={v:val,key:wk,date:today};if(!d.month||d.month.key!==mo||val>d.month.v)d.month={v:val,key:mo,date:today};localStorage.setItem(key+'_rec',JSON.stringify(d));}
function saveHiRecLow(key,val){const today=getDateKey(),wk=getWeekKey(),mo=getMonthKey();let d=JSON.parse(localStorage.getItem(key+'_rec')||'{}');if(!d.all||val<d.all.v)d.all={v:val,date:today};if(!d.today||d.today.date!==today||val<d.today.v)d.today={v:val,date:today};if(!d.week||d.week.key!==wk||val<d.week.v)d.week={v:val,key:wk,date:today};if(!d.month||d.month.key!==mo||val<d.month.v)d.month={v:val,key:mo,date:today};localStorage.setItem(key+'_rec',JSON.stringify(d));}
function renderHiRec(key,unit){const today=getDateKey(),wk=getWeekKey(),mo=getMonthKey();const d=JSON.parse(localStorage.getItem(key+'_rec')||'{}');const fmt=e=>e?`<span class="hs-record">${e.v}${unit}</span><span class="hs-date">(${fmtDate(e.date)})</span>`:'<span class="hs-val">--</span>';const tV=d.today?.date===today?fmt(d.today):'<span class="hs-val">--</span>';const wV=d.week?.key===wk?fmt(d.week):'<span class="hs-val">--</span>';const mV=d.month?.key===mo?fmt(d.month):'<span class="hs-val">--</span>';return`<div class="hs-table"><div class="hs-row"><span class="hs-period">本日</span>${tV}</div><div class="hs-row"><span class="hs-period">今週</span>${wV}</div><div class="hs-row"><span class="hs-period">今月</span>${mV}</div><div class="hs-row"><span class="hs-period">全期間</span>${fmt(d.all)}</div></div>`;}

function openModal(id) { document.getElementById(id).classList.add('visible'); }
function closeModal(id) { document.getElementById(id).classList.remove('visible'); }

function playBeep(freq=440, dur=0.06, type='sine') {
  try {
    const ac = new (window.AudioContext||window.webkitAudioContext)();
    const o = ac.createOscillator(), g = ac.createGain();
    o.connect(g); g.connect(ac.destination);
    o.frequency.value = freq; o.type = type;
    g.gain.setValueAtTime(0.1, ac.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + dur);
    o.start(); o.stop(ac.currentTime + dur);
  } catch(e) {}
}

function updateTitleBest() {
  const best = parseInt(localStorage.getItem('wam_best')||'0');
  const el = document.getElementById('title-best');
  if (el) el.textContent = 'BEST: ' + best;
}

// Game state
const NUM_HOLES = 9;
const MOLES = ['🦔','🐭','🦫','🐹'];
let score = 0, level = 1, hits = 0, misses = 0, timeLeft = 30;
let gameRunning = false;
let holeTimers = [];
let countdownTimer = null;
let moleTimers = [];

const grid = document.getElementById('grid');
let holes = [];

function buildGrid() {
  grid.innerHTML = '';
  holes = [];
  for (let i = 0; i < NUM_HOLES; i++) {
    const wrap = document.createElement('div');
    wrap.className = 'hole-wrap';

    const hole = document.createElement('div');
    hole.className = 'hole';

    const mole = document.createElement('div');
    mole.className = 'mole';
    mole.textContent = MOLES[0];

    hole.appendChild(mole);
    wrap.appendChild(hole);
    grid.appendChild(wrap);

    const holeData = { el: hole, mole: mole, up: false, timer: null, emoji: MOLES[0] };
    holes.push(holeData);

    hole.addEventListener('click', () => whack(i));
    (function(){
      var txStart=0, tyStart=0, touchMoved=false;
      hole.addEventListener('touchstart', function(e) {
        txStart = e.touches[0].clientX;
        tyStart = e.touches[0].clientY;
        touchMoved = e.touches.length > 1;
      }, {passive: true});
      hole.addEventListener('touchmove', function(e) {
        var dx = e.touches[0].clientX - txStart;
        var dy = e.touches[0].clientY - tyStart;
        if (Math.abs(dx) > 10 || Math.abs(dy) > 10) touchMoved = true;
      }, {passive: true});
      hole.addEventListener('touchend', function(e) {
        e.preventDefault();
        if (!touchMoved) whack(i);
      }, {passive: false});
    })();
  }
}

function getMoleVisibleTime() {
  return Math.max(700, 1500 - (level - 1) * 120);
}

function getSpawnInterval() {
  return Math.max(400, 900 - (level - 1) * 80);
}

function getMaxMolesUp() {
  return Math.min(4, 1 + Math.floor((level - 1) / 2));
}

function countMolesUp() {
  return holes.filter(h => h.up).length;
}

function popMole() {
  if (!gameRunning) return;
  if (countMolesUp() >= getMaxMolesUp()) return;

  const downHoles = holes.map((h,i)=>({h,i})).filter(({h})=>!h.up);
  if (downHoles.length === 0) return;

  const {h, i} = downHoles[Math.floor(Math.random() * downHoles.length)];
  const emojiIdx = Math.floor(Math.random() * MOLES.length);
  h.emoji = MOLES[emojiIdx];
  h.mole.textContent = h.emoji;
  h.up = true;
  h.mole.classList.add('up');

  h.timer = setTimeout(() => {
    if (h.up) {
      // Missed
      hideMole(i, true);
    }
  }, getMoleVisibleTime());
}

function hideMole(i, missed) {
  const h = holes[i];
  if (!h.up) return;
  h.up = false;
  clearTimeout(h.timer);
  h.mole.classList.remove('up', 'hit');

  if (missed && gameRunning) {
    misses++;
    updateMissRow();
    if (misses >= 3) {
      endGame();
    }
  }
}

function whack(i) {
  if (!gameRunning) return;
  const h = holes[i];
  if (!h.up) return;

  h.up = false;
  clearTimeout(h.timer);
  h.mole.classList.add('hit');

  // Float text
  const wrap = h.el.parentElement;
  const ft = document.createElement('div');
  ft.className = 'float-text';
  ft.textContent = '+10';
  wrap.appendChild(ft);
  ft.addEventListener('animationend', () => ft.remove());

  setTimeout(() => {
    h.mole.classList.remove('up', 'hit');
  }, 200);

  score += 10;
  hits++;

  const newLevel = Math.floor(hits / 10) + 1;
  if (newLevel > level) {
    level = newLevel;
    playBeep(880, 0.12, 'sine');
  } else {
    playBeep(660, 0.06, 'sine');
  }

  updateLEDs();
}

function updateMissRow() {
  const hearts = 3 - misses;
  document.getElementById('miss-row').textContent =
    '❤️'.repeat(Math.max(0, hearts)) + '🖤'.repeat(Math.max(0, misses));
}

function updateLEDs() {
  document.getElementById('score-led').textContent = score;
  document.getElementById('time-led').textContent = timeLeft;
  document.getElementById('level-led').textContent = level;
}

function showStart() {
  document.getElementById('start-overlay').style.display = 'block';
  grid.style.display = 'none';
  document.getElementById('home-btn').style.display = 'none';
}

function startGame() {
  score = 0; level = 1; hits = 0; misses = 0; timeLeft = 30;
  gameRunning = true;

  document.getElementById('start-overlay').style.display = 'none';
  grid.style.display = 'grid';
  document.getElementById('home-btn').style.display = 'block';
  buildGrid();
  updateLEDs();
  updateMissRow();

  // Mole spawning loop
  function spawnLoop() {
    if (!gameRunning) return;
    popMole();
    const nextSpawn = getSpawnInterval() + Math.random() * 300;
    moleTimers.push(setTimeout(spawnLoop, nextSpawn));
  }
  spawnLoop();

  // Countdown
  countdownTimer = setInterval(() => {
    if (!gameRunning) { clearInterval(countdownTimer); return; }
    timeLeft--;
    updateLEDs();
    if (timeLeft <= 0) {
      endGame();
    }
  }, 1000);
}

function restartGame() {
  closeModal('gameover-modal');
  clearAll();
  startGame();
}

function clearAll() {
  gameRunning = false;
  clearInterval(countdownTimer);
  moleTimers.forEach(t => clearTimeout(t));
  moleTimers = [];
  holes.forEach((h,i) => hideMole(i, false));
}

function endGame() {
  clearAll();
  document.getElementById('home-btn').style.display = 'none';
  playBeep(220, 0.4, 'sawtooth');
  const best = Math.max(parseInt(localStorage.getItem('wam_best')||'0'), score);
  localStorage.setItem('wam_best', best);
  saveHiRec('mole', score);
  updateTitleBest();
  document.getElementById('gameover-body').innerHTML = `
    <p style="text-align:center;margin-bottom:12px;font-size:16px;color:#fb8500;">🎉 タイムアップ！</p>
    <p style="text-align:center;font-size:13px;color:#a090c0;">スコア</p>
    <p style="text-align:center;font-size:36px;color:#fb8500;text-shadow:0 0 15px #fb8500;font-weight:900;">${score}</p>
    <p style="text-align:center;font-size:11px;color:#7060a0;margin-top:4px;">ベスト: ${best}</p>
    <div style="text-align:center;margin-top:16px;">
      <button onclick="closeModal('gameover-modal');restartGame();" style="padding:8px 24px;border-radius:16px;background:linear-gradient(160deg,#ffa030,#fb8500);color:#fff;border:none;font-weight:900;font-size:14px;cursor:pointer;touch-action:manipulation;box-shadow:0 2px 0 rgba(0,0,0,0.4),0 4px 14px rgba(251,133,0,0.4);">🔄 もう一度</button>
    </div>
  `;
  openModal('gameover-modal');
}

function showHiScore() {
  document.getElementById('hiscore-body').innerHTML = renderHiRec('mole','匹');
  openModal('hiscore-modal');
}

function goHome() {
  if (!confirm('タイトル画面に戻りますか？（進行中のゲームは終了します）')) return;
  clearAll();
  document.getElementById('home-btn').style.display = 'none';
  closeModal('gameover-modal');
  showStart();
}

// Init
updateLEDs();
updateTitleBest();
</script>
<button id="home-btn" onclick="goHome()" style="position:fixed;top:52px;left:8px;z-index:9999;background:rgba(0,0,0,0.65);border:1px solid rgba(255,255,255,0.25);color:#fff;padding:6px 12px;border-radius:20px;font-size:13px;cursor:pointer;display:none;backdrop-filter:blur(4px)">🏠 戻る</button>

  window.showHomeConfirm=function(){document.getElementById('home-confirm-overlay').classList.add('visible');};
  var ov=document.getElementById('home-confirm-overlay');
  if(ov)ov.addEventListener('click',function(e){if(e.target===this)this.classList.remove('visible');});

    function upd(){var v=window.visualViewport;bar.style.top=v.offsetTop+'px';bar.style.left=v.offsetLeft+'px';bar.style.width=v.width+'px';}
    window.visualViewport.addEventListener('scroll',upd);
    window.visualViewport.addEventListener('resize',upd);
    upd();
  }

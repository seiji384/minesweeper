<style>
* { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
body {
  background:
    radial-gradient(ellipse at 25% 20%, rgba(80,30,180,0.5) 0%, transparent 50%),
    radial-gradient(ellipse at 75% 80%, rgba(20,60,180,0.4) 0%, transparent 50%),

}
#stars { position: fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:0; }
.window {
  position: relative; z-index: 1;
  background: linear-gradient(160deg, #1e1248 0%, #0d0830 100%);
  border: 2px solid #7060ff; border-radius: 16px;

.titlebar {
  background: linear-gradient(90deg, #a06008 0%, #f5c842 28%, #ffe870 50%, #f5c842 72%, #a06008 100%);

.action-bar {

.led-group { display: flex; flex-direction: column; align-items: center; gap: 2px; }
.content { padding: 8px; }

/* Whack-a-mole specific */
.grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  padding: 10px;
  max-width: 360px;
  margin: 0 auto;
}
.hole-wrap {
  display: flex;
  flex-direction: column;
  align-items: center;
  position: relative;
}
.hole {
  background: radial-gradient(ellipse, #1a0a28 0%, #0a0418 100%);
  border: 2px solid #3020a0;
  border-radius: 50%;
  width: 100%;
  aspect-ratio: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  position: relative;
  box-shadow: inset 0 4px 16px rgba(0,0,0,0.8), 0 0 10px rgba(48,32,160,0.3);
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}
.hole::before {
  content: '';
  position: absolute;
  bottom: 0; left: 10%; right: 10%;
  height: 40%;
  background: radial-gradient(ellipse, rgba(48,32,100,0.6) 0%, transparent 70%);
  border-radius: 50%;
}
.mole {
  font-size: 40px;
  transform: scale(0) translateY(10px);
  transition: transform 0.15s cubic-bezier(0.34,1.56,0.64,1);
  cursor: pointer;
  z-index: 2;
  line-height: 1;
  filter: drop-shadow(0 0 6px rgba(180,100,255,0.5));
}
.mole.up { transform: scale(1) translateY(0); }
.mole.hit { transform: scale(1.4) translateY(-4px); filter: brightness(2) drop-shadow(0 0 12px #ffe870); }

.float-text {
  position: absolute;
  top: 10%;
  left: 50%;
  transform: translateX(-50%);
  color: #ffe870;
  font-size: 16px;
  font-weight: 900;
  text-shadow: 0 0 10px #f5c842;
  pointer-events: none;
  z-index: 100;
  animation: floatUp 0.8s ease-out forwards;
}
@keyframes floatUp {
  0% { opacity: 1; transform: translateX(-50%) translateY(0); }
  100% { opacity: 0; transform: translateX(-50%) translateY(-40px); }
}

<script>
// Stars
(function(){
  const c=document.getElementById('stars'),ctx=c.getContext('2d');let stars=[];
  function resize(){c.width=window.innerWidth;c.height=window.innerHeight;stars=[];for(let i=0;i<120;i++)stars.push({x:Math.random()*c.width,y:Math.random()*c.height,r:Math.random()*1.5+0.3,a:Math.random(),da:(Math.random()-0.5)*0.008});}
  function draw(){ctx.clearRect(0,0,c.width,c.height);stars.forEach(s=>{s.a=Math.max(0.1,Math.min(1,s.a+s.da));if(s.a<=0.1||s.a>=1)s.da*=-1;ctx.globalAlpha=s.a;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,6.28);ctx.fill();});ctx.globalAlpha=1;requestAnimationFrame(draw);}
  window.addEventListener('resize',resize);resize();draw();
})();

// Visual Viewport fix
const actionBar = document.querySelector('.action-bar');
function fixActionBar() {
  const vv = window.visualViewport;
  if (!vv) return;
  const layoutWidth = document.documentElement.clientWidth || window.innerWidth;
  const scaleRatio = layoutWidth / vv.width;
  const isZoomed = vv.scale > 1.05 || scaleRatio > 1.05;
  if (!isZoomed) {
    actionBar.style.top = actionBar.style.bottom = '';
    actionBar.style.left = actionBar.style.right = '';
    actionBar.style.width = actionBar.style.transform = '';
    actionBar.style.transformOrigin = '';
    return;
  }
  const scale = Math.max(vv.scale, scaleRatio);
  const inv = 1 / scale;
  const barH = actionBar.offsetHeight || 52;
  const layoutW = document.documentElement.clientWidth || Math.round(vv.width * scale);
  actionBar.style.top = Math.round(vv.offsetTop + vv.height - barH) + 'px';
  actionBar.style.bottom = 'auto';
  actionBar.style.left = Math.round(vv.offsetLeft) + 'px';
  actionBar.style.width = layoutW + 'px';
  actionBar.style.right = 'auto';
  actionBar.style.transform = `scale(${inv})`;
  actionBar.style.transformOrigin = 'bottom left';
}
if (window.visualViewport) {
  window.visualViewport.addEventListener('resize', fixActionBar);
  window.visualViewport.addEventListener('scroll', fixActionBar);
  fixActionBar();
}

function getDateKey(){return new Date().toISOString().slice(0,10);}
function getWeekKey(){const d=new Date(),day=d.getDay()||7,mon=new Date(d);mon.setDate(d.getDate()-day+1);return mon.toISOString().slice(0,10);}
function getMonthKey(){return new Date().toISOString().slice(0,7);}
function fmtDate(s){const p=s.slice(5).split('-');return`${parseInt(p[0])}/${parseInt(p[1])}`;}
function saveHiRec(key,val){const today=getDateKey(),wk=getWeekKey(),mo=getMonthKey();let d=JSON.parse(localStorage.getItem(key+'_rec')||'{}');if(!d.all||val>d.all.v)d.all={v:val,date:today};if(!d.today||d.today.date!==today||val>d.today.v)d.today={v:val,date:today};if(!d.week||d.week.key!==wk||val>d.week.v)d.week={v:val,key:wk,date:today};if(!d.month||d.month.key!==mo||val>d.month.v)d.month={v:val,key:mo,date:today};localStorage.setItem(key+'_rec',JSON.stringify(d));}
function saveHiRecLow(key,val){const today=getDateKey(),wk=getWeekKey(),mo=getMonthKey();let d=JSON.parse(localStorage.getItem(key+'_rec')||'{}');if(!d.all||val<d.all.v)d.all={v:val,date:today};if(!d.today||d.today.date!==today||val<d.today.v)d.today={v:val,date:today};if(!d.week||d.week.key!==wk||val<d.week.v)d.week={v:val,key:wk,date:today};if(!d.month||d.month.key!==mo||val<d.month.v)d.month={v:val,key:mo,date:today};localStorage.setItem(key+'_rec',JSON.stringify(d));}
function renderHiRec(key,unit){const today=getDateKey(),wk=getWeekKey(),mo=getMonthKey();const d=JSON.parse(localStorage.getItem(key+'_rec')||'{}');const fmt=e=>e?`<span class="hs-record">${e.v}${unit}</span><span class="hs-date">(${fmtDate(e.date)})</span>`:'<span class="hs-val">--</span>';const tV=d.today?.date===today?fmt(d.today):'<span class="hs-val">--</span>';const wV=d.week?.key===wk?fmt(d.week):'<span class="hs-val">--</span>';const mV=d.month?.key===mo?fmt(d.month):'<span class="hs-val">--</span>';return`<div class="hs-table"><div class="hs-row"><span class="hs-period">本日</span>${tV}</div><div class="hs-row"><span class="hs-period">今週</span>${wV}</div><div class="hs-row"><span class="hs-period">今月</span>${mV}</div><div class="hs-row"><span class="hs-period">全期間</span>${fmt(d.all)}</div></div>`;}

function openModal(id) { document.getElementById(id).classList.add('visible'); }
function closeModal(id) { document.getElementById(id).classList.remove('visible'); }

// Game state
const NUM_HOLES = 9;
const MOLES = ['🦔','🐭','🦫','🐹'];
let score = 0, level = 1, hits = 0, misses = 0, timeLeft = 30;
let gameRunning = false;
let holeTimers = [];
let countdownTimer = null;
let moleTimers = [];

const grid = document.getElementById('grid');
let holes = [];

function buildGrid() {
  grid.innerHTML = '';
  holes = [];
  for (let i = 0; i < NUM_HOLES; i++) {
    const wrap = document.createElement('div');
    wrap.className = 'hole-wrap';

    const hole = document.createElement('div');
    hole.className = 'hole';

    const mole = document.createElement('div');
    mole.className = 'mole';
    mole.textContent = MOLES[0];

    hole.appendChild(mole);
    wrap.appendChild(hole);
    grid.appendChild(wrap);

    const holeData = { el: hole, mole: mole, up: false, timer: null, emoji: MOLES[0] };
    holes.push(holeData);

    hole.addEventListener('click', () => whack(i));
    (function(){
      var txStart=0, tyStart=0, touchMoved=false;
      hole.addEventListener('touchstart', function(e) {
        txStart = e.touches[0].clientX;
        tyStart = e.touches[0].clientY;
        touchMoved = e.touches.length > 1;
      }, {passive: true});
      hole.addEventListener('touchmove', function(e) {
        var dx = e.touches[0].clientX - txStart;
        var dy = e.touches[0].clientY - tyStart;
        if (Math.abs(dx) > 10 || Math.abs(dy) > 10) touchMoved = true;
      }, {passive: true});
      hole.addEventListener('touchend', function(e) {
        e.preventDefault();
        if (!touchMoved) whack(i);
      }, {passive: false});
    })();
  }
}

function getMoleVisibleTime() {
  return Math.max(700, 1500 - (level - 1) * 120);
}

function getSpawnInterval() {
  return Math.max(400, 900 - (level - 1) * 80);
}

function getMaxMolesUp() {
  return Math.min(4, 1 + Math.floor((level - 1) / 2));
}

function countMolesUp() {
  return holes.filter(h => h.up).length;
}

function popMole() {
  if (!gameRunning) return;
  if (countMolesUp() >= getMaxMolesUp()) return;

  const downHoles = holes.map((h,i)=>({h,i})).filter(({h})=>!h.up);
  if (downHoles.length === 0) return;

  const {h, i} = downHoles[Math.floor(Math.random() * downHoles.length)];
  const emojiIdx = Math.floor(Math.random() * MOLES.length);
  h.emoji = MOLES[emojiIdx];
  h.mole.textContent = h.emoji;
  h.up = true;
  h.mole.classList.add('up');

  h.timer = setTimeout(() => {
    if (h.up) {
      // Missed
      hideMole(i, true);
    }
  }, getMoleVisibleTime());
}

function hideMole(i, missed) {
  const h = holes[i];
  if (!h.up) return;
  h.up = false;
  clearTimeout(h.timer);
  h.mole.classList.remove('up', 'hit');

  if (missed && gameRunning) {
    misses++;
    updateMissRow();
    if (misses >= 3) {
      endGame();
    }
  }
}

function whack(i) {
  if (!gameRunning) return;
  const h = holes[i];
  if (!h.up) return;

  h.up = false;
  clearTimeout(h.timer);
  h.mole.classList.add('hit');

  // Float text
  const wrap = h.el.parentElement;
  const ft = document.createElement('div');
  ft.className = 'float-text';
  ft.textContent = '+10';
  wrap.appendChild(ft);
  ft.addEventListener('animationend', () => ft.remove());

  setTimeout(() => {
    h.mole.classList.remove('up', 'hit');
  }, 200);

  score += 10;
  hits++;

  const newLevel = Math.floor(hits / 10) + 1;
  if (newLevel > level) level = newLevel;

  updateLEDs();
}

function updateMissRow() {
  const hearts = 3 - misses;
  document.getElementById('miss-row').textContent =
    '❤️'.repeat(Math.max(0, hearts)) + '🖤'.repeat(Math.max(0, misses));
}

function updateLEDs() {
  document.getElementById('score-led').textContent = score;
  document.getElementById('time-led').textContent = timeLeft;
  document.getElementById('level-led').textContent = level;
}

function showStart() {
  document.getElementById('start-overlay').style.display = 'block';
  grid.style.display = 'none';
}

function startGame() {
  score = 0; level = 1; hits = 0; misses = 0; timeLeft = 30;
  gameRunning = true;

  document.getElementById('start-overlay').style.display = 'none';
  grid.style.display = 'grid';
  buildGrid();
  updateLEDs();
  updateMissRow();

  // Mole spawning loop
  function spawnLoop() {
    if (!gameRunning) return;
    popMole();
    const nextSpawn = getSpawnInterval() + Math.random() * 300;
    moleTimers.push(setTimeout(spawnLoop, nextSpawn));
  }
  spawnLoop();

  // Countdown
  countdownTimer = setInterval(() => {
    if (!gameRunning) { clearInterval(countdownTimer); return; }
    timeLeft--;
    updateLEDs();
    if (timeLeft <= 0) {
      endGame();
    }
  }, 1000);
}

function restartGame() {
  closeModal('gameover-modal');
  clearAll();
  startGame();
}

function clearAll() {
  gameRunning = false;
  clearInterval(countdownTimer);
  moleTimers.forEach(t => clearTimeout(t));
  moleTimers = [];
  holes.forEach((h,i) => hideMole(i, false));
}

function endGame() {
  clearAll();
  const best = Math.max(parseInt(localStorage.getItem('wam_best')||'0'), score);
  localStorage.setItem('wam_best', best);
  saveHiRec('mole', score);
  document.getElementById('gameover-body').innerHTML = `
    <p style="text-align:center;margin-bottom:12px;font-size:16px;color:#ffe870;">🎉 タイムアップ！</p>
    <p style="text-align:center;font-size:13px;color:#8070c0;">スコア</p>
    <p style="text-align:center;font-size:36px;color:#ff44aa;text-shadow:0 0 15px #ff44aa;font-family:'Courier New';">${score}</p>
    <p style="text-align:center;font-size:11px;color:#6050a0;margin-top:4px;">ベスト: ${best}</p>
    <div style="text-align:center;margin-top:16px;">
      <button onclick="closeModal('gameover-modal');restartGame();" style="padding:8px 24px;border-radius:16px;background:linear-gradient(160deg,#5a30a0,#3a2080);color:#ffe870;border:2px solid #f5c842;font-weight:900;font-size:14px;cursor:pointer;touch-action:manipulation;">🔄 もう一度</button>
    </div>
  `;
  openModal('gameover-modal');
}

function showHiScore() {
  document.getElementById('hiscore-body').innerHTML = renderHiRec('mole','匹');
  openModal('hiscore-modal');
}

// Init
updateLEDs();
</script>

<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">

<title>ライツアウト</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
body {
  background:
    radial-gradient(ellipse at 25% 20%, rgba(80,30,180,0.5) 0%, transparent 50%),
    radial-gradient(ellipse at 75% 80%, rgba(20,60,180,0.4) 0%, transparent 50%),
    radial-gradient(ellipse at 50% 50%, #120830 0%, #050210 100%);
  display: flex; justify-content: center; align-items: flex-start;
  min-height: 100vh; padding: 16px 8px 80px;
  font-family: Arial, sans-serif; overflow-x: hidden;
}
#stars { position: fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:0; }
.window {
  position: relative; z-index: 1;
  background: linear-gradient(160deg, #1e1248 0%, #0d0830 100%);
  border: 2px solid #7060ff; border-radius: 16px;
  box-shadow: 0 0 30px rgba(112,90,255,0.55), 0 0 80px rgba(112,90,255,0.2), 0 24px 64px rgba(0,0,0,0.85);
  max-width: 460px; width: 100%; overflow: hidden;
}
.titlebar {
  background: linear-gradient(90deg, #a06008 0%, #f5c842 28%, #ffe870 50%, #f5c842 72%, #a06008 100%);
  color: #3a1a00; font-size: 14px; font-weight: 900; padding: 7px 14px;
  text-align: center; letter-spacing: 2px; text-shadow: 0 1px 0 rgba(255,255,200,0.8);
  border-bottom: 2px solid #804000;
  display: flex; justify-content: space-between; align-items: center;
}
.titlebar a { color: #3a1a00; text-decoration: none; font-size: 18px; }
.action-bar {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 600;
  display: flex; gap: 6px; padding: 8px 12px 10px;
  background: linear-gradient(0deg, #060412 0%, rgba(10,6,28,0.97) 100%);
  border-top: 1px solid #4030a0;
  box-shadow: 0 -4px 20px rgba(0,0,0,0.85), 0 -1px 0 rgba(112,90,255,0.3);
  flex-wrap: wrap; justify-content: center;
  backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
}
.act-btn {
  padding: 5px 14px; font-size: 11px; border-radius: 14px;
  background: linear-gradient(160deg, #3a2080 0%, #22105a 100%);
  color: #b898ff; border: 1px solid #5a3aaa;
  box-shadow: 0 2px 8px rgba(0,0,0,0.5);
  cursor: pointer; font-weight: bold; transition: all 0.15s; touch-action: manipulation;
}
.act-btn:active { transform: scale(0.93); }
.act-btn.active-diff {
  background: linear-gradient(160deg, #6030c0 0%, #3a1880 100%);
  color: #ffe870; border-color: #a060ff;
}
.modal-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.78); z-index:10000; justify-content:center; align-items:center; padding:16px; }
.modal-overlay.visible { display:flex; }
.modal-box { background:linear-gradient(160deg,#1e1248 0%,#0d0830 100%); border:2px solid #7060ff; border-radius:16px; box-shadow:0 0 40px rgba(112,90,255,0.6),0 24px 64px rgba(0,0,0,0.9); max-width:360px; width:100%; max-height:88vh; overflow-y:auto; }
.modal-title { background:linear-gradient(90deg,#a06008 0%,#f5c842 28%,#ffe870 50%,#f5c842 72%,#a06008 100%); color:#3a1a00; font-size:14px; font-weight:900; padding:8px 14px; text-align:center; letter-spacing:2px; border-radius:14px 14px 0 0; display:flex; justify-content:space-between; align-items:center; }
.modal-close { background:none; border:none; font-size:18px; cursor:pointer; color:#3a1a00; }
.modal-body { padding:14px; color:#c0b0e8; font-size:13px; line-height:1.6; }
.led { background:linear-gradient(160deg,#080518 0%,#040210 100%); color:#ff44aa; font-family:'Courier New',monospace; font-size:18px; font-weight:bold; padding:3px 10px; min-width:54px; text-align:center; border-radius:6px; border:1px solid #4020a0; text-shadow:0 0 10px #ff44aa,0 0 20px #ff2288; box-shadow:inset 0 2px 4px rgba(0,0,0,0.8),0 0 10px rgba(255,68,170,0.3); display:inline-block; }
.led-label { font-size:9px; color:#6050a0; display:block; text-align:center; margin-top:2px; }
.status-panel { background:linear-gradient(160deg,#100a30 0%,#08051a 100%); border:1px solid #4030a0; border-radius:10px; padding:6px 12px; margin:8px; display:flex; justify-content:space-around; align-items:center; box-shadow:inset 0 2px 8px rgba(0,0,0,0.6); }
.led-group { display:flex; flex-direction:column; align-items:center; gap:2px; }
.content { padding:8px; }
#confetti { position:fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:9999; display:none; }

/* Grid */
#grid-wrap { display:flex; justify-content:center; padding:8px 0; }
#grid {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 8px;
  width: min(380px, 95vw);
}
.cell {
  aspect-ratio: 1;
  border-radius: 12px;
  border: 2px solid #3020a0;
  cursor: pointer;
  transition: background 0.18s, box-shadow 0.18s, transform 0.1s;
  touch-action: manipulation;
  display: flex; align-items: center; justify-content: center;
  font-size: 22px;
}
.cell.off {
  background: linear-gradient(145deg, #1a0e3a, #0e0820);
  border-color: #3020a0;
  box-shadow: none;
}
.cell.on {
  background: radial-gradient(circle, #ffe060, #c88010);
  border-color: #ffe870;
  box-shadow: 0 0 16px #ffee40, 0 0 32px #cc8800;
}
.cell:active { transform: scale(0.92); }
.cell.flash-win {
  animation: flash-win 0.3s ease-out;
}
@keyframes flash-win {
  0% { box-shadow: 0 0 40px #ffe870, 0 0 80px #ffcc00; }
  100% { box-shadow: none; }
}

#msg-flash { height:32px; display:flex; align-items:center; justify-content:center; font-size:16px; font-weight:900; color:#ffe870; text-shadow:0 0 12px #ffcc00; letter-spacing:2px; }
</style>

.hcb-cancel:active{transform:translateY(2px);}

<script>
// Stars
(function(){const c=document.getElementById('stars'),ctx=c.getContext('2d');let stars=[];function resize(){c.width=window.innerWidth;c.height=window.innerHeight;stars=[];for(let i=0;i<120;i++)stars.push({x:Math.random()*c.width,y:Math.random()*c.height,r:Math.random()*1.5+0.3,a:Math.random(),da:(Math.random()-0.5)*0.008});}function draw(){ctx.clearRect(0,0,c.width,c.height);stars.forEach(s=>{s.a=Math.max(0.1,Math.min(1,s.a+s.da));if(s.a<=0.1||s.a>=1)s.da*=-1;ctx.globalAlpha=s.a;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,6.28);ctx.fill();});ctx.globalAlpha=1;requestAnimationFrame(draw);}window.addEventListener('resize',resize);resize();draw();})();

function startConfetti(){const cv=document.getElementById('confetti');cv.style.display='block';const ctx=cv.getContext('2d');cv.width=window.innerWidth;cv.height=window.innerHeight;const parts=Array.from({length:80},()=>({x:Math.random()*cv.width,y:-10,r:Math.random()*6+3,c:`hsl(${Math.random()*360},90%,60%)`,vx:(Math.random()-0.5)*4,vy:Math.random()*4+2,rot:Math.random()*360,drot:(Math.random()-0.5)*10}));let frame=0;function anim(){if(frame++>180){cv.style.display='none';return;}ctx.clearRect(0,0,cv.width,cv.height);parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.rot+=p.drot;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot*Math.PI/180);ctx.fillStyle=p.c;ctx.fillRect(-p.r,-p.r/2,p.r*2,p.r);ctx.restore();});requestAnimationFrame(anim);}anim();}

const actionBar=document.querySelector('.action-bar');
function fixAB(){const vv=window.visualViewport;if(!vv)return;const lw=document.documentElement.clientWidth;const sr=lw/vv.width;const iz=vv.scale>1.05||sr>1.05;if(!iz){actionBar.style.cssText='';return;}const sc=Math.max(vv.scale,sr);const inv=1/sc;const bh=actionBar.offsetHeight||52;actionBar.style.top=Math.round(vv.offsetTop+vv.height-bh)+'px';actionBar.style.bottom='auto';actionBar.style.left=Math.round(vv.offsetLeft)+'px';actionBar.style.width=lw+'px';actionBar.style.right='auto';actionBar.style.transform=`scale(${inv})`;actionBar.style.transformOrigin='bottom left';}
if(window.visualViewport){window.visualViewport.addEventListener('resize',fixAB);window.visualViewport.addEventListener('scroll',fixAB);fixAB();}

function showModal(id){if(id==='modal-hi')updateHiModal();document.getElementById(id).classList.add('visible');}
function hideModal(id){document.getElementById(id).classList.remove('visible');}
document.querySelectorAll('.modal-overlay').forEach(el=>el.addEventListener('click',function(e){if(e.target===this)this.classList.remove('visible');}));

// ── Game ──
const N=5;
let grid=Array(N*N).fill(0);
let moves=0;
let gameOver=false;
let moveHistory=[];
let difficulty='normal'; // easy, normal, hard
const diffConfig={easy:{toggles:10,label:'かんたん'},normal:{toggles:15,label:'ふつう'},hard:{toggles:22,label:'むずかしい'}};
const diffOrder=['easy','normal','hard'];

function cycleDiff(){
  const i=diffOrder.indexOf(difficulty);
  difficulty=diffOrder[(i+1)%3];
  document.getElementById('diff-btn').textContent='難易度: '+diffConfig[difficulty].label;
  newPuzzle();
}

function toggleCell(idx){
  grid[idx]^=1;
  const r=Math.floor(idx/N), c=idx%N;
  if(r>0) grid[idx-N]^=1;
  if(r<N-1) grid[idx+N]^=1;
  if(c>0) grid[idx-1]^=1;
  if(c<N-1) grid[idx+1]^=1;
}

function generatePuzzle(){
  grid=Array(N*N).fill(0);
  const toggles=diffConfig[difficulty].toggles;
  for(let t=0;t<toggles;t++){
    const idx=Math.floor(Math.random()*N*N);
    toggleCell(idx);
  }
  // Ensure it's not already solved
  if(grid.every(x=>x===0)) generatePuzzle();
}

function renderGrid(){
  const container=document.getElementById('grid');
  container.innerHTML='';
  for(let i=0;i<N*N;i++){
    const cell=document.createElement('div');
    cell.className='cell '+(grid[i]?'on':'off');
    cell.dataset.idx=i;
    cell.addEventListener('click',()=>handleClick(i));
    let startX=0,startY=0,moved=false;
    cell.addEventListener('touchstart',e=>{if(e.touches.length>1){moved=true;return;}startX=e.touches[0].clientX;startY=e.touches[0].clientY;moved=false;},{passive:true});
    cell.addEventListener('touchmove',e=>{if(e.touches.length>1){moved=true;return;}const dx=e.touches[0].clientX-startX,dy=e.touches[0].clientY-startY;if(dx*dx+dy*dy>100)moved=true;},{passive:true});
    cell.addEventListener('touchend',e=>{e.preventDefault();if(!moved)handleClick(i);},{passive:false});
    container.appendChild(cell);
  }
}

function updateGrid(){
  const cells=document.querySelectorAll('.cell');
  cells.forEach((cell,i)=>{
    cell.className='cell '+(grid[i]?'on':'off');
  });
}

function handleClick(idx){
  if(gameOver) return;
  moveHistory.push([...grid]);
  if(moveHistory.length>10) moveHistory.shift();
  toggleCell(idx);
  moves++;
  document.getElementById('led-moves').textContent=moves;
  updateGrid();
  autoSave();
  updateUndoBtn();
  checkWin();
}

function checkWin(){
  if(grid.every(x=>x===0)){
    gameOver=true;
    winAnimation();
  }
}

function winAnimation(){
  const cells=document.querySelectorAll('.cell');
  let i=0;
  function nextFlash(){
    if(i>=N*N){
      setTimeout(()=>{
        cells.forEach(c=>c.classList.remove('flash-win'));
        flash('🎉 クリア！'+moves+'手', '#ffe870');
        startConfetti();
        saveBest();
        updateBestLED();
      },200);
      return;
    }
    cells[i].classList.add('flash-win');
    cells[i].classList.add('on');
    i++;
    setTimeout(nextFlash, 60);
  }
  nextFlash();
}

function saveBest(){
  const k='lo_best_'+difficulty;
  const prev=parseInt(localStorage.getItem(k)||'9999');
  if(moves<prev) localStorage.setItem(k,moves);
}

function updateBestLED(){
  const k='lo_best_'+difficulty;
  const best=localStorage.getItem(k);
  document.getElementById('led-best').textContent=best||'—';
}

function flash(msg, color='#ffe870'){
  const el=document.getElementById('msg-flash');
  el.textContent=msg; el.style.color=color;
}

function newPuzzle(){
  gameOver=false; moves=0; moveHistory=[];
  document.getElementById('led-moves').textContent=0;
  flash('');
  generatePuzzle();
  renderGrid();
  updateBestLED();
  updateUndoBtn();
}

function updateHiModal(){
  let html='<table style="width:100%;border-collapse:collapse;">';
  html+='<tr><th style="text-align:left;padding:4px;color:#a898d8;">難易度</th><th style="color:#a898d8;padding:4px;">ベスト手数</th></tr>';
  diffOrder.forEach(d=>{
    const k='lo_best_'+d;
    const best=localStorage.getItem(k)||'—';
    html+=`<tr><td style="padding:4px;color:#c0b0e8;">${diffConfig[d].label}</td><td style="padding:4px;text-align:center;color:#ffe870;font-size:16px;">${best}</td></tr>`;
  });
  html+='</table>';
  document.getElementById('hi-body').innerHTML=html;
}

// ── Undo ──
function updateUndoBtn(){
  const btn=document.getElementById('undoBtn');
  if(!btn) return;
  const disabled=moveHistory.length===0||gameOver;
  btn.disabled=disabled;
  btn.style.opacity=disabled?'0.4':'';
}

function undoMove(){
  if(moveHistory.length===0||gameOver) return;
  grid=moveHistory.pop();
  moves=Math.max(0,moves-1);
  document.getElementById('led-moves').textContent=moves;
  updateGrid();
  updateUndoBtn();
}

// ── Toast ──
function showToast(msg){let t=document.getElementById('save-toast');if(!t){t=document.createElement('div');t.id='save-toast';t.style.cssText='position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:rgba(50,200,100,0.95);color:#fff;padding:8px 20px;border-radius:20px;font-size:13px;font-weight:bold;z-index:9999;pointer-events:none;transition:opacity 0.5s;';document.body.appendChild(t);}t.textContent=msg;t.style.opacity='1';setTimeout(()=>t.style.opacity='0',1500);}
function showSaveToast(){const t=document.createElement('div');t.textContent='✅ 保存しました';t.style.cssText='position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:rgba(0,160,80,0.92);color:#fff;padding:8px 20px;border-radius:20px;font-size:13px;font-weight:bold;z-index:99999;pointer-events:none;transition:opacity 0.5s';document.body.appendChild(t);setTimeout(()=>{t.style.opacity='0';setTimeout(()=>t.remove(),500);},1500);}
function saveGame(){ autoSave(); }

// ── Save / Load ──
function autoSave(){
  if(gameOver) return;
  const data={grid:[...grid],moves,difficulty,ts:Date.now()};
  localStorage.setItem('lightsout_save',JSON.stringify(data));
}
function manualSave(){autoSave();showToast('💾 保存しました！');}
function tryLoadSave(){
  try{
    const raw=localStorage.getItem('lightsout_save');
    if(!raw) return false;
    const data=JSON.parse(raw);
    if(!data||!data.ts) return false;
    if(Date.now()-data.ts>7*24*60*60*1000) return false;
    grid=data.grid;
    moves=data.moves;
    difficulty=data.difficulty||'normal';
    document.getElementById('diff-btn').textContent='難易度: '+diffConfig[difficulty].label;
    document.getElementById('led-moves').textContent=moves;
    gameOver=false;
    moveHistory=[];
    renderGrid();
    updateBestLED();
    updateUndoBtn();
    return true;
  }catch(e){return false;}
}

if(!tryLoadSave()) newPuzzle();
document.addEventListener('visibilitychange', ()=>{ if(document.hidden) saveGame(); });
window.addEventListener('beforeunload', ()=>{ saveGame(); });
</script>

    window.visualViewport.addEventListener('resize',upd);
    upd();
  }
})();

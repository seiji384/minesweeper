<style>

.modal-title {

}
.led-label { font-size: 9px; color: #6050a0; display: block; text-align: center; margin-top: 2px; }
.status-panel {

canvas#board { display: block; margin: 0 auto; touch-action: manipulation; cursor: pointer; border-radius: 8px; }

<script>
// ===== STARS =====
(function(){
  const c=document.getElementById('stars'),ctx=c.getContext('2d');let stars=[];
  function resize(){c.width=window.innerWidth;c.height=window.innerHeight;stars=[];for(let i=0;i<120;i++)stars.push({x:Math.random()*c.width,y:Math.random()*c.height,r:Math.random()*1.5+0.3,a:Math.random(),da:(Math.random()-0.5)*0.008});}
  function draw(){ctx.clearRect(0,0,c.width,c.height);stars.forEach(s=>{s.a=Math.max(0.1,Math.min(1,s.a+s.da));if(s.a<=0.1||s.a>=1)s.da*=-1;ctx.globalAlpha=s.a;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,6.28);ctx.fill();});ctx.globalAlpha=1;requestAnimationFrame(draw);}
  window.addEventListener('resize',resize);resize();draw();
})();

// ===== CONFETTI =====
function startConfetti(){const cv=document.getElementById('confetti');cv.style.display='block';const ctx=cv.getContext('2d');cv.width=window.innerWidth;cv.height=window.innerHeight;const parts=Array.from({length:80},()=>({x:Math.random()*cv.width,y:-10,r:Math.random()*6+3,c:`hsl(${Math.random()*360},90%,60%)`,vx:(Math.random()-0.5)*4,vy:Math.random()*4+2,rot:Math.random()*360,drot:(Math.random()-0.5)*10}));let frame=0;function anim(){if(frame++>180){cv.style.display='none';return;}ctx.clearRect(0,0,cv.width,cv.height);parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.rot+=p.drot;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot*Math.PI/180);ctx.fillStyle=p.c;ctx.fillRect(-p.r,-p.r/2,p.r*2,p.r);ctx.restore();});requestAnimationFrame(anim);}anim();}

// ===== VISUAL VIEWPORT FIX =====
const actionBar=document.querySelector('.action-bar');
function fixAB(){const vv=window.visualViewport;if(!vv)return;const lw=document.documentElement.clientWidth;const sr=lw/vv.width;const iz=vv.scale>1.05||sr>1.05;if(!iz){actionBar.style.cssText='';return;}const sc=Math.max(vv.scale,sr);const inv=1/sc;const bh=actionBar.offsetHeight||52;actionBar.style.top=Math.round(vv.offsetTop+vv.height-bh)+'px';actionBar.style.bottom='auto';actionBar.style.left=Math.round(vv.offsetLeft)+'px';actionBar.style.width=lw+'px';actionBar.style.right='auto';actionBar.style.transform=`scale(${inv})`;actionBar.style.transformOrigin='bottom left';}
if(window.visualViewport){window.visualViewport.addEventListener('resize',fixAB);window.visualViewport.addEventListener('scroll',fixAB);fixAB();}

// ===== GAME CONSTANTS =====
const SIZE = 15;
const EMPTY = 0, BLACK = 1, WHITE = 2;
const PLAYER = BLACK, CPU = WHITE;
const STAR_POINTS = [[3,3],[3,7],[3,11],[7,3],[7,7],[7,11],[11,3],[11,7],[11,11]];
const DIRS = [[0,1],[1,0],[1,1],[1,-1]];

// ===== GAME STATE =====
let board, currentTurn, gameOver, moveCount, lastMove, winCells;
let playerWins = 0, cpuWins = 0;
let difficulty = 'normal';
let cpuThinking = false;
let moveHistory = [];

const canvas = document.getElementById('board');
const ctx = canvas.getContext('2d');

// ===== CANVAS INIT =====
function initCanvas() {
  const maxW = Math.min(window.innerWidth - 32, 440);
  canvas.width = maxW;
  canvas.height = maxW;
}

function cellSize() { return canvas.width / (SIZE + 1); }

function boardToXY(r, c) {
  const cs = cellSize();
  return { x: cs + c * cs, y: cs + r * cs };
}

function XYToBoard(x, y) {
  const cs = cellSize();
  return { r: Math.round((y - cs) / cs), c: Math.round((x - cs) / cs) };
}

// ===== DRAW =====
function drawBoard() {
  const w = canvas.width;
  const cs = cellSize();

  // Board background — dark wood radial gradient
  const woodGrad = ctx.createRadialGradient(w*0.5, w*0.5, 0, w*0.5, w*0.5, w*0.7);
  woodGrad.addColorStop(0, '#2a1608');
  woodGrad.addColorStop(0.5, '#1e0f05');
  woodGrad.addColorStop(1, '#120a02');
  ctx.fillStyle = woodGrad;
  ctx.fillRect(0, 0, w, w);

  // Wood grain texture
  for (let i = 0; i < w; i += 4) {
    const alpha = 0.015 + Math.abs(Math.sin(i * 0.15)) * 0.02;
    ctx.strokeStyle = `rgba(180,110,30,${alpha})`;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(0, i);
    ctx.lineTo(w, i + 2);
    ctx.stroke();
  }

  // Board border glow
  ctx.shadowColor = 'rgba(201,168,76,0.5)';
  ctx.shadowBlur = 8;
  ctx.strokeStyle = 'rgba(201,168,76,0.5)';
  ctx.lineWidth = 2;
  ctx.strokeRect(cs - 1, cs - 1, (SIZE - 1) * cs + 2, (SIZE - 1) * cs + 2);
  ctx.shadowBlur = 0;

  // Grid lines — gold/amber #c9a84c
  ctx.strokeStyle = 'rgba(201,168,76,0.65)';
  ctx.lineWidth = 1;
  for (let i = 0; i < SIZE; i++) {
    const p = cs + i * cs;
    ctx.beginPath(); ctx.moveTo(cs, p); ctx.lineTo(cs + (SIZE-1)*cs, p); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(p, cs); ctx.lineTo(p, cs + (SIZE-1)*cs); ctx.stroke();
  }

  // Star points
  STAR_POINTS.forEach(([r, c]) => {
    const { x, y } = boardToXY(r, c);
    ctx.fillStyle = 'rgba(201,168,76,0.9)';
    ctx.beginPath();
    ctx.arc(x, y, cs * 0.13, 0, Math.PI * 2);
    ctx.fill();
  });

  // Stones
  for (let r = 0; r < SIZE; r++) {
    for (let c = 0; c < SIZE; c++) {
      if (board[r][c] !== EMPTY) {
        const isLast = lastMove && lastMove.r === r && lastMove.c === c;
        drawStone(r, c, board[r][c], isLast);
      }
    }
  }

  // Win highlight — pulsing gold line connecting 5 in a row
  if (winCells && winCells.length >= 5) {
    const pulse = 0.5 + 0.5 * Math.sin(Date.now() * 0.006);
    // Draw line connecting first to last win cell
    const sorted = [...winCells].sort((a, b) => a[0] - b[0] || a[1] - b[1]);
    const p0 = boardToXY(sorted[0][0], sorted[0][1]);
    const pN = boardToXY(sorted[sorted.length-1][0], sorted[sorted.length-1][1]);
    ctx.save();
    ctx.shadowColor = '#c9a84c';
    ctx.shadowBlur = 12 + pulse * 16;
    ctx.strokeStyle = `rgba(201,168,76,${0.7 + pulse * 0.3})`;
    ctx.lineWidth = 4 + pulse * 3;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(p0.x, p0.y);
    ctx.lineTo(pN.x, pN.y);
    ctx.stroke();
    ctx.restore();
    // Glow circles on each winning stone
    winCells.forEach(([r, c]) => {
      const { x, y } = boardToXY(r, c);
      ctx.save();
      ctx.shadowColor = '#ffe040';
      ctx.shadowBlur = 10 + pulse * 14;
      ctx.strokeStyle = `rgba(255,220,50,${0.6 + pulse * 0.4})`;
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.arc(x, y, cellSize() * 0.44, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    });
    // Trigger continuous redraw for animation
    requestAnimationFrame(() => { if (gameOver && winCells && winCells.length > 0) drawBoard(); });
  }
}

function drawStone(r, c, color, isLast) {
  const { x, y } = boardToXY(r, c);
  const cs = cellSize();
  const radius = cs * 0.42;

  if (color === BLACK) {
    // Black stone: dark radial gradient with white highlight spot
    const grad = ctx.createRadialGradient(x - radius*0.28, y - radius*0.28, radius*0.05, x, y, radius);
    grad.addColorStop(0, '#555555');
    grad.addColorStop(0.3, '#222222');
    grad.addColorStop(0.7, '#111111');
    grad.addColorStop(1, '#080808');
    ctx.shadowColor = 'rgba(0,0,0,0.8)';
    ctx.shadowBlur = 6;
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(x, y, radius, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
    // White highlight spot (top-left sheen)
    ctx.fillStyle = 'rgba(255,255,255,0.28)';
    ctx.beginPath();
    ctx.ellipse(x - radius*0.24, y - radius*0.28, radius*0.22, radius*0.13, -0.5, 0, Math.PI*2);
    ctx.fill();
  } else {
    // White stone: light radial gradient #eee → #ccc
    const grad = ctx.createRadialGradient(x - radius*0.28, y - radius*0.28, radius*0.05, x, y, radius);
    grad.addColorStop(0, '#ffffff');
    grad.addColorStop(0.35, '#eeeeee');
    grad.addColorStop(0.7, '#cccccc');
    grad.addColorStop(1, '#aaaaaa');
    ctx.shadowColor = 'rgba(180,180,200,0.5)';
    ctx.shadowBlur = 6;
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(x, y, radius, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
    // Strong white highlight
    ctx.fillStyle = 'rgba(255,255,255,0.65)';
    ctx.beginPath();
    ctx.ellipse(x - radius*0.24, y - radius*0.28, radius*0.22, radius*0.13, -0.5, 0, Math.PI*2);
    ctx.fill();
  }

  // Last move indicator
  if (isLast) {
    ctx.strokeStyle = color === BLACK ? 'rgba(255,80,80,0.85)' : 'rgba(255,60,60,0.85)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(x, y, radius * 0.5, 0, Math.PI * 2);
    ctx.stroke();
  }
}

// ===== GAME LOGIC =====
function initBoard() {
  board = Array.from({length: SIZE}, () => new Array(SIZE).fill(EMPTY));
  currentTurn = PLAYER;
  gameOver = false;
  moveCount = 0;
  lastMove = null;
  winCells = [];
  cpuThinking = false;
  moveHistory = [];
  updateStatus();
  drawBoard();
  document.getElementById('home-btn').style.display = 'block';
}

function updateStatus() {
  document.getElementById('moveCount').textContent = moveCount;
  document.getElementById('winCount').textContent = `${playerWins}-${cpuWins}`;
  const td = document.getElementById('turnDisplay');
  if (gameOver) td.textContent = '終了';
  else if (cpuThinking) td.textContent = 'CPU思考中...';
  else td.textContent = currentTurn === PLAYER ? 'あなた ⚫' : 'CPU ⚪';
  updateUndoBtn();
}

function placeStone(r, c) {
  if (gameOver || board[r][c] !== EMPTY || currentTurn !== PLAYER || cpuThinking) return;
  if (r < 0 || r >= SIZE || c < 0 || c >= SIZE) return;

  // Stone placement click sound
  try {
    const ac = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ac.createOscillator();
    const gain = ac.createGain();
    osc.connect(gain); gain.connect(ac.destination);
    osc.type = 'sine'; osc.frequency.value = 880;
    gain.gain.setValueAtTime(0.18, ac.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + 0.08);
    osc.start(); osc.stop(ac.currentTime + 0.08);
  } catch(e) {}

  moveHistory.push({ board: board.map(row => [...row]), moveCount, lastMove: lastMove ? {...lastMove} : null });
  if (moveHistory.length > 10) moveHistory.shift();
  board[r][c] = PLAYER;
  lastMove = { r, c };
  moveCount++;

  const win = checkWin(board, r, c, PLAYER);
  if (win) {
    winCells = win;
    gameOver = true;
    playerWins++;
    updateStatus();
    drawBoard();
    startConfetti();
    setTimeout(() => showResult('🎉 あなたの勝ち！', '五目並べました！勝利おめでとう！'), 400);
    return;
  }

  let full = true;
  for (let i = 0; i < SIZE && full; i++) for (let j = 0; j < SIZE && full; j++) if (board[i][j] === EMPTY) full = false;
  if (full) {
    gameOver = true;
    updateStatus(); drawBoard();
    showResult('引き分け', 'マスが全て埋まりました');
    return;
  }

  currentTurn = CPU;
  cpuThinking = true;
  updateStatus();
  drawBoard();

  const delay = difficulty === 'easy' ? 250 : difficulty === 'normal' ? 450 : 550;
  setTimeout(() => { doCpuMove(); cpuThinking = false; updateStatus(); }, delay + Math.random() * 150);
}

function doCpuMove() {
  const move = getBestMove(board, difficulty);
  if (!move) return;

  board[move.r][move.c] = CPU;
  lastMove = { r: move.r, c: move.c };
  moveCount++;

  const win = checkWin(board, move.r, move.c, CPU);
  if (win) {
    winCells = win;
    gameOver = true;
    cpuWins++;
    updateStatus(); drawBoard();
    setTimeout(() => showResult('💀 CPUの勝ち', 'またチャレンジしてね！'), 400);
    return;
  }

  let full = true;
  for (let i = 0; i < SIZE && full; i++) for (let j = 0; j < SIZE && full; j++) if (board[i][j] === EMPTY) full = false;
  if (full) {
    gameOver = true; updateStatus(); drawBoard();
    showResult('引き分け', 'マスが全て埋まりました');
    return;
  }

  currentTurn = PLAYER;
  updateStatus(); drawBoard();
}

function checkWin(board, r, c, color) {
  for (const [dr, dc] of DIRS) {
    const cells = [[r, c]];
    for (let d = 1; d < 5; d++) {
      const nr = r + dr*d, nc = c + dc*d;
      if (nr >= 0 && nr < SIZE && nc >= 0 && nc < SIZE && board[nr][nc] === color) cells.push([nr,nc]); else break;
    }
    for (let d = 1; d < 5; d++) {
      const nr = r - dr*d, nc = c - dc*d;
      if (nr >= 0 && nr < SIZE && nc >= 0 && nc < SIZE && board[nr][nc] === color) cells.push([nr,nc]); else break;
    }
    if (cells.length >= 5) return cells;
  }
  return null;
}

// ===== AI =====
function getCandidates(board, range) {
  const seen = new Set();
  const result = [];
  for (let r = 0; r < SIZE; r++) {
    for (let c = 0; c < SIZE; c++) {
      if (board[r][c] === EMPTY) continue;
      for (let dr = -range; dr <= range; dr++) {
        for (let dc = -range; dc <= range; dc++) {
          const nr = r + dr, nc = c + dc;
          if (nr >= 0 && nr < SIZE && nc >= 0 && nc < SIZE && board[nr][nc] === EMPTY) {
            const key = nr * SIZE + nc;
            if (!seen.has(key)) { seen.add(key); result.push({ r: nr, c: nc }); }
          }
        }
      }
    }
  }
  return result;
}

function scoreAt(board, r, c, color) {
  let score = 0;
  for (const [dr, dc] of DIRS) {
    let count = 1, openEnds = 0;
    let nr = r+dr, nc = c+dc;
    while (nr>=0&&nr<SIZE&&nc>=0&&nc<SIZE&&board[nr][nc]===color){count++;nr+=dr;nc+=dc;}
    if (nr>=0&&nr<SIZE&&nc>=0&&nc<SIZE&&board[nr][nc]===EMPTY) openEnds++;
    nr=r-dr;nc=c-dc;
    while (nr>=0&&nr<SIZE&&nc>=0&&nc<SIZE&&board[nr][nc]===color){count++;nr-=dr;nc-=dc;}
    if (nr>=0&&nr<SIZE&&nc>=0&&nc<SIZE&&board[nr][nc]===EMPTY) openEnds++;

    if (count>=5) score+=100000;
    else if (count===4&&openEnds===2) score+=10000;
    else if (count===4&&openEnds===1) score+=1000;
    else if (count===3&&openEnds===2) score+=500;
    else if (count===3&&openEnds===1) score+=100;
    else if (count===2&&openEnds===2) score+=50;
    else if (count===2&&openEnds===1) score+=10;
  }
  return score;
}

function hasAnyStone(board) {
  for (let r=0;r<SIZE;r++) for (let c=0;c<SIZE;c++) if(board[r][c]!==EMPTY) return true;
  return false;
}

// Easy: pick any empty cell at random
function getRandomMove(board) {
  const empties = [];
  for (let r = 0; r < SIZE; r++)
    for (let c = 0; c < SIZE; c++)
      if (board[r][c] === EMPTY) empties.push({r, c});
  if (empties.length === 0) return null;
  return empties[Math.floor(Math.random() * empties.length)];
}

// Easy strategic: only block immediate 5-in-a-row; otherwise random nearby
function getSimpleMove(board) {
  const candidates = getCandidates(board, 1);
  if (candidates.length === 0) return getRandomMove(board);
  for (const {r, c} of candidates) {
    board[r][c] = PLAYER;
    const win = checkWin(board, r, c, PLAYER);
    board[r][c] = EMPTY;
    if (win) return {r, c};
  }
  return candidates[Math.floor(Math.random() * candidates.length)];
}

// Normal: check win+block, then score-based depth-1
function getMediumMove(board) {
  const candidates = getCandidates(board, 2);
  if (candidates.length === 0) return getRandomMove(board);
  for (const {r, c} of candidates) {
    board[r][c] = CPU;
    const win = checkWin(board, r, c, CPU);
    board[r][c] = EMPTY;
    if (win) return {r, c};
  }
  for (const {r, c} of candidates) {
    board[r][c] = PLAYER;
    const win = checkWin(board, r, c, PLAYER);
    board[r][c] = EMPTY;
    if (win) return {r, c};
  }
  let best = -1, bestMove = candidates[0];
  for (const {r, c} of candidates) {
    const s = scoreAt(board, r, c, CPU) + scoreAt(board, r, c, PLAYER) * 0.8;
    if (s > best) { best = s; bestMove = {r, c}; }
  }
  return bestMove;
}

function getBestMove(board, diff) {
  if (!hasAnyStone(board)) return { r: 7, c: 7 };

  // Easy: 55% fully random, 45% simple block only
  if (diff === 'easy') {
    if (Math.random() < 0.55) return getRandomMove(board) || { r: 7, c: 7 };
    return getSimpleMove(board) || { r: 7, c: 7 };
  }

  // Normal: strategic but no deep lookahead
  if (diff === 'normal') {
    return getMediumMove(board) || { r: 7, c: 7 };
  }

  // Hard: full scoring with wide candidate range
  const candidates = getCandidates(board, 3);
  if (candidates.length === 0) return { r: 7, c: 7 };

  for (const { r, c } of candidates) {
    board[r][c] = CPU;
    const win = checkWin(board, r, c, CPU);
    board[r][c] = EMPTY;
    if (win) return { r, c };
  }

  let blockMove = null;
  for (const { r, c } of candidates) {
    board[r][c] = PLAYER;
    const win = checkWin(board, r, c, PLAYER);
    board[r][c] = EMPTY;
    if (win) { blockMove = { r, c }; break; }
  }

  let bestScore = -1;
  let bestMove = blockMove;
  for (const { r, c } of candidates) {
    const total = scoreAt(board, r, c, CPU) * 1.15 + scoreAt(board, r, c, PLAYER);
    if (total > bestScore) { bestScore = total; bestMove = { r, c }; }
  }

  return bestMove || candidates[0];
}

// ===== UNDO =====
function updateUndoBtn() {
  const btn = document.getElementById('undoBtn');
  if (!btn) return;
  const disabled = moveHistory.length === 0 || cpuThinking || gameOver;
  btn.disabled = disabled;
  btn.style.opacity = disabled ? '0.4' : '';
}

function undoMove() {
  if (moveHistory.length === 0 || cpuThinking || gameOver) return;
  const prev = moveHistory.pop();
  board = prev.board;
  moveCount = prev.moveCount;
  lastMove = prev.lastMove;
  winCells = [];
  gameOver = false;
  currentTurn = PLAYER;
  cpuThinking = false;
  updateStatus();
  drawBoard();
}

// ===== EVENT HANDLERS =====
function handleTap(x, y) {
  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width / rect.width;
  const scaleY = canvas.height / rect.height;
  const cx = (x - rect.left) * scaleX;
  const cy = (y - rect.top) * scaleY;
  const { r, c } = XYToBoard(cx, cy);
  placeStone(r, c);
}

canvas.addEventListener('click', (e) => handleTap(e.clientX, e.clientY));

let touchStartX = 0, touchStartY = 0, touchMoved = false;
canvas.addEventListener('touchstart', (e) => {
  if (e.touches.length > 1) { touchMoved = true; return; }
  const t = e.touches[0];
  touchStartX = t.clientX; touchStartY = t.clientY;
  touchMoved = false;
}, { passive: true });
canvas.addEventListener('touchmove', (e) => {
  if (e.touches.length > 1) { touchMoved = true; return; }
  const t = e.touches[0];
  const dx = t.clientX - touchStartX, dy = t.clientY - touchStartY;
  if (Math.sqrt(dx*dx + dy*dy) > 10) touchMoved = true;
}, { passive: true });
canvas.addEventListener('touchend', (e) => {
  e.preventDefault();
  if (touchMoved) return;
  const t = e.changedTouches[0];
  handleTap(t.clientX, t.clientY);
}, { passive: false });

window.addEventListener('resize', () => { initCanvas(); drawBoard(); });

// ===== SAVE / RESTORE =====
function showSaveToast(){const t=document.createElement('div');t.textContent='✅ 保存しました';t.style.cssText='position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:rgba(0,160,80,0.92);color:#fff;padding:8px 20px;border-radius:20px;font-size:13px;font-weight:bold;z-index:99999;pointer-events:none;transition:opacity 0.5s';document.body.appendChild(t);setTimeout(()=>{t.style.opacity='0';setTimeout(()=>t.remove(),500);},1500);}

function saveGame() {
  const data = {
    board: board,
    currentTurn: currentTurn,
    moveCount: moveCount,
    playerWins: playerWins,
    cpuWins: cpuWins,
    gameOver: gameOver,
    difficulty: difficulty,
    ts: Date.now()
  };
  localStorage.setItem('gomoku_save', JSON.stringify(data));
  showSaveToast('💾 保存しました！');
}

function checkRestore() {
  try {
    const raw = localStorage.getItem('gomoku_save');
    if (!raw) return;
    const data = JSON.parse(raw);
    if (Date.now() - data.ts > 24 * 60 * 60 * 1000) return;
    if (data.gameOver || !data.moveCount) return;
    const ov = document.getElementById('restore-overlay');
    ov.style.display = 'flex';
  } catch(e) {}
}

function restoreGame() {
  try {
    const raw = localStorage.getItem('gomoku_save');
    const data = JSON.parse(raw);
    board = data.board;
    currentTurn = data.currentTurn;
    moveCount = data.moveCount;
    playerWins = data.playerWins;
    cpuWins = data.cpuWins;
    gameOver = false;
    lastMove = null;
    winCells = [];
    cpuThinking = false;
    if (data.difficulty) {
      difficulty = data.difficulty;
      document.getElementById('diffSelect').value = difficulty;
    }
    document.getElementById('restore-overlay').style.display = 'none';
    updateStatus();
    drawBoard();
  } catch(e) {
    document.getElementById('restore-overlay').style.display = 'none';
  }
}

function declineRestore() {
  document.getElementById('restore-overlay').style.display = 'none';
  localStorage.removeItem('gomoku_save');
}

// ===== INIT =====
initCanvas();
initBoard();
checkRestore();
document.addEventListener('visibilitychange', ()=>{ if(document.hidden) saveGame(); });
window.addEventListener('beforeunload', ()=>{ saveGame(); });
function goHome() {
  if (!confirm('ホーム画面に戻りますか？')) return;
  document.getElementById('home-btn').style.display = 'none';
  location.href = 'index.html';
}

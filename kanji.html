<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>漢字でGO！</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#1a1a2e; color:#fff; font-family:'Hiragino Sans','Yu Gothic',sans-serif; min-height:100vh; overflow:hidden; touch-action:manipulation; }

/* Animated BG */
#bg-canvas { position:fixed; inset:0; z-index:0; }

/* Screens */
.screen { position:fixed; inset:0; z-index:10; display:none; flex-direction:column; align-items:center; justify-content:center; }
.screen.active { display:flex; }

/* ===== TITLE SCREEN ===== */
#title-screen { background:linear-gradient(160deg,#0a0a1a 0%,#1a1a3a 50%,#0a1a2a 100%); }
.title-logo { font-size:clamp(36px,10vw,72px); font-weight:900; color:#fff; text-shadow:0 0 30px #ffcc00, 4px 4px 0 #cc8800, 6px 6px 0 #996600; letter-spacing:4px; margin-bottom:8px; }
.title-sub { font-size:14px; color:rgba(255,255,255,0.5); margin-bottom:40px; }
.start-btn { background:linear-gradient(135deg,#ff6600,#ffcc00); color:#fff; border:none; padding:18px 56px; font-size:22px; font-weight:900; border-radius:50px; cursor:pointer; box-shadow:0 6px 30px rgba(255,150,0,0.5); transition:transform 0.15s cubic-bezier(0.34,1.56,0.64,1); letter-spacing:2px; }
.start-btn:active { transform:scale(0.93); }
.home-btn { position:fixed; top:14px; left:14px; z-index:200; background:rgba(0,0,0,0.55); border:1px solid rgba(255,255,255,0.2); color:#fff; padding:8px 14px; border-radius:20px; font-size:13px; cursor:pointer; text-decoration:none; display:flex; align-items:center; gap:4px; }

/* ===== DIFFICULTY SELECT ===== */
#diff-screen { background:#111; flex-direction:column; gap:16px; padding:20px; }
.screen-title { font-size:20px; font-weight:bold; margin-bottom:4px; opacity:0.8; }
.diff-grid { display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; width:100%; max-width:480px; }
.diff-col { border-radius:14px; padding:14px 10px; cursor:pointer; display:flex; flex-direction:column; gap:8px; transition:transform 0.15s cubic-bezier(0.34,1.56,0.64,1); }
.diff-col:active { transform:scale(0.95); }
.diff-col h2 { font-size:16px; font-weight:900; text-align:center; margin-bottom:4px; }
.diff-col .sample { font-size:13px; opacity:0.85; text-align:center; padding:3px 0; border-top:1px solid rgba(255,255,255,0.15); }
.diff-beginner { background:linear-gradient(160deg,#22aa44,#1a7a33); }
.diff-inter { background:linear-gradient(160deg,#bb8800,#886600); }
.diff-adv { background:linear-gradient(160deg,#cc4400,#992200); }
.diff-ultra { background:linear-gradient(160deg,#6633cc,#4422aa); }
.diff-geki { background:linear-gradient(160deg,#990000,#550000); border:2px solid #ff4444; }
.diff-full-row { grid-column:1/-1; }

/* ===== GENRE SELECT ===== */
#genre-screen { background:#111; flex-direction:column; gap:12px; padding:20px; }
.genre-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; width:100%; max-width:360px; }
.genre-btn { background:rgba(255,255,255,0.08); border:2px solid rgba(255,255,255,0.15); color:#fff; border-radius:12px; padding:16px; font-size:16px; font-weight:bold; cursor:pointer; transition:all 0.15s; display:flex; flex-direction:column; align-items:center; gap:4px; }
.genre-btn:active { transform:scale(0.93); }
.genre-btn .genre-icon { font-size:28px; }
.genre-btn.selected { border-color:#ffcc00; background:rgba(255,204,0,0.15); }
.genre-all { grid-column:1/-1; background:linear-gradient(135deg,rgba(255,150,0,0.2),rgba(255,200,0,0.2)); border-color:#ffaa00; }
.genre-confirm { background:linear-gradient(135deg,#ff6600,#ffcc00); color:#fff; border:none; padding:14px 40px; font-size:18px; font-weight:900; border-radius:40px; cursor:pointer; margin-top:8px; }

/* ===== GAME SCREEN ===== */
#game-screen { background:transparent; flex-direction:column; justify-content:flex-start; }

/* Top bar */
#game-top { width:100%; padding:10px 14px; display:flex; align-items:center; justify-content:space-between; background:rgba(0,0,0,0.6); }
#skip-btn { background:rgba(255,255,255,0.15); border:1px solid rgba(255,255,255,0.3); color:#fff; padding:6px 14px; border-radius:20px; font-size:13px; cursor:pointer; }
#skip-btn:disabled { opacity:0.3; cursor:default; }
#progress-bar-wrap { flex:1; margin:0 12px; }
#progress-bar { height:6px; background:rgba(255,255,255,0.15); border-radius:3px; overflow:hidden; }
#progress-fill { height:100%; background:linear-gradient(90deg,#44cc44,#ffcc00); border-radius:3px; transition:width 0.3s; }
#lives-display { display:flex; gap:6px; }
.life-icon { font-size:20px; transition:all 0.3s; }
.life-icon.lost { opacity:0.25; filter:grayscale(1); }

/* Question area */
#question-area { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; width:100%; padding:20px; gap:16px; }
#mode-badge { background:rgba(0,0,0,0.5); border-radius:20px; padding:4px 14px; font-size:12px; opacity:0.7; }
#timer-ring { position:relative; width:70px; height:70px; }
#timer-svg { width:70px; height:70px; transform:rotate(-90deg); }
#timer-track { fill:none; stroke:rgba(255,255,255,0.15); stroke-width:6; }
#timer-prog { fill:none; stroke:#44cc44; stroke-width:6; stroke-linecap:round; stroke-dasharray:170; stroke-dashoffset:0; transition:stroke-dashoffset 0.3s linear, stroke 0.3s; }
#timer-num { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:22px; font-weight:900; }

/* KANJI DISPLAY — game show style */
#kanji-display-wrap { position:relative; width:100%; text-align:center; }
#kanji-hint { font-size:13px; color:rgba(255,255,255,0.5); margin-bottom:8px; }
#kanji-word { font-size:clamp(52px,18vw,96px); font-weight:900; color:#fff; text-shadow:
  0 0 40px rgba(255,200,50,0.8),
  3px 3px 0 #cc8800,
  -1px -1px 0 #cc8800,
  4px 4px 0 #886600,
  -2px 3px 0 #886600;
  line-height:1.1; letter-spacing:4px; }
#kanji-word.correct-anim { animation:correctPulse 0.5s ease; }
#kanji-word.wrong-anim { animation:wrongShake 0.4s ease; }
@keyframes correctPulse { 0%{transform:scale(1)} 50%{transform:scale(1.08);color:#88ff88} 100%{transform:scale(1)} }
@keyframes wrongShake { 0%,100%{transform:translateX(0)} 20%,60%{transform:translateX(-8px);color:#ff6666} 40%,80%{transform:translateX(8px)} }

/* Input */
#answer-wrap { width:100%; max-width:340px; position:relative; }
#answer-input { width:100%; background:rgba(255,255,255,0.1); border:2px solid rgba(255,255,255,0.3); color:#fff; font-size:22px; text-align:center; padding:14px; border-radius:14px; outline:none; font-family:inherit; transition:border-color 0.2s; -webkit-appearance:none; }
#answer-input:focus { border-color:#ffcc00; background:rgba(255,204,0,0.08); }
#answer-input::placeholder { color:rgba(255,255,255,0.3); font-size:16px; }
#submit-btn { position:absolute; right:8px; top:50%; transform:translateY(-50%); background:linear-gradient(135deg,#ff6600,#ffcc00); border:none; color:#fff; width:40px; height:40px; border-radius:10px; font-size:18px; cursor:pointer; }

/* Feedback overlay */
#feedback { position:fixed; inset:0; z-index:50; display:none; align-items:center; justify-content:center; pointer-events:none; }
#feedback-text { font-size:clamp(48px,15vw,80px); font-weight:900; text-shadow:4px 4px 0 rgba(0,0,0,0.5); animation:feedbackPop 0.6s ease forwards; }
@keyframes feedbackPop { 0%{transform:scale(0.3);opacity:0} 60%{transform:scale(1.15)} 100%{transform:scale(1);opacity:1} }
#answer-reveal { position:fixed; bottom:180px; left:50%; transform:translateX(-50%); background:rgba(0,0,20,0.9); border:2px solid rgba(255,255,255,0.3); border-radius:12px; padding:10px 24px; font-size:18px; display:none; z-index:51; }

/* Combo */
#combo-display { font-size:15px; font-weight:bold; color:#ffcc00; text-shadow:0 0 10px #ffcc00; opacity:0; transition:opacity 0.3s; }

/* ===== RESULT SCREEN ===== */
#result-screen { background:linear-gradient(160deg,#0a0a1a,#1a1a3a); flex-direction:column; gap:16px; padding:30px; }
#result-title { font-size:32px; font-weight:900; }
.result-stats { background:rgba(255,255,255,0.07); border-radius:16px; padding:20px; width:100%; max-width:320px; }
.stat-row { display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px solid rgba(255,255,255,0.1); font-size:16px; }
.stat-row:last-child { border-bottom:none; }
.stat-val { font-weight:bold; color:#ffcc00; }
.result-btns { display:flex; gap:12px; margin-top:8px; }
.result-btn { padding:14px 28px; border-radius:30px; font-size:16px; font-weight:bold; cursor:pointer; border:none; transition:transform 0.15s cubic-bezier(0.34,1.56,0.64,1); }
.result-btn:active { transform:scale(0.93); }
.btn-retry { background:linear-gradient(135deg,#ff6600,#ffcc00); color:#fff; }
.btn-menu { background:rgba(255,255,255,0.12); color:#fff; border:1px solid rgba(255,255,255,0.2); }

/* Back btn */
.back-btn { position:fixed; top:12px; left:12px; z-index:100; background:rgba(0,0,0,0.5); border:1px solid rgba(255,255,255,0.2); color:#fff; padding:8px 14px; border-radius:20px; font-size:13px; cursor:pointer; }
</style>
</head>
<body>

<canvas id="bg-canvas"></canvas>

<!-- TITLE -->
<div id="title-screen" class="screen active">
  <a class="home-btn" href="index.html">🏠 ホーム</a>
  <div class="title-logo">漢字でGO！</div>
  <div class="title-sub">漢字読みゲーム</div>
  <button class="start-btn" onclick="showDiffSelect()">スタート</button>
  <div style="margin-top:24px;font-size:12px;opacity:0.4">3ミスでゲームオーバー　スキップ2回まで</div>
</div>

<!-- DIFFICULTY SELECT -->
<div id="diff-screen" class="screen">
  <button class="back-btn" onclick="showScreen('title-screen')">← 戻る</button>
  <div class="screen-title">難易度を選んでね</div>
  <div class="diff-grid">
    <div class="diff-col diff-beginner" onclick="selectDiff('beginner')">
      <h2>初級</h2>
      <div class="sample">日本語</div>
      <div class="sample">学校</div>
      <div class="sample">電話</div>
      <div style="font-size:11px;text-align:center;opacity:0.7;margin-top:4px">漢検5〜4級</div>
    </div>
    <div class="diff-col diff-inter" onclick="selectDiff('inter')">
      <h2>中級</h2>
      <div class="sample">曖昧</div>
      <div class="sample">憂鬱</div>
      <div class="sample">朦朧</div>
      <div style="font-size:11px;text-align:center;opacity:0.7;margin-top:4px">漢検3〜2級</div>
    </div>
    <div class="diff-col diff-adv" onclick="selectDiff('adv')">
      <h2>上級</h2>
      <div class="sample">逡巡</div>
      <div class="sample">頷く</div>
      <div class="sample">聳える</div>
      <div style="font-size:11px;text-align:center;opacity:0.7;margin-top:4px">漢検準1級</div>
    </div>
    <div class="diff-col diff-ultra" onclick="selectDiff('ultra')">
      <h2>ULTRA</h2>
      <div class="sample">彳む</div>
      <div class="sample">霖雨</div>
      <div class="sample">嬰児</div>
      <div style="font-size:11px;text-align:center;opacity:0.7;margin-top:4px">漢検1〜2級</div>
    </div>
    <div class="diff-col diff-geki diff-full-row" onclick="selectDiff('geki')">
      <h2>💀 激ムズ 💀</h2>
      <div style="display:flex;justify-content:center;gap:20px">
        <div class="sample">鸞</div>
        <div class="sample">囃す</div>
        <div class="sample">饕餮</div>
      </div>
      <div style="font-size:11px;text-align:center;opacity:0.7;margin-top:4px">漢検1級クラス・廃人向け</div>
    </div>
  </div>
</div>

<!-- GENRE SELECT -->
<div id="genre-screen" class="screen">
  <button class="back-btn" onclick="showScreen('diff-screen')">← 戻る</button>
  <div class="screen-title">ジャンルを選んでね</div>
  <div class="genre-grid">
    <div class="genre-btn genre-all" onclick="selectGenre('all')">
      <div class="genre-icon">🎯</div>
      <div>すべて</div>
    </div>
    <div class="genre-btn" onclick="selectGenre('plant')">
      <div class="genre-icon">🌿</div>
      <div>植物</div>
    </div>
    <div class="genre-btn" onclick="selectGenre('animal')">
      <div class="genre-icon">🐾</div>
      <div>動物</div>
    </div>
    <div class="genre-btn" onclick="selectGenre('food')">
      <div class="genre-icon">🍱</div>
      <div>食べ物</div>
    </div>
    <div class="genre-btn" onclick="selectGenre('history')">
      <div class="genre-icon">⚔️</div>
      <div>歴史人物</div>
    </div>
    <div class="genre-btn" onclick="selectGenre('place')">
      <div class="genre-icon">🗾</div>
      <div>地名</div>
    </div>
    <div class="genre-btn" onclick="selectGenre('yoji')">
      <div class="genre-icon">📜</div>
      <div>四字熟語</div>
    </div>
  </div>
</div>

<!-- GAME -->
<div id="game-screen" class="screen">
  <div id="game-top">
    <button id="skip-btn" onclick="skipQuestion()">いれかえ <span id="skip-count">×2</span></button>
    <div id="progress-bar-wrap">
      <div style="font-size:11px;opacity:0.6;text-align:center;margin-bottom:2px"><span id="q-num">1</span>/10問</div>
      <div id="progress-bar"><div id="progress-fill" style="width:10%"></div></div>
    </div>
    <div id="lives-display">
      <span class="life-icon" id="life-0">❤️</span>
      <span class="life-icon" id="life-1">❤️</span>
      <span class="life-icon" id="life-2">❤️</span>
    </div>
  </div>
  <div id="question-area">
    <div id="mode-badge"></div>
    <div id="timer-ring">
      <svg id="timer-svg" viewBox="0 0 70 70">
        <circle id="timer-track" cx="35" cy="35" r="27"/>
        <circle id="timer-prog" cx="35" cy="35" r="27"/>
      </svg>
      <div id="timer-num">10</div>
    </div>
    <div id="kanji-display-wrap">
      <div id="kanji-hint"></div>
      <div id="kanji-word">漢字</div>
    </div>
    <div id="combo-display"></div>
    <div id="answer-wrap">
      <input id="answer-input" type="text" inputmode="text" autocomplete="off" autocorrect="off" spellcheck="false" placeholder="読みを入力してください" onkeydown="if(event.key==='Enter')submitAnswer()">
      <button id="submit-btn" onclick="submitAnswer()">→</button>
    </div>
  </div>
</div>

<!-- FEEDBACK OVERLAY -->
<div id="feedback"><div id="feedback-text"></div></div>
<div id="answer-reveal"></div>

<!-- RESULT -->
<div id="result-screen" class="screen">
  <div id="result-title"></div>
  <div class="result-stats">
    <div class="stat-row"><span>正解数</span><span class="stat-val" id="res-correct">-</span></div>
    <div class="stat-row"><span>ミス数</span><span class="stat-val" id="res-wrong">-</span></div>
    <div class="stat-row"><span>最大コンボ</span><span class="stat-val" id="res-combo">-</span></div>
    <div class="stat-row"><span>スキップ使用</span><span class="stat-val" id="res-skip">-</span></div>
    <div class="stat-row"><span>ランク</span><span class="stat-val" id="res-rank">-</span></div>
  </div>
  <div class="result-btns">
    <button class="result-btn btn-retry" onclick="retryGame()">もう一度</button>
    <button class="result-btn btn-menu" onclick="showScreen('title-screen')">メニュー</button>
  </div>
</div>

<script>
// ===== KANJI DATABASE =====
// Format: {w: "word", r: "reading", hint: "optional hint", g: "genre", d: "difficulty"}
// d: beginner/inter/adv/ultra/geki
// g: general/plant/animal/food/history/place/yoji

const DB = [
  // ===== BEGINNER =====
  {w:'日本語',r:'にほんご',g:'general',d:'beginner'},{w:'学校',r:'がっこう',g:'general',d:'beginner'},
  {w:'電話',r:'でんわ',g:'general',d:'beginner'},{w:'新聞',r:'しんぶん',g:'general',d:'beginner'},
  {w:'時計',r:'とけい',g:'general',d:'beginner'},{w:'家族',r:'かぞく',g:'general',d:'beginner'},
  {w:'友達',r:'ともだち',g:'general',d:'beginner'},{w:'食事',r:'しょくじ',g:'general',d:'beginner'},
  {w:'音楽',r:'おんがく',g:'general',d:'beginner'},{w:'映画',r:'えいが',g:'general',d:'beginner'},
  {w:'図書館',r:'としょかん',g:'general',d:'beginner'},{w:'病院',r:'びょういん',g:'general',d:'beginner'},
  {w:'電車',r:'でんしゃ',g:'general',d:'beginner'},{w:'飛行機',r:'ひこうき',g:'general',d:'beginner'},
  {w:'旅行',r:'りょこう',g:'general',d:'beginner'},
  // Plants
  {w:'桜',r:'さくら',g:'plant',d:'beginner'},{w:'梅',r:'うめ',g:'plant',d:'beginner'},
  {w:'松',r:'まつ',g:'plant',d:'beginner'},{w:'竹',r:'たけ',g:'plant',d:'beginner'},
  {w:'杉',r:'すぎ',g:'plant',d:'beginner'},{w:'菊',r:'きく',g:'plant',d:'beginner'},
  // Animals
  {w:'猫',r:'ねこ',g:'animal',d:'beginner'},{w:'犬',r:'いぬ',g:'animal',d:'beginner'},
  {w:'馬',r:'うま',g:'animal',d:'beginner'},{w:'象',r:'ぞう',g:'animal',d:'beginner'},
  {w:'鷹',r:'たか',g:'animal',d:'beginner'},{w:'亀',r:'かめ',g:'animal',d:'beginner'},
  // Food
  {w:'寿司',r:'すし',g:'food',d:'beginner'},{w:'天婦羅',r:'てんぷら',g:'food',d:'beginner'},
  {w:'味噌汁',r:'みそしる',g:'food',d:'beginner'},{w:'蕎麦',r:'そば',g:'food',d:'beginner'},
  // Place
  {w:'東京',r:'とうきょう',g:'place',d:'beginner'},{w:'大阪',r:'おおさか',g:'place',d:'beginner'},
  {w:'京都',r:'きょうと',g:'place',d:'beginner'},{w:'北海道',r:'ほっかいどう',g:'place',d:'beginner'},
  // History
  {w:'織田信長',r:'おだのぶなが',g:'history',d:'beginner',hint:'戦国大名'},
  {w:'徳川家康',r:'とくがわいえやす',g:'history',d:'beginner',hint:'江戸幕府初代将軍'},
  {w:'豊臣秀吉',r:'とよとみひでよし',g:'history',d:'beginner',hint:'天下人'},
  // Yoji
  {w:'一石二鳥',r:'いっせきにちょう',g:'yoji',d:'beginner'},{w:'七転八起',r:'しちてんはっき',g:'yoji',d:'beginner'},
  {w:'十人十色',r:'じゅうにんといろ',g:'yoji',d:'beginner'},{w:'一期一会',r:'いちごいちえ',g:'yoji',d:'beginner'},

  // ===== INTERMEDIATE =====
  {w:'曖昧',r:'あいまい',g:'general',d:'inter'},{w:'憂鬱',r:'ゆううつ',g:'general',d:'inter'},
  {w:'朦朧',r:'もうろう',g:'general',d:'inter'},{w:'拘束',r:'こうそく',g:'general',d:'inter'},
  {w:'幽霊',r:'ゆうれい',g:'general',d:'inter'},{w:'薔薇',r:'ばら',g:'plant',d:'inter'},
  {w:'藤',r:'ふじ',g:'plant',d:'inter'},{w:'蓮',r:'はす',g:'plant',d:'inter'},
  {w:'紫陽花',r:'あじさい',g:'plant',d:'inter'},{w:'向日葵',r:'ひまわり',g:'plant',d:'inter'},
  {w:'鶯',r:'うぐいす',g:'animal',d:'inter'},{w:'麒麟',r:'きりん',g:'animal',d:'inter'},
  {w:'河馬',r:'かば',g:'animal',d:'inter'},{w:'鰐',r:'わに',g:'animal',d:'inter'},
  {w:'蛸',r:'たこ',g:'food',d:'inter'},{w:'鰹',r:'かつお',g:'food',d:'inter'},
  {w:'鰻',r:'うなぎ',g:'food',d:'inter'},{w:'牡蠣',r:'かき',g:'food',d:'inter'},
  {w:'伊勢',r:'いせ',g:'place',d:'inter'},{w:'出雲',r:'いずも',g:'place',d:'inter'},
  {w:'熊野',r:'くまの',g:'place',d:'inter'},{w:'長崎',r:'ながさき',g:'place',d:'inter'},
  {w:'宮本武蔵',r:'みやもとむさし',g:'history',d:'inter',hint:'剣豪'},
  {w:'上杉謙信',r:'うえすぎけんしん',g:'history',d:'inter',hint:'越後の龍'},
  {w:'武田信玄',r:'たけだしんげん',g:'history',d:'inter',hint:'甲斐の虎'},
  {w:'明鏡止水',r:'めいきょうしすい',g:'yoji',d:'inter'},{w:'温故知新',r:'おんこちしん',g:'yoji',d:'inter'},
  {w:'臥薪嘗胆',r:'がしんしょうたん',g:'yoji',d:'inter'},{w:'虎視眈々',r:'こしたんたん',g:'yoji',d:'inter'},

// ===== GAME STATE =====
const G = {
  diff:'beginner', genre:'all', questions:[], qi:0,
  score:0, wrongs:0, skips:2, combo:0, maxCombo:0,
  timer:null, timeLeft:10, skipUsed:0
};

const DIFF_LABELS = {beginner:'初級',inter:'中級',adv:'上級',ultra:'ULTRA',geki:'激ムズ💀'};
const DIFF_TIMES = {beginner:15, inter:12, adv:10, ultra:8, geki:7};

// ===== SCREEN MANAGER =====
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function showDiffSelect() { showScreen('diff-screen'); }
function selectDiff(d) { G.diff=d; showScreen('genre-screen'); }
function selectGenre(g) { G.genre=g; startGame(); }

// ===== GAME LOGIC =====
function startGame() {
  // Filter questions
  let pool = DB.filter(q => q.d === G.diff && (G.genre==='all' || q.g===G.genre));
  if (pool.length < 5) pool = DB.filter(q => q.d === G.diff); // fallback
  // Shuffle and take 10
  pool = pool.sort(()=>Math.random()-0.5).slice(0,10);
  G.questions = pool;
  G.qi=0; G.score=0; G.wrongs=0; G.skips=2; G.combo=0; G.maxCombo=0; G.skipUsed=0;

  updateLives();
  document.getElementById('skip-count').textContent = '×'+G.skips;
  document.getElementById('skip-btn').disabled = false;
  document.getElementById('mode-badge').textContent = DIFF_LABELS[G.diff]+' / '+(G.genre==='all'?'全ジャンル':document.querySelector(`[onclick="selectGenre('${G.genre}')"] div:last-child`)?.textContent||'');

  showScreen('game-screen');
  showQuestion();
}

function showQuestion() {
  if (G.qi >= G.questions.length) { endGame(false); return; }
  const q = G.questions[G.qi];
  document.getElementById('kanji-word').textContent = q.w;
  document.getElementById('kanji-word').className = '';
  document.getElementById('kanji-hint').textContent = q.hint ? `ヒント: ${q.hint}` : '';
  document.getElementById('q-num').textContent = G.qi+1;
  document.getElementById('progress-fill').style.width = ((G.qi+1)/G.questions.length*100)+'%';
  document.getElementById('answer-input').value = '';
  document.getElementById('answer-input').focus();
  startTimer();
}

function startTimer() {
  clearInterval(G.timer);
  G.timeLeft = DIFF_TIMES[G.diff];
  updateTimerDisplay();
  G.timer = setInterval(() => {
    G.timeLeft--;
    updateTimerDisplay();
    if (G.timeLeft <= 0) {
      clearInterval(G.timer);
      handleWrong(true);
    }
  }, 1000);
}

function updateTimerDisplay() {
  const el = document.getElementById('timer-num');
  const prog = document.getElementById('timer-prog');
  const total = DIFF_TIMES[G.diff];
  el.textContent = G.timeLeft;
  const pct = G.timeLeft/total;
  prog.style.strokeDashoffset = 170*(1-pct);
  prog.style.stroke = pct>0.5?'#44cc44':pct>0.25?'#ffcc00':'#ff4444';
  el.style.color = pct>0.5?'#fff':pct>0.25?'#ffcc00':'#ff4444';
}

function normalize(s) {
  // Convert katakana to hiragana, lowercase
  return s.trim().toLowerCase()
    .replace(/[ァ-ヶ]/g, c=>String.fromCharCode(c.charCodeAt(0)-0x60));
}

function submitAnswer() {
  const input = document.getElementById('answer-input').value;
  if (!input.trim()) return;
  const q = G.questions[G.qi];
  const correct = normalize(q.r);
  const given = normalize(input);
  if (given === correct) {
    handleCorrect();
  } else {
    handleWrong(false, input);
  }
}

function handleCorrect() {
  clearInterval(G.timer);
  G.score++; G.combo++;
  if (G.combo > G.maxCombo) G.maxCombo = G.combo;
  document.getElementById('kanji-word').classList.add('correct-anim');
  showFeedback('✅ せいかい！', '#88ff88');
  const comboEl = document.getElementById('combo-display');
  if (G.combo >= 2) { comboEl.textContent = G.combo+'コンボ！🔥'; comboEl.style.opacity='1'; }
  else { comboEl.style.opacity='0'; }
  setTimeout(() => { G.qi++; showQuestion(); }, 900);
}

function handleWrong(timeout=false, given='') {
  clearInterval(G.timer);
  G.wrongs++; G.combo=0;
  document.getElementById('combo-display').style.opacity='0';
  const q = G.questions[G.qi];
  document.getElementById('kanji-word').classList.add('wrong-anim');
  const msg = timeout ? '⏰ タイムオーバー！' : '❌ ミス！';
  showFeedback(msg, '#ff6666');
  // Show correct answer
  const revEl = document.getElementById('answer-reveal');
  revEl.textContent = `正解: ${q.r}`;
  revEl.style.display='block';
  updateLives();
  if (G.wrongs >= 3) {
    setTimeout(() => { revEl.style.display='none'; endGame(true); }, 1500);
  } else {
    setTimeout(() => { revEl.style.display='none'; G.qi++; showQuestion(); }, 1500);
  }
}

function skipQuestion() {
  if (G.skips <= 0) return;
  G.skips--; G.skipUsed++;
  document.getElementById('skip-count').textContent='×'+G.skips;
  if (G.skips<=0) document.getElementById('skip-btn').disabled=true;
  G.combo=0;
  document.getElementById('combo-display').style.opacity='0';
  clearInterval(G.timer);
  showFeedback('⏭ スキップ', '#aaaaff');
  setTimeout(() => { G.qi++; showQuestion(); }, 600);
}

function updateLives() {
  for(let i=0;i<3;i++) {
    const el=document.getElementById('life-'+i);
    el.classList.toggle('lost', i>=3-G.wrongs);
  }
}

function showFeedback(text, color) {
  const fb=document.getElementById('feedback');
  const ft=document.getElementById('feedback-text');
  ft.textContent=text; ft.style.color=color;
  fb.style.display='flex';
  ft.style.animation='none';
  setTimeout(()=>{ ft.style.animation='feedbackPop 0.6s ease forwards'; },10);
  clearTimeout(G._fbTimer);
  G._fbTimer=setTimeout(()=>fb.style.display='none',800);
}

function endGame(outOfLives) {
  clearInterval(G.timer);
  const total=G.questions.length;
  const pct=G.score/Math.max(G.qi,1);
  let rank='D';
  if(G.wrongs===0&&G.skipUsed===0)rank='S+';
  else if(pct>=0.9&&G.wrongs<=1)rank='S';
  else if(pct>=0.8)rank='A';
  else if(pct>=0.6)rank='B';
  else if(pct>=0.4)rank='C';

  document.getElementById('result-title').textContent=outOfLives?'💀 ゲームオーバー':'🎉 クリア！';
  document.getElementById('result-title').style.color=outOfLives?'#ff6666':'#ffcc00';
  document.getElementById('res-correct').textContent=`${G.score}/${G.qi}問`;
  document.getElementById('res-wrong').textContent=`${G.wrongs}回`;
  document.getElementById('res-combo').textContent=`${G.maxCombo}`;
  document.getElementById('res-skip').textContent=`${G.skipUsed}回`;
  document.getElementById('res-rank').textContent=rank;
  showScreen('result-screen');
}

function retryGame() { startGame(); }

// ===== ANIMATED BG =====
(function(){
  const canvas=document.getElementById('bg-canvas');
  const ctx=canvas.getContext('2d');
  const stars=[];
  function resize(){canvas.width=innerWidth;canvas.height=innerHeight;}
  resize(); window.addEventListener('resize',resize);
  for(let i=0;i<100;i++) stars.push({x:Math.random()*innerWidth,y:Math.random()*innerHeight,r:Math.random()*2,spd:Math.random()*0.5+0.1,a:Math.random()});
  function draw(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    ctx.fillStyle='#0a0a1a';
    ctx.fillRect(0,0,canvas.width,canvas.height);
    stars.forEach(s=>{
      s.a+=0.02;
      ctx.globalAlpha=0.4+Math.sin(s.a)*0.4;
      ctx.fillStyle='#aaaaff';
      ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill();
      s.y+=s.spd;
      if(s.y>canvas.height){s.y=0;s.x=Math.random()*canvas.width;}
    });
    ctx.globalAlpha=1;
    requestAnimationFrame(draw);
  }
  draw();
})();
</script>

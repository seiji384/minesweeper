  border-bottom: 2px solid #804000;
  display: flex; justify-content: space-between; align-items: center;
}
.action-bar {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 600;
  display: flex; gap: 6px; padding: 8px 12px 10px;
  background: linear-gradient(0deg, #060412 0%, rgba(10,6,28,0.97) 100%);
  border-top: 1px solid #4030a0;
  box-shadow: 0 -4px 20px rgba(0,0,0,0.85), 0 -1px 0 rgba(112,90,255,0.3);
  flex-wrap: wrap; justify-content: center;
  backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
}
.act-btn {
  padding: 5px 14px; font-size: 11px; border-radius: 14px;
  background: linear-gradient(160deg, #3a2080 0%, #22105a 100%);

  cursor: pointer; font-weight: bold; transition: all 0.15s; touch-action: manipulation;
}
.act-btn:active { transform: scale(0.93); }
.modal-overlay {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,0.78); z-index: 10000;
  justify-content: center; align-items: center; padding: 16px;
}
.modal-overlay.visible { display: flex; }
.modal-box {
  background: linear-gradient(160deg, #1e1248 0%, #0d0830 100%);
  border: 2px solid #7060ff; border-radius: 16px;
  box-shadow: 0 0 40px rgba(112,90,255,0.6), 0 24px 64px rgba(0,0,0,0.9);
  max-width: 360px; width: 100%; max-height: 88vh; overflow-y: auto;
}
.modal-title {
  background: linear-gradient(90deg, #a06008 0%, #f5c842 28%, #ffe870 50%, #f5c842 72%, #a06008 100%);
  color: #3a1a00; font-size: 14px; font-weight: 900; padding: 8px 14px;
  text-align: center; letter-spacing: 2px; border-radius: 14px 14px 0 0;
  display: flex; justify-content: space-between; align-items: center;
}
.modal-close { background: none; border: none; font-size: 18px; cursor: pointer; color: #3a1a00; }
.modal-body { padding: 14px; color: #c0b0e8; font-size: 13px; line-height: 1.6; }
.led {
  background: linear-gradient(160deg, #080518 0%, #040210 100%);
  color: #ff44aa; font-family: 'Courier New', monospace;
  font-size: 22px; font-weight: bold; padding: 3px 10px;
  min-width: 64px; text-align: right; border-radius: 6px; border: 1px solid #4020a0;
  text-shadow: 0 0 10px #ff44aa, 0 0 20px #ff2288;
  box-shadow: inset 0 2px 4px rgba(0,0,0,0.8), 0 0 10px rgba(255,68,170,0.3);
  display: inline-block;
}
.led-label { font-size: 9px; color: #6050a0; display: block; text-align: center; margin-top: 2px; }
.status-panel {
  background: linear-gradient(160deg, #100a30 0%, #08051a 100%);
  border: 1px solid #4030a0; border-radius: 10px;
  padding: 6px 12px; margin: 8px;
  display: flex; justify-content: space-around; align-items: center;
  box-shadow: inset 0 2px 8px rgba(0,0,0,0.6);
}
.led-group { display: flex; flex-direction: column; align-items: center; gap: 2px; }
.content { padding: 8px 8px 4px; }

.hs-table{width:100%;}
.hs-row{display:flex;justify-content:space-between;align-items:center;padding:5px 10px;background:rgba(80,60,180,0.1);border:1px solid rgba(80,60,180,0.2);border-radius:8px;margin:3px 0;}
.hs-period{color:#a090d0;font-size:12px;font-weight:bold;min-width:50px;}
.hs-record{color:#60ff90;font-weight:900;text-shadow:0 0 6px #60ff90;}
.hs-val{color:#4038a0;}

<script>
// Stars
(function(){
  const c=document.getElementById('stars'),ctx=c.getContext('2d');let stars=[];
  function resize(){c.width=window.innerWidth;c.height=window.innerHeight;stars=[];for(let i=0;i<120;i++)stars.push({x:Math.random()*c.width,y:Math.random()*c.height,r:Math.random()*1.5+0.3,a:Math.random(),da:(Math.random()-0.5)*0.008});}
  function draw(){ctx.clearRect(0,0,c.width,c.height);stars.forEach(s=>{s.a=Math.max(0.1,Math.min(1,s.a+s.da));if(s.a<=0.1||s.a>=1)s.da*=-1;ctx.globalAlpha=s.a;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,6.28);ctx.fill();});ctx.globalAlpha=1;requestAnimationFrame(draw);}
  window.addEventListener('resize',resize);resize();draw();
})();

// Visual Viewport fix
const actionBar = document.querySelector('.action-bar');
function fixActionBar() {
  const vv = window.visualViewport;
  if (!vv) return;
  const layoutWidth = document.documentElement.clientWidth || window.innerWidth;
  const scaleRatio = layoutWidth / vv.width;
  const isZoomed = vv.scale > 1.05 || scaleRatio > 1.05;
  if (!isZoomed) {
    actionBar.style.top = actionBar.style.bottom = '';
    actionBar.style.left = actionBar.style.right = '';
    actionBar.style.width = actionBar.style.transform = '';
    actionBar.style.transformOrigin = '';
    return;
  }
  const scale = Math.max(vv.scale, scaleRatio);
  const inv = 1 / scale;
  const barH = actionBar.offsetHeight || 52;
  const layoutW = document.documentElement.clientWidth || Math.round(vv.width * scale);
  actionBar.style.top = Math.round(vv.offsetTop + vv.height - barH) + 'px';
  actionBar.style.bottom = 'auto';
  actionBar.style.left = Math.round(vv.offsetLeft) + 'px';
  actionBar.style.width = layoutW + 'px';
  actionBar.style.right = 'auto';
  actionBar.style.transform = `scale(${inv})`;
  actionBar.style.transformOrigin = 'bottom left';
}
if (window.visualViewport) {
  window.visualViewport.addEventListener('resize', fixActionBar);
  window.visualViewport.addEventListener('scroll', fixActionBar);
  fixActionBar();
}

function openModal(id) { document.getElementById(id).classList.add('visible'); }
function closeModal(id) { document.getElementById(id).classList.remove('visible'); }

function getDateKey(){return new Date().toISOString().slice(0,10);}
function getWeekKey(){const d=new Date(),day=d.getDay()||7,mon=new Date(d);mon.setDate(d.getDate()-day+1);return mon.toISOString().slice(0,10);}
function getMonthKey(){return new Date().toISOString().slice(0,7);}
function fmtDate(s){const p=s.slice(5).split('-');return`${parseInt(p[0])}/${parseInt(p[1])}`;}
function saveHiRec(key,val){
  const today=getDateKey(),wk=getWeekKey(),mo=getMonthKey();
  let d=JSON.parse(localStorage.getItem(key+'_rec')||'{}');
  if(!d.all||val>d.all.v)d.all={v:val,date:today};
  if(!d.today||d.today.date!==today||val>d.today.v)d.today={v:val,date:today};
  if(!d.week||d.week.key!==wk||val>d.week.v)d.week={v:val,key:wk,date:today};
  if(!d.month||d.month.key!==mo||val>d.month.v)d.month={v:val,key:mo,date:today};
  localStorage.setItem(key+'_rec',JSON.stringify(d));
}
function renderHiRec(key,unit){
  const today=getDateKey(),wk=getWeekKey(),mo=getMonthKey();
  const d=JSON.parse(localStorage.getItem(key+'_rec')||'{}');
  const fmt=e=>e?`<span class="hs-record">${e.v}${unit}</span><span class="hs-date">(${fmtDate(e.date)})</span>`:'<span class="hs-val">--</span>';
  const tV=d.today?.date===today?fmt(d.today):'<span class="hs-val">--</span>';
  const wV=d.week?.key===wk?fmt(d.week):'<span class="hs-val">--</span>';
  const mV=d.month?.key===mo?fmt(d.month):'<span class="hs-val">--</span>';
  return`<div class="hs-table"><div class="hs-row"><span class="hs-period">本日</span>${tV}</div><div class="hs-row"><span class="hs-period">今週</span>${wV}</div><div class="hs-row"><span class="hs-period">今月</span>${mV}</div><div class="hs-row"><span class="hs-period">全期間</span>${fmt(d.all)}</div></div>`;
}

// Game
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// Physics constants
const GRAVITY = 0.35;
const FLAP_VEL = -7;
const PIPE_GAP = 130;
const PIPE_WIDTH = 52;
const GROUND_H = 40;

let W, H;
let bird, pipes, score, best, gameState, pipeSpeed, frameCount;
let bgStars = [];
let animFrame;

function setupCanvas() {
  const wrap = canvas.parentElement;
  W = Math.min(wrap.clientWidth - 8, 452);
  const availH = Math.floor(window.innerHeight * 0.70);
  H = Math.min(Math.max(400, availH), Math.round(W * 1.5));
  canvas.width = W;
  canvas.height = H;
}

function initBgStars() {
  bgStars = [];
  for (let i = 0; i < 60; i++) {
    bgStars.push({
      x: Math.random() * W,
      y: Math.random() * (H - GROUND_H),
      r: Math.random() * 1.2 + 0.3,
      a: Math.random() * 0.7 + 0.3,
      da: (Math.random() - 0.5) * 0.012
    });
  }
}

function resetGame() {
  bird = {
    x: W * 0.22,
    y: H / 2,
    vy: 0,
    rotation: 0
  };
  pipes = [];
  score = 0;
  frameCount = 0;
  pipeSpeed = 2.5;
  best = parseInt(localStorage.getItem('flappy_best') || '0');
  updateLEDs();
}

function initGame() {
  setupCanvas();
  initBgStars();
  resetGame();
  gameState = 'idle';
  draw();
}

function startGame() {
  resetGame();
  gameState = 'running';
  gameLoop();
}

function flap() {
  if (gameState === 'idle' || gameState === 'over') {
    startGame();
    return;
  }
  if (gameState === 'running') {
    bird.vy = FLAP_VEL;
  }
}

function updateLEDs() {
  document.getElementById('score-led').textContent = score;
  document.getElementById('best-led').textContent = Math.max(best, score);
  document.getElementById('pipes-led').textContent = pipes.filter(p=>p.passed).length;
}

function getRandomGapY(gapSize) {
  const margin = 55;
  const min = margin + gapSize / 2;
  const max = H - GROUND_H - margin - gapSize / 2;
  return Math.random() * (max - min) + min;
}

function spawnPipe() {
  // Pipe types: normal, narrow (smaller gap), moving (oscillates vertically), wide (wider pipe body)
  const pool = ['normal','normal','normal'];
  if (score >= 5)  pool.push('narrow');
  if (score >= 8)  pool.push('moving');
  if (score >= 15) pool.push('narrow','moving','wide');
  const type = pool[Math.floor(Math.random() * pool.length)];
  const gapDelta = type === 'narrow' ? -28 : 0;
  const gapSize = Math.max(90, PIPE_GAP + gapDelta);
  const pipeW = type === 'wide' ? PIPE_WIDTH + 18 : PIPE_WIDTH;
  const gapY = getRandomGapY(gapSize);
  const moveVy = type === 'moving' ? (Math.random() < 0.5 ? 1.0 : -1.0) : 0;
  pipes.push({ x: W + pipeW, gapY, gapSize, pipeW, type, moveVy, passed: false });
}

function gameLoop() {
  if (gameState !== 'running') return;
  update();
  draw();
  animFrame = requestAnimationFrame(gameLoop);
}

function update() {
  frameCount++;

  // Animate bg stars
  bgStars.forEach(s => {
    s.a = Math.max(0.1, Math.min(1, s.a + s.da));
    if (s.a <= 0.1 || s.a >= 1) s.da *= -1;
  });

  // Bird physics
  bird.vy += GRAVITY;
  bird.y += bird.vy;
  bird.rotation = Math.min(Math.PI * 0.4, Math.max(-Math.PI * 0.4, bird.vy * 0.08));

  // Spawn pipes
  const pipeInterval = Math.max(80, 120 - Math.floor(score / 5) * 4);
  if (frameCount % pipeInterval === 0) {
    spawnPipe();
  }

  // Speed increase every 10 pipes
  const passed = pipes.filter(p=>p.passed).length;
  pipeSpeed = 2.5 + Math.floor(passed / 10) * 0.2;

  // Move pipes
  pipes.forEach(p => { p.x -= pipeSpeed; });

  // Moving pipes oscillate vertically
  pipes.forEach(p => {
    if (p.type === 'moving') {
      p.gapY += p.moveVy;
      const minG = 65 + p.gapSize / 2;
      const maxG = H - GROUND_H - 65 - p.gapSize / 2;
      if (p.gapY < minG || p.gapY > maxG) p.moveVy *= -1;
    }
  });

  // Remove off-screen pipes
  pipes = pipes.filter(p => p.x + p.pipeW > -10);

  // Score
  pipes.forEach(p => {
    if (!p.passed && p.x + p.pipeW < bird.x) {
      p.passed = true;
      score++;
      updateLEDs();
    }
  });

  // Collision: floor / ceiling
  if (bird.y - 11 < 0 || bird.y + 11 > H - GROUND_H) {
    endGame(); return;
  }

  // Collision: pipes
  const bx = bird.x, by = bird.y, br = 10;
  for (const p of pipes) {
    const px = p.x, pw = p.pipeW, gs = p.gapSize;
    const topH = p.gapY - gs / 2;
    const botY = p.gapY + gs / 2;
    if (bx + br > px && bx - br < px + pw) {
      if (by - br < topH || by + br > botY) { endGame(); return; }
    }
  }
}

function endGame() {
  gameState = 'over';
  cancelAnimationFrame(animFrame);
  best = Math.max(best, score);
  localStorage.setItem('flappy_best', best);
  saveHiRec('flappy', score);
  updateLEDs();
  draw();
}

function drawPipe(p) {
  const x = p.x, gapY = p.gapY, gapSize = p.gapSize, pipeW = p.pipeW;
  const topH = gapY - gapSize / 2;
  const botY = gapY + gapSize / 2;
  const botH = H - GROUND_H - botY;
  const capH = 14;

  // Shadow color varies by type
  const shadowCol = p.type === 'moving' ? '#ff80ff' : '#7060ff';

  // Pipe gradient
  function makePipeGrad(y, h) {
    const g = ctx.createLinearGradient(x, y, x + pipeW, y);
    if (p.type === 'wide') {
      g.addColorStop(0, '#3a1840');
      g.addColorStop(0.3, '#6a3060');
      g.addColorStop(0.7, '#4a2050');
      g.addColorStop(1, '#1a0830');
    } else {
      g.addColorStop(0, '#2a1860');
      g.addColorStop(0.3, '#4a30a0');
      g.addColorStop(0.7, '#3a2080');
      g.addColorStop(1, '#1a0840');
    }
    return g;
  }

  // Top pipe body
  if (topH > 0) {
    ctx.save();
    ctx.shadowColor = shadowCol;
    ctx.shadowBlur = 10;
    ctx.fillStyle = makePipeGrad(0, topH);
    ctx.beginPath();
    ctx.roundRect(x + 3, 0, pipeW - 6, topH - capH, [0, 0, 0, 0]);
    ctx.fill();

    // Top pipe cap
    ctx.fillStyle = makePipeGrad(0, capH);
    ctx.beginPath();
    ctx.roundRect(x, topH - capH, pipeW, capH, [0, 0, 4, 4]);
    ctx.fill();

    // Border (brighter for narrow)
    ctx.shadowBlur = 0;
    ctx.strokeStyle = p.type === 'narrow' ? '#ffcc00' : '#f5c842';
    ctx.lineWidth = p.type === 'narrow' ? 2 : 1.5;
    ctx.globalAlpha = p.type === 'narrow' ? 0.8 : 0.5;
    ctx.strokeRect(x, 0, pipeW, topH);
    ctx.globalAlpha = 1;

    // Narrow warning indicator
    if (p.type === 'narrow') {
      ctx.font = '13px Arial';
      ctx.textAlign = 'center';
      ctx.fillStyle = '#ffcc00';
      ctx.shadowColor = '#ffcc00';
      ctx.shadowBlur = 6;
      ctx.fillText('⚠', x + pipeW / 2, Math.max(14, topH - capH - 4));
      ctx.shadowBlur = 0;
    }

    ctx.restore();
  }

  // Bottom pipe body
  if (botH > 0) {
    ctx.save();
    ctx.shadowColor = shadowCol;
    ctx.shadowBlur = 10;
    ctx.fillStyle = makePipeGrad(botY, botH);
    ctx.beginPath();
    ctx.roundRect(x + 3, botY + capH, pipeW - 6, botH - capH, [0, 0, 0, 0]);
    ctx.fill();

    // Bottom pipe cap
    ctx.fillStyle = makePipeGrad(botY, capH);
    ctx.beginPath();
    ctx.roundRect(x, botY, pipeW, capH, [4, 4, 0, 0]);
    ctx.fill();

    ctx.shadowBlur = 0;
    ctx.strokeStyle = p.type === 'narrow' ? '#ffcc00' : '#f5c842';
    ctx.lineWidth = p.type === 'narrow' ? 2 : 1.5;
    ctx.globalAlpha = p.type === 'narrow' ? 0.8 : 0.5;
    ctx.strokeRect(x, botY, pipeW, botH);
    ctx.globalAlpha = 1;

    // Narrow warning indicator on bottom cap
    if (p.type === 'narrow') {
      ctx.font = '13px Arial';
      ctx.textAlign = 'center';
      ctx.fillStyle = '#ffcc00';
      ctx.shadowColor = '#ffcc00';
      ctx.shadowBlur = 6;
      ctx.fillText('⚠', x + pipeW / 2, Math.min(H - GROUND_H - 4, botY + capH + 14));
      ctx.shadowBlur = 0;
    }

    ctx.restore();
  }
}

function draw() {
  // Background
  const bgGrad = ctx.createLinearGradient(0, 0, 0, H);
  bgGrad.addColorStop(0, '#06021a');
  bgGrad.addColorStop(0.7, '#08031e');
  bgGrad.addColorStop(1, '#100828');
  ctx.fillStyle = bgGrad;
  ctx.fillRect(0, 0, W, H);

  // Background glow blobs
  ctx.save();
  ctx.globalAlpha = 0.12;
  const g1 = ctx.createRadialGradient(W*0.2, H*0.3, 0, W*0.2, H*0.3, W*0.4);
  g1.addColorStop(0, '#5020c0'); g1.addColorStop(1, 'transparent');
  ctx.fillStyle = g1; ctx.fillRect(0,0,W,H);
  const g2 = ctx.createRadialGradient(W*0.8, H*0.7, 0, W*0.8, H*0.7, W*0.35);
  g2.addColorStop(0, '#2040c0'); g2.addColorStop(1, 'transparent');
  ctx.fillStyle = g2; ctx.fillRect(0,0,W,H);
  ctx.restore();

  // Bg stars
  bgStars.forEach(s => {
    ctx.globalAlpha = s.a;
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI*2);
    ctx.fill();
  });
  ctx.globalAlpha = 1;

  // Pipes
  pipes.forEach(p => drawPipe(p));

  // Ground
  const groundGrad = ctx.createLinearGradient(0, H - GROUND_H, 0, H);
  groundGrad.addColorStop(0, '#1a0a30');
  groundGrad.addColorStop(0.3, '#120820');
  groundGrad.addColorStop(1, '#080410');
  ctx.fillStyle = groundGrad;
  ctx.fillRect(0, H - GROUND_H, W, GROUND_H);

  // Ground border
  ctx.save();
  ctx.shadowColor = '#7060ff';
  ctx.shadowBlur = 8;
  ctx.strokeStyle = '#5040c0';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(0, H - GROUND_H);
  ctx.lineTo(W, H - GROUND_H);
  ctx.stroke();
  ctx.restore();

  // Ground texture dots
  ctx.fillStyle = 'rgba(80,60,180,0.2)';
  for (let gx = 8; gx < W; gx += 16) {
    ctx.beginPath();
    ctx.arc(gx, H - GROUND_H + 8, 2, 0, Math.PI*2);
    ctx.fill();
  }

  // Bird
  ctx.save();
  ctx.translate(bird.x, bird.y);
  ctx.rotate(bird.rotation);
  ctx.shadowColor = '#60ffff';
  ctx.shadowBlur = 16;
  ctx.fillStyle = '#40e0ff';
  ctx.beginPath();
  ctx.ellipse(0, 0, 14, 11, 0, 0, Math.PI*2);
  ctx.fill();

  // Wing
  ctx.shadowBlur = 0;
  ctx.fillStyle = '#20b0e0';
  ctx.beginPath();
  ctx.ellipse(-2, 3, 8, 5, -0.3, 0, Math.PI*2);
  ctx.fill();

  // Eye
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(6, -3, 3.5, 0, Math.PI*2);
  ctx.fill();
  ctx.fillStyle = '#001830';
  ctx.beginPath();
  ctx.arc(7, -3, 1.8, 0, Math.PI*2);
  ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.7)';
  ctx.beginPath();
  ctx.arc(7.5, -4, 0.8, 0, Math.PI*2);
  ctx.fill();

  // Beak
  ctx.fillStyle = '#f5c842';
  ctx.beginPath();
  ctx.moveTo(13, -1);
  ctx.lineTo(20, 1);
  ctx.lineTo(13, 3);
  ctx.closePath();
  ctx.fill();
  ctx.restore();

  // Score on canvas
  if (gameState === 'running' || gameState === 'over') {
    ctx.save();
    ctx.font = `bold ${Math.round(W*0.07)}px 'Courier New', monospace`;
    ctx.textAlign = 'center';
    ctx.fillStyle = 'rgba(0,0,0,0.4)';
    ctx.fillText(score, W/2 + 2, 42);
    ctx.shadowColor = '#ffe870';
    ctx.shadowBlur = 12;
    ctx.fillStyle = '#ffe870';
    ctx.fillText(score, W/2, 40);
    ctx.restore();
  }

  // Overlays
  if (gameState === 'idle') {
    drawOverlay('フラッピーバード', 'タップでスタート', null);
  } else if (gameState === 'over') {
    drawOverlay('ゲームオーバー', 'タップで再スタート', score);
  }
}

function drawOverlay(title, sub, scoreVal) {
  // Semi-transparent backdrop
  ctx.save();
  ctx.fillStyle = 'rgba(4,2,14,0.72)';
  ctx.fillRect(0, 0, W, H - GROUND_H);

  const cx = W / 2;
  const cy = (H - GROUND_H) / 2;

  // Box
  const bw = W * 0.76, bh = scoreVal !== null ? 130 : 100;
  const bx = cx - bw/2, by = cy - bh/2;
  ctx.shadowColor = '#7060ff';
  ctx.shadowBlur = 20;
  ctx.fillStyle = 'rgba(20,10,50,0.95)';
  roundRect(ctx, bx, by, bw, bh, 14);
  ctx.fill();
  ctx.shadowBlur = 0;
  ctx.strokeStyle = '#7060ff';
  ctx.lineWidth = 2;
  roundRect(ctx, bx, by, bw, bh, 14);
  ctx.stroke();

  // Title
  ctx.shadowColor = '#ffe870';
  ctx.shadowBlur = 14;
  ctx.fillStyle = '#ffe870';
  ctx.font = `bold ${Math.round(W*0.065)}px Arial`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(title, cx, by + 30);

  if (scoreVal !== null) {
    ctx.shadowColor = '#ff44aa';
    ctx.shadowBlur = 10;
    ctx.fillStyle = '#ff44aa';
    ctx.font = `bold ${Math.round(W*0.095)}px 'Courier New'`;
    ctx.fillText(scoreVal, cx, cy + 6);
  }

  // Sub
  ctx.shadowColor = '#b898ff';
  ctx.shadowBlur = 6;
  ctx.fillStyle = '#b898ff';
  ctx.font = `${Math.round(W*0.038)}px Arial`;
  ctx.fillText(sub, cx, by + bh - 22);
  ctx.restore();
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

function showHiScore() {
  document.getElementById('hiscore-body').innerHTML =
    `<p style="text-align:center;margin-bottom:12px;color:#ffe870;font-weight:bold;">🏆 フラッピーバード ハイスコア</p>` +
    renderHiRec('flappy', '点');
  openModal('hiscore-modal');
}

// Input
canvas.addEventListener('click', () => flap());
canvas.addEventListener('touchstart', (e) => { e.preventDefault(); flap(); }, {passive:false});
document.addEventListener('keydown', (e) => {
  if (e.code === 'Space' || e.code === 'ArrowUp') {
    e.preventDefault();
    flap();
  }
});

// Resize
window.addEventListener('resize', () => {
  initGame();
});

// Init
initGame();
</script>

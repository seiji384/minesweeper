<title>フラッピーバード</title>
<style>
:root {
  --bg: #0f0f1a;
  --bg2: #1a1a2e;
  --panel: rgba(30,30,53,0.95);
  --accent: #e63946;
  --text: #ffffff;
  --text-sub: #aaaacc;
  --radius: 14px;
  --shadow: 0 8px 32px rgba(0,0,0,0.5);
}
* { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
body {
  background: var(--bg);
  display: flex; justify-content: center; align-items: flex-start;
  min-height: 100vh; padding: 4px 4px 80px;
  font-family: 'Helvetica Neue', Arial, sans-serif; overflow-x: hidden;
  color: var(--text);
}
#stars { position: fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:0; }
.window {
  position: relative; z-index: 1;
  background: var(--panel);
  border: 2px solid var(--accent); border-radius: var(--radius);
  box-shadow: 0 0 30px rgba(230,57,70,0.3), 0 0 80px rgba(230,57,70,0.1), var(--shadow);
  max-width: 460px; width: 100%; overflow: hidden;
  backdrop-filter: blur(20px);
}
.titlebar {
  background: linear-gradient(90deg, rgba(230,57,70,0.1) 0%, rgba(230,57,70,0.25) 50%, rgba(230,57,70,0.1) 100%);
  color: var(--accent); font-size: 16px; font-weight: 900; padding: 10px 14px;
  text-align: center; letter-spacing: 3px;
  border-bottom: 1px solid rgba(230,57,70,0.3);
  display: flex; justify-content: space-between; align-items: center;
  text-shadow: 0 0 20px rgba(230,57,70,0.8);
}
.action-bar {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 600;
  display: flex; gap: 8px; padding: 10px 12px 14px;
  background: rgba(15,15,26,0.97);
  border-top: 1px solid rgba(230,57,70,0.2);
  box-shadow: 0 -8px 32px rgba(0,0,0,0.8);
  flex-wrap: wrap; justify-content: center;
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
}
.act-btn {
  background: linear-gradient(135deg, var(--accent), color-mix(in srgb, var(--accent) 60%, white));
  border: none; border-radius: var(--radius);
  color: #1a0008; font-size: 12px; font-weight: 700;
  padding: 8px 16px; cursor: pointer;
  touch-action: manipulation;
  transition: transform 0.15s cubic-bezier(0.34,1.56,0.64,1), box-shadow 0.15s;
  box-shadow: 0 4px 16px rgba(230,57,70,0.3); letter-spacing: 0.5px;
}
.act-btn:active { transform: scale(0.94); box-shadow: 0 2px 8px rgba(0,0,0,0.2); }
.modal-overlay {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,0.78); z-index: 10000;
  justify-content: center; align-items: center; padding: 16px;
}
.modal-overlay.visible { display: flex; }
.modal-box {
  background: linear-gradient(160deg, #1e1248 0%, #0d0830 100%);
  border: 2px solid #7060ff; border-radius: 16px;
  box-shadow: 0 0 40px rgba(112,90,255,0.6), 0 24px 64px rgba(0,0,0,0.9);
  max-width: 360px; width: 100%; max-height: 88vh; overflow-y: auto;
}
.modal-title {
  background: linear-gradient(90deg, #a06008 0%, #f5c842 28%, #ffe870 50%, #f5c842 72%, #a06008 100%);
  color: #3a1a00; font-size: 14px; font-weight: 900; padding: 8px 14px;
  text-align: center; letter-spacing: 2px; border-radius: 14px 14px 0 0;
  display: flex; justify-content: space-between; align-items: center;
}
.modal-close { background: none; border: none; font-size: 18px; cursor: pointer; color: #3a1a00; }
.modal-body { padding: 14px; color: #c0b0e8; font-size: 13px; line-height: 1.6; }
.led {
  font-size: 28px; font-weight: 900; color: var(--accent);
  text-shadow: 0 0 20px rgba(230,57,70,0.8); display: inline-block;
}
.led-label { font-size: 11px; color: var(--text-sub); display: block; text-align: center; letter-spacing: 1px; text-transform: uppercase; }
.status-panel {
  background: var(--panel);
  border: 1px solid rgba(255,255,255,0.08); border-radius: var(--radius);
  padding: 12px 20px; margin: 8px;
  display: flex; justify-content: space-around; align-items: center;
  backdrop-filter: blur(10px);
}
.led-group { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.content { padding: 8px 8px 4px; }

.hs-table{width:100%;}
.hs-row{display:flex;justify-content:space-between;align-items:center;padding:5px 10px;background:rgba(80,60,180,0.1);border:1px solid rgba(80,60,180,0.2);border-radius:8px;margin:3px 0;}
.hs-period{color:#a090d0;font-size:12px;font-weight:bold;min-width:50px;}
.hs-record{color:#60ff90;font-weight:900;text-shadow:0 0 6px #60ff90;}
.hs-val{color:#4038a0;}
.hs-date{color:#7060a0;font-size:9px;margin-left:4px;}

/* Canvas */
#gameCanvas {
  display: block;
  border-radius: 8px;
  border: 1px solid #3020a0;
  box-shadow: 0 0 20px rgba(112,90,255,0.3);
  width: 100%;
  cursor: pointer;
  touch-action: none;
  -webkit-tap-highlight-color: transparent;
}

<script>
// Stars
(function(){
  const c=document.getElementById('stars'),ctx=c.getContext('2d');let stars=[];
  function resize(){c.width=window.innerWidth;c.height=window.innerHeight;stars=[];for(let i=0;i<120;i++)stars.push({x:Math.random()*c.width,y:Math.random()*c.height,r:Math.random()*1.5+0.3,a:Math.random(),da:(Math.random()-0.5)*0.008});}
  function draw(){ctx.clearRect(0,0,c.width,c.height);stars.forEach(s=>{s.a=Math.max(0.1,Math.min(1,s.a+s.da));if(s.a<=0.1||s.a>=1)s.da*=-1;ctx.globalAlpha=s.a;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,6.28);ctx.fill();});ctx.globalAlpha=1;requestAnimationFrame(draw);}
  window.addEventListener('resize',resize);resize();draw();
})();

// Visual Viewport fix
const actionBar = document.querySelector('.action-bar');
function fixActionBar() {
  const vv = window.visualViewport;
  if (!vv) return;
  const layoutWidth = document.documentElement.clientWidth || window.innerWidth;
  const scaleRatio = layoutWidth / vv.width;
  const isZoomed = vv.scale > 1.05 || scaleRatio > 1.05;
  if (!isZoomed) {
    actionBar.style.top = actionBar.style.bottom = '';
    actionBar.style.left = actionBar.style.right = '';
    actionBar.style.width = actionBar.style.transform = '';
    actionBar.style.transformOrigin = '';
    return;
  }
  const scale = Math.max(vv.scale, scaleRatio);
  const inv = 1 / scale;
  const barH = actionBar.offsetHeight || 52;
  const layoutW = document.documentElement.clientWidth || Math.round(vv.width * scale);
  actionBar.style.top = Math.round(vv.offsetTop + vv.height - barH) + 'px';
  actionBar.style.bottom = 'auto';
  actionBar.style.left = Math.round(vv.offsetLeft) + 'px';
  actionBar.style.width = layoutW + 'px';
  actionBar.style.right = 'auto';
  actionBar.style.transform = `scale(${inv})`;
  actionBar.style.transformOrigin = 'bottom left';
}
if (window.visualViewport) {
  window.visualViewport.addEventListener('resize', fixActionBar);
  window.visualViewport.addEventListener('scroll', fixActionBar);
  fixActionBar();
}

function openModal(id) { document.getElementById(id).classList.add('visible'); }
function closeModal(id) { document.getElementById(id).classList.remove('visible'); }

function getDateKey(){return new Date().toISOString().slice(0,10);}
function getWeekKey(){const d=new Date(),day=d.getDay()||7,mon=new Date(d);mon.setDate(d.getDate()-day+1);return mon.toISOString().slice(0,10);}
function getMonthKey(){return new Date().toISOString().slice(0,7);}
function fmtDate(s){const p=s.slice(5).split('-');return`${parseInt(p[0])}/${parseInt(p[1])}`;}
function saveHiRec(key,val){
  const today=getDateKey(),wk=getWeekKey(),mo=getMonthKey();
  let d=JSON.parse(localStorage.getItem(key+'_rec')||'{}');
  if(!d.all||val>d.all.v)d.all={v:val,date:today};
  if(!d.today||d.today.date!==today||val>d.today.v)d.today={v:val,date:today};
  if(!d.week||d.week.key!==wk||val>d.week.v)d.week={v:val,key:wk,date:today};
  if(!d.month||d.month.key!==mo||val>d.month.v)d.month={v:val,key:mo,date:today};
  localStorage.setItem(key+'_rec',JSON.stringify(d));
}
function renderHiRec(key,unit){
  const today=getDateKey(),wk=getWeekKey(),mo=getMonthKey();
  const d=JSON.parse(localStorage.getItem(key+'_rec')||'{}');
  const fmt=e=>e?`<span class="hs-record">${e.v}${unit}</span><span class="hs-date">(${fmtDate(e.date)})</span>`:'<span class="hs-val">--</span>';
  const tV=d.today?.date===today?fmt(d.today):'<span class="hs-val">--</span>';
  const wV=d.week?.key===wk?fmt(d.week):'<span class="hs-val">--</span>';
  const mV=d.month?.key===mo?fmt(d.month):'<span class="hs-val">--</span>';
  return`<div class="hs-table"><div class="hs-row"><span class="hs-period">本日</span>${tV}</div><div class="hs-row"><span class="hs-period">今週</span>${wV}</div><div class="hs-row"><span class="hs-period">今月</span>${mV}</div><div class="hs-row"><span class="hs-period">全期間</span>${fmt(d.all)}</div></div>`;
}

// Game
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// Physics constants
const GRAVITY = 0.35;
const FLAP_VEL = -7;
const PIPE_GAP = 130;
const PIPE_WIDTH = 52;
const GROUND_H = 40;

let W, H;
let bird, pipes, score, best, gameState, pipeSpeed, frameCount;
let bgStars = [];
let animFrame;

function setupCanvas() {
  const wrap = canvas.parentElement;
  W = Math.min(wrap.clientWidth - 8, 452);
  const availH = Math.floor(window.innerHeight * 0.70);
  H = Math.min(Math.max(400, availH), Math.round(W * 1.5));
  canvas.width = W;
  canvas.height = H;
}

function initBgStars() {
  bgStars = [];
  for (let i = 0; i < 60; i++) {
    bgStars.push({
      x: Math.random() * W,
      y: Math.random() * (H - GROUND_H),
      r: Math.random() * 1.2 + 0.3,
      a: Math.random() * 0.7 + 0.3,
      da: (Math.random() - 0.5) * 0.012
    });
  }
}

function resetGame() {
  bird = {
    x: W * 0.22,
    y: H / 2,
    vy: 0,
    rotation: 0
  };
  pipes = [];
  score = 0;
  frameCount = 0;
  pipeSpeed = 2.5;
  best = parseInt(localStorage.getItem('flappy_best') || '0');
  updateLEDs();
}

function initGame() {
  setupCanvas();
  initBgStars();
  resetGame();
  gameState = 'idle';
  draw();
}

function startGame() {
  resetGame();
  gameState = 'running';
  document.getElementById('home-btn').style.display = 'block';
  gameLoop();
}

function flap() {
  if (gameState === 'idle' || gameState === 'over') {
    startGame();
    return;
  }
  if (gameState === 'running') {
    bird.vy = FLAP_VEL;
  }
}

function updateLEDs() {
  document.getElementById('score-led').textContent = score;
  const bestVal = Math.max(best, score);
  document.getElementById('best-led').textContent = bestVal;
  document.getElementById('pipes-led').textContent = pipes.filter(p=>p.passed).length;
  const tb = document.getElementById('title-best-fb');
  if (tb) tb.textContent = bestVal;
}

function getRandomGapY(gapSize) {
  const margin = 55;
  const min = margin + gapSize / 2;
  const max = H - GROUND_H - margin - gapSize / 2;
  return Math.random() * (max - min) + min;
}

function spawnPipe() {
  // Pipe types: normal, narrow (smaller gap), moving (oscillates vertically), wide (wider pipe body)
  const pool = ['normal','normal','normal'];
  if (score >= 5)  pool.push('narrow');
  if (score >= 8)  pool.push('moving');
  if (score >= 15) pool.push('narrow','moving','wide');
  const type = pool[Math.floor(Math.random() * pool.length)];
  const gapDelta = type === 'narrow' ? -28 : 0;
  const gapSize = Math.max(90, PIPE_GAP + gapDelta);
  const pipeW = type === 'wide' ? PIPE_WIDTH + 18 : PIPE_WIDTH;
  const gapY = getRandomGapY(gapSize);
  const moveVy = type === 'moving' ? (Math.random() < 0.5 ? 1.0 : -1.0) : 0;
  pipes.push({ x: W + pipeW, gapY, gapSize, pipeW, type, moveVy, passed: false });
}

function gameLoop() {
  if (gameState !== 'running') return;
  update();
  draw();
  animFrame = requestAnimationFrame(gameLoop);
}

function update() {
  frameCount++;

  // Animate bg stars
  bgStars.forEach(s => {
    s.a = Math.max(0.1, Math.min(1, s.a + s.da));
    if (s.a <= 0.1 || s.a >= 1) s.da *= -1;
  });

  // Bird physics
  bird.vy += GRAVITY;
  bird.y += bird.vy;
  bird.rotation = Math.min(Math.PI * 0.4, Math.max(-Math.PI * 0.4, bird.vy * 0.08));

  // Spawn pipes
  const pipeInterval = Math.max(80, 120 - Math.floor(score / 5) * 4);
  if (frameCount % pipeInterval === 0) {
    spawnPipe();
  }

  // Speed increase every 10 pipes
  const passed = pipes.filter(p=>p.passed).length;
  pipeSpeed = 2.5 + Math.floor(passed / 10) * 0.2;

  // Move pipes
  pipes.forEach(p => { p.x -= pipeSpeed; });

  // Moving pipes oscillate vertically
  pipes.forEach(p => {
    if (p.type === 'moving') {
      p.gapY += p.moveVy;
      const minG = 65 + p.gapSize / 2;
      const maxG = H - GROUND_H - 65 - p.gapSize / 2;
      if (p.gapY < minG || p.gapY > maxG) p.moveVy *= -1;
    }
  });

  // Remove off-screen pipes
  pipes = pipes.filter(p => p.x + p.pipeW > -10);

  // Score
  pipes.forEach(p => {
    if (!p.passed && p.x + p.pipeW < bird.x) {
      p.passed = true;
      score++;
      updateLEDs();
      playBeep(880, 0.06, 'sine');
    }
  });

  // Collision: floor / ceiling
  if (bird.y - 11 < 0 || bird.y + 11 > H - GROUND_H) {
    endGame(); return;
  }

  // Collision: pipes
  const bx = bird.x, by = bird.y, br = 10;
  for (const p of pipes) {
    const px = p.x, pw = p.pipeW, gs = p.gapSize;
    const topH = p.gapY - gs / 2;
    const botY = p.gapY + gs / 2;
    if (bx + br > px && bx - br < px + pw) {
      if (by - br < topH || by + br > botY) { endGame(); return; }
    }
  }
}

function endGame() {
  gameState = 'over';
  cancelAnimationFrame(animFrame);
  document.getElementById('home-btn').style.display = 'none';
  best = Math.max(best, score);
  localStorage.setItem('flappy_best', best);
  saveHiRec('flappy', score);
  updateLEDs();
  playBeep(220, 0.3, 'sawtooth');
  draw();
}

function drawPipe(p) {
  const x = p.x, gapY = p.gapY, gapSize = p.gapSize, pipeW = p.pipeW;
  const topH = gapY - gapSize / 2;
  const botY = gapY + gapSize / 2;
  const botH = H - GROUND_H - botY;
  const capH = 14;

  // Shadow color varies by type
  const shadowCol = p.type === 'moving' ? '#ff80ff' : '#7060ff';

  // Pipe gradient - green like classic Flappy Bird
  function makePipeGrad(y, h) {
    const g = ctx.createLinearGradient(x, y, x + pipeW, y);
    if (p.type === 'wide') {
      g.addColorStop(0, '#1a4a20');
      g.addColorStop(0.3, '#2d8040');
      g.addColorStop(0.7, '#1f6030');
      g.addColorStop(1, '#0e3018');
    } else {
      g.addColorStop(0, '#1a5c22');
      g.addColorStop(0.3, '#38a045');
      g.addColorStop(0.7, '#2a7a32');
      g.addColorStop(1, '#0f3815');
    }
    return g;
  }

  // Top pipe body
  if (topH > 0) {
    ctx.save();
    ctx.shadowColor = shadowCol;
    ctx.shadowBlur = 10;
    ctx.fillStyle = makePipeGrad(0, topH);
    ctx.beginPath();
    ctx.roundRect(x + 3, 0, pipeW - 6, topH - capH, [0, 0, 0, 0]);
    ctx.fill();

    // Top pipe cap
    ctx.fillStyle = makePipeGrad(0, capH);
    ctx.beginPath();
    ctx.roundRect(x, topH - capH, pipeW, capH, [0, 0, 4, 4]);
    ctx.fill();

    // Border (brighter for narrow)
    ctx.shadowBlur = 0;
    ctx.strokeStyle = p.type === 'narrow' ? '#ffcc00' : 'rgba(100,220,100,0.4)';
    ctx.lineWidth = p.type === 'narrow' ? 2 : 1;
    ctx.globalAlpha = p.type === 'narrow' ? 0.8 : 0.5;
    ctx.strokeRect(x, 0, pipeW, topH);
    ctx.globalAlpha = 1;

    // Narrow warning indicator
    if (p.type === 'narrow') {
      ctx.font = '13px Arial';
      ctx.textAlign = 'center';
      ctx.fillStyle = '#ffcc00';
      ctx.shadowColor = '#ffcc00';
      ctx.shadowBlur = 6;
      ctx.fillText('⚠', x + pipeW / 2, Math.max(14, topH - capH - 4));
      ctx.shadowBlur = 0;
    }

    ctx.restore();
  }

  // Bottom pipe body
  if (botH > 0) {
    ctx.save();
    ctx.shadowColor = shadowCol;
    ctx.shadowBlur = 10;
    ctx.fillStyle = makePipeGrad(botY, botH);
    ctx.beginPath();
    ctx.roundRect(x + 3, botY + capH, pipeW - 6, botH - capH, [0, 0, 0, 0]);
    ctx.fill();

    // Bottom pipe cap
    ctx.fillStyle = makePipeGrad(botY, capH);
    ctx.beginPath();
    ctx.roundRect(x, botY, pipeW, capH, [4, 4, 0, 0]);
    ctx.fill();

    ctx.shadowBlur = 0;
    ctx.strokeStyle = p.type === 'narrow' ? '#ffcc00' : 'rgba(100,220,100,0.4)';
    ctx.lineWidth = p.type === 'narrow' ? 2 : 1;
    ctx.globalAlpha = p.type === 'narrow' ? 0.8 : 0.5;
    ctx.strokeRect(x, botY, pipeW, botH);
    ctx.globalAlpha = 1;

    // Narrow warning indicator on bottom cap
    if (p.type === 'narrow') {
      ctx.font = '13px Arial';
      ctx.textAlign = 'center';
      ctx.fillStyle = '#ffcc00';
      ctx.shadowColor = '#ffcc00';
      ctx.shadowBlur = 6;
      ctx.fillText('⚠', x + pipeW / 2, Math.min(H - GROUND_H - 4, botY + capH + 14));
      ctx.shadowBlur = 0;
    }

    ctx.restore();
  }
}

function draw() {
  // Background - day/night cycle (30s period)
  const dayPhase = (Date.now() / 30000) % 1;
  const isDay = dayPhase < 0.5;
  const t = isDay ? dayPhase * 2 : (dayPhase - 0.5) * 2;

  const bgGrad = ctx.createLinearGradient(0, 0, 0, H);
  if (isDay) {
    // Dawn to day
    const skyTop = `rgb(${Math.round(40+t*100)},${Math.round(80+t*80)},${Math.round(180-t*30)})`;
    const skyBot = `rgb(${Math.round(100+t*80)},${Math.round(150+t*50)},${Math.round(220-t*20)})`;
    bgGrad.addColorStop(0, skyTop);
    bgGrad.addColorStop(1, skyBot);
  } else {
    // Day to night
    const skyTop = `rgb(${Math.round(140-t*120)},${Math.round(160-t*150)},${Math.round(150-t*120)})`;
    const skyBot = `rgb(${Math.round(180-t*170)},${Math.round(200-t*180)},${Math.round(240-t*220)})`;
    bgGrad.addColorStop(0, skyTop);
    bgGrad.addColorStop(1, skyBot);
  }
  ctx.fillStyle = bgGrad;
  ctx.fillRect(0, 0, W, H);

  // Bg stars
  bgStars.forEach(s => {
    ctx.globalAlpha = s.a;
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI*2);
    ctx.fill();
  });
  ctx.globalAlpha = 1;

  // Pipes
  pipes.forEach(p => drawPipe(p));

  // Ground - earthy brown
  const groundGrad = ctx.createLinearGradient(0, H - GROUND_H, 0, H);
  groundGrad.addColorStop(0, '#5c3d1e');
  groundGrad.addColorStop(0.3, '#4a2e10');
  groundGrad.addColorStop(1, '#2a1808');
  ctx.fillStyle = groundGrad;
  ctx.fillRect(0, H - GROUND_H, W, GROUND_H);

  // Ground top strip (grass)
  ctx.fillStyle = '#3a7d2a';
  ctx.fillRect(0, H - GROUND_H, W, 6);

  // Ground border
  ctx.save();
  ctx.shadowColor = '#3a7d2a';
  ctx.shadowBlur = 6;
  ctx.strokeStyle = '#50a030';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(0, H - GROUND_H);
  ctx.lineTo(W, H - GROUND_H);
  ctx.stroke();
  ctx.restore();

  // Ground texture - dirt pattern
  ctx.fillStyle = 'rgba(100,60,20,0.3)';
  for (let gx = 8; gx < W; gx += 22) {
    ctx.beginPath();
    ctx.ellipse(gx, H - GROUND_H + 16, 6, 4, 0, 0, Math.PI*2);
    ctx.fill();
  }

  // Bird - yellow with beak (Pokemon SV style)
  ctx.save();
  ctx.translate(bird.x, bird.y);
  ctx.rotate(bird.rotation);
  // Glow
  ctx.shadowColor = '#ffd700';
  ctx.shadowBlur = 20;
  // Body
  const bGrad = ctx.createRadialGradient(-3, -3, 1, 0, 0, 14);
  bGrad.addColorStop(0, '#fff8a0');
  bGrad.addColorStop(0.5, '#ffd700');
  bGrad.addColorStop(1, '#e6a800');
  ctx.fillStyle = bGrad;
  ctx.beginPath();
  ctx.ellipse(0, 0, 14, 11, 0, 0, Math.PI*2);
  ctx.fill();

  // Wing (slightly darker yellow)
  ctx.shadowBlur = 0;
  ctx.fillStyle = '#c88800';
  ctx.beginPath();
  ctx.ellipse(-2, 4, 8, 5, -0.3, 0, Math.PI*2);
  ctx.fill();

  // Eye white
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(6, -3, 4, 0, Math.PI*2);
  ctx.fill();
  // Eye pupil
  ctx.fillStyle = '#1a1a1a';
  ctx.beginPath();
  ctx.arc(7, -3, 2.2, 0, Math.PI*2);
  ctx.fill();
  // Eye shine
  ctx.fillStyle = 'rgba(255,255,255,0.85)';
  ctx.beginPath();
  ctx.arc(7.8, -4, 0.9, 0, Math.PI*2);
  ctx.fill();

  // Beak
  ctx.fillStyle = '#e65c00';
  ctx.beginPath();
  ctx.moveTo(12, -2);
  ctx.lineTo(21, 0);
  ctx.lineTo(12, 3);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = '#cc4400';
  ctx.lineWidth = 0.5;
  ctx.beginPath();
  ctx.moveTo(12, 0); ctx.lineTo(21, 0);
  ctx.stroke();
  ctx.restore();

  // Score on canvas - large white centered
  if (gameState === 'running' || gameState === 'over') {
    ctx.save();
    const scoreSize = Math.round(W*0.10);
    ctx.font = `900 ${scoreSize}px 'Helvetica Neue', Arial`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'top';
    // Shadow
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillText(score, W/2 + 2, 22);
    // White text
    ctx.shadowColor = 'rgba(255,255,255,0.6)';
    ctx.shadowBlur = 8;
    ctx.fillStyle = '#ffffff';
    ctx.fillText(score, W/2, 20);
    ctx.restore();
  }

  // Overlays
  if (gameState === 'idle') {
    drawOverlay('フラッピーバード', 'タップでスタート', null);
  } else if (gameState === 'over') {
    drawOverlay('ゲームオーバー', 'タップで再スタート', score);
  }
}

function drawOverlay(title, sub, scoreVal) {
  // Semi-transparent backdrop
  ctx.save();
  ctx.fillStyle = 'rgba(4,2,14,0.72)';
  ctx.fillRect(0, 0, W, H - GROUND_H);

  const cx = W / 2;
  const cy = (H - GROUND_H) / 2;

  // Box
  const bw = W * 0.76, bh = scoreVal !== null ? 130 : 100;
  const bx = cx - bw/2, by = cy - bh/2;
  ctx.shadowColor = '#7060ff';
  ctx.shadowBlur = 20;
  ctx.fillStyle = 'rgba(20,10,50,0.95)';
  roundRect(ctx, bx, by, bw, bh, 14);
  ctx.fill();
  ctx.shadowBlur = 0;
  ctx.strokeStyle = '#7060ff';
  ctx.lineWidth = 2;
  roundRect(ctx, bx, by, bw, bh, 14);
  ctx.stroke();

  // Title
  ctx.shadowColor = '#e63946';
  ctx.shadowBlur = 18;
  ctx.fillStyle = '#ffffff';
  ctx.font = `900 ${Math.round(W*0.065)}px 'Helvetica Neue', Arial`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(title, cx, by + 30);

  if (scoreVal !== null) {
    ctx.shadowColor = '#e63946';
    ctx.shadowBlur = 14;
    ctx.fillStyle = '#e63946';
    ctx.font = `900 ${Math.round(W*0.10)}px 'Helvetica Neue', Arial`;
    ctx.fillText(scoreVal, cx, cy + 6);
  }

  // Sub
  ctx.shadowBlur = 0;
  ctx.fillStyle = '#aaaacc';
  ctx.font = `${Math.round(W*0.038)}px 'Helvetica Neue', Arial`;
  ctx.fillText(sub, cx, by + bh - 22);
  ctx.restore();
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

function showHiScore() {
  document.getElementById('hiscore-body').innerHTML =
    `<p style="text-align:center;margin-bottom:12px;color:#ffe870;font-weight:bold;">🏆 フラッピーバード ハイスコア</p>` +
    renderHiRec('flappy', '点');
  openModal('hiscore-modal');
}

// Input
canvas.addEventListener('click', () => flap());
(function(){
  let txStart=0, tyStart=0, touchMoved=false;
  canvas.addEventListener('touchstart', (e) => {
    txStart = e.touches[0].clientX;
    tyStart = e.touches[0].clientY;
    touchMoved = e.touches.length > 1;
  }, {passive: true});
  canvas.addEventListener('touchmove', (e) => {
    const dx = e.touches[0].clientX - txStart;
    const dy = e.touches[0].clientY - tyStart;
    if (Math.abs(dx) > 10 || Math.abs(dy) > 10) touchMoved = true;
  }, {passive: true});
  canvas.addEventListener('touchend', (e) => {
    e.preventDefault();
    if (!touchMoved) flap();
  }, {passive: false});
})();
document.addEventListener('keydown', (e) => {
  if (e.code === 'Space' || e.code === 'ArrowUp') {
    e.preventDefault();
    flap();
  }
});

function saveGame(){
  if(gameState !== 'running') return;
  localStorage.setItem('flappy_save', JSON.stringify({
    score: score, best: best, savedAt: Date.now()
  }));
}

function showSaveToast(){
  const t=document.createElement('div');
  t.textContent='✅ 保存しました';
  t.style.cssText='position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:rgba(0,160,80,0.92);color:#fff;padding:8px 20px;border-radius:20px;font-size:13px;font-weight:bold;z-index:99999;pointer-events:none;transition:opacity 0.5s';
  document.body.appendChild(t);
  setTimeout(()=>{t.style.opacity='0';setTimeout(()=>t.remove(),500);},1500);
}

window.addEventListener('beforeunload', ()=>{ if(gameState==='running') saveGame(); });
document.addEventListener('visibilitychange', ()=>{ if(document.hidden&&gameState==='running') saveGame(); });
setInterval(()=>{ if(gameState==='running') saveGame(); }, 30000);

// Resize
window.addEventListener('resize', () => {
  initGame();
});

// Web Audio
function playBeep(freq=660, dur=0.07, type='sine') {
  try {
    const ac = new (window.AudioContext||window.webkitAudioContext)();
    const o = ac.createOscillator(), g = ac.createGain();
    o.connect(g); g.connect(ac.destination);
    o.frequency.value = freq; o.type = type;
    g.gain.setValueAtTime(0.1, ac.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + dur);
    o.start(); o.stop(ac.currentTime + dur);
  } catch(e) {}
}

function goHome() {
  if (!confirm('タイトル画面に戻りますか？（進行中のゲームは終了します）')) return;
  cancelAnimationFrame(animFrame);
  gameState = 'idle';
  document.getElementById('home-btn').style.display = 'none';
  draw();
}

// Init
initGame();

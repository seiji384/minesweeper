<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>スネーク</title>
<style>
:root {
  --bg: #0f0f1a;
  --bg2: #1a1a2e;
  --panel: rgba(30,30,53,0.95);
  --accent: #7bed9f;
  --text: #ffffff;
  --text-sub: #aaaacc;
  --radius: 14px;
  --shadow: 0 8px 32px rgba(0,0,0,0.5);
}
* { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
body {
  background: var(--bg);
  display: flex; justify-content: center; align-items: flex-start;
  min-height: 100vh; padding: 16px 8px 80px;
  font-family: 'Helvetica Neue', Arial, sans-serif; overflow-x: hidden;
  color: var(--text);
}
#stars { position: fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:0; }
.window {
  position: relative; z-index: 1;
  background: var(--panel);
  border: 2px solid var(--accent); border-radius: var(--radius);
  box-shadow: 0 0 30px rgba(123,237,159,0.4), 0 0 80px rgba(123,237,159,0.1), var(--shadow);
  max-width: 460px; width: 100%; overflow: hidden;
  backdrop-filter: blur(20px);
}
.titlebar {
  background: linear-gradient(90deg, rgba(123,237,159,0.15) 0%, rgba(123,237,159,0.3) 50%, rgba(123,237,159,0.15) 100%);
  color: var(--accent); font-size: 16px; font-weight: 900; padding: 10px 14px;
  text-align: center; letter-spacing: 3px;
  border-bottom: 1px solid rgba(123,237,159,0.3);
  display: flex; justify-content: space-between; align-items: center;
  text-shadow: 0 0 20px rgba(123,237,159,0.8);
}
.titlebar a { color: #3a1a00; text-decoration: none; font-size: 18px; }
.action-bar {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 600;
  display: flex; gap: 8px; padding: 10px 12px 14px;
  background: rgba(15,15,26,0.97);
  border-top: 1px solid rgba(123,237,159,0.2);
  box-shadow: 0 -8px 32px rgba(0,0,0,0.8);
  flex-wrap: wrap; justify-content: center;
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
}
.act-btn, .btn {
  background: linear-gradient(135deg, var(--accent), color-mix(in srgb, var(--accent) 60%, white));
  border: none;
  border-radius: var(--radius);
  color: #0f2018;
  font-size: 12px;
  font-weight: 700;
  padding: 8px 16px;
  cursor: pointer;
  touch-action: manipulation;
  transition: transform 0.15s cubic-bezier(0.34,1.56,0.64,1), box-shadow 0.15s;
  box-shadow: 0 4px 16px rgba(123,237,159,0.3);
  letter-spacing: 0.5px;
}
.act-btn:active, .btn:active { transform: scale(0.94); box-shadow: 0 2px 8px rgba(0,0,0,0.2); }
.modal-overlay {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,0.78); z-index: 10000;
  justify-content: center; align-items: center; padding: 16px;
}
.modal-overlay.visible { display: flex; }
.modal-box {
  background: linear-gradient(160deg, #1e1248 0%, #0d0830 100%);
  border: 2px solid #7060ff; border-radius: 16px;
  box-shadow: 0 0 40px rgba(112,90,255,0.6), 0 24px 64px rgba(0,0,0,0.9);
  max-width: 360px; width: 100%; max-height: 88vh; overflow-y: auto;
}
.modal-title {
  background: linear-gradient(90deg, #a06008 0%, #f5c842 28%, #ffe870 50%, #f5c842 72%, #a06008 100%);
  color: #3a1a00; font-size: 14px; font-weight: 900; padding: 8px 14px;
  text-align: center; letter-spacing: 2px; border-radius: 14px 14px 0 0;
  display: flex; justify-content: space-between; align-items: center;
}
.modal-close { background: none; border: none; font-size: 18px; cursor: pointer; color: #3a1a00; }
.modal-body { padding: 14px; color: #c0b0e8; font-size: 13px; line-height: 1.6; }
.led {
  font-size: 28px; font-weight: 900; color: var(--accent);
  text-shadow: 0 0 20px rgba(123,237,159,0.8);
  display: inline-block; font-family: 'Helvetica Neue', sans-serif;
}
.led-label { font-size: 11px; color: var(--text-sub); display: block; text-align: center; letter-spacing: 1px; text-transform: uppercase; }
.status-panel {
  background: var(--panel);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: var(--radius);
  padding: 12px 20px; margin: 8px;
  display: flex; justify-content: space-around; align-items: center;
  box-shadow: inset 0 2px 8px rgba(0,0,0,0.6);
  backdrop-filter: blur(10px);
}
.led-group { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.content { padding: 8px; }
#confetti { position: fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:9999; display:none; }

/* Snake specific */
#game-wrap {
  position: relative;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 4px;
}
#gameCanvas {
  display: block;
  border-radius: 8px;
  border: 1px solid rgba(123,237,159,0.25);
  box-shadow: 0 0 20px rgba(123,237,159,0.15);
  touch-action: none;
}
#overlay {
  position: absolute;
  top: 50%; left: 50%; transform: translate(-50%, -50%);
  text-align: center;
  pointer-events: none;
  z-index: 10;
}
#overlay-title {
  color: var(--accent);
  font-size: 28px;
  font-weight: 900;
  text-shadow: 0 0 30px rgba(123,237,159,0.9);
  letter-spacing: 3px;
}
#overlay-sub {
  color: var(--text-sub);
  font-size: 13px;
  margin-top: 8px;
}
#overlay-score {
  color: var(--accent);
  font-size: 22px;
  font-weight: bold;
  margin-top: 6px;
  text-shadow: 0 0 20px rgba(123,237,159,0.8);
}

/* D-pad */
#dpad {
  display: grid;
  grid-template-columns: 50px 50px 50px;
  grid-template-rows: 50px 50px;
  gap: 4px;
  justify-content: center;
  margin: 8px auto 4px;
  width: fit-content;
}
.dpad-btn {
  width: 54px; height: 54px;
  border-radius: var(--radius);
  background: rgba(123,237,159,0.12);
  color: var(--accent); border: 1px solid rgba(123,237,159,0.3);
  box-shadow: 0 2px 8px rgba(0,0,0,0.5), 0 0 10px rgba(123,237,159,0.1);
  cursor: pointer; font-size: 24px;
  display: flex; align-items: center; justify-content: center;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
  transition: all 0.1s;
}
.dpad-btn:active {
  transform: scale(0.88);
  background: rgba(123,237,159,0.25);
  box-shadow: 0 0 20px rgba(123,237,159,0.4);
}
#dpad-up    { grid-column: 2; grid-row: 1; }
#dpad-left  { grid-column: 1; grid-row: 2; }
#dpad-down  { grid-column: 2; grid-row: 2; }
#dpad-right { grid-column: 3; grid-row: 2; }
.hs-table{width:100%;}
.hs-row{display:flex;justify-content:space-between;align-items:center;padding:5px 10px;background:rgba(80,60,180,0.1);border:1px solid rgba(80,60,180,0.2);border-radius:8px;margin:3px 0;}
.hs-period{color:#a090d0;font-size:12px;font-weight:bold;min-width:50px;}
.hs-record{color:#60ff90;font-weight:900;text-shadow:0 0 6px #60ff90;}
.hs-val{color:#4038a0;}
.hs-date{color:#7060a0;font-size:9px;margin-left:4px;}

<script>
function getDateKey(){return new Date().toISOString().slice(0,10);}
function getWeekKey(){const d=new Date(),day=d.getDay()||7,mon=new Date(d);mon.setDate(d.getDate()-day+1);return mon.toISOString().slice(0,10);}
function getMonthKey(){return new Date().toISOString().slice(0,7);}
function fmtDate(s){const p=s.slice(5).split('-');return`${parseInt(p[0])}/${parseInt(p[1])}`;}
function saveHiRec(key,val){
  const today=getDateKey(),wk=getWeekKey(),mo=getMonthKey();
  let d=JSON.parse(localStorage.getItem(key+'_rec')||'{}');
  if(!d.all||val>d.all.v)d.all={v:val,date:today};
  if(!d.today||d.today.date!==today||val>d.today.v)d.today={v:val,date:today};
  if(!d.week||d.week.key!==wk||val>d.week.v)d.week={v:val,key:wk,date:today};
  if(!d.month||d.month.key!==mo||val>d.month.v)d.month={v:val,key:mo,date:today};
  localStorage.setItem(key+'_rec',JSON.stringify(d));
}
function renderHiRec(key,unit){
  const today=getDateKey(),wk=getWeekKey(),mo=getMonthKey();
  const d=JSON.parse(localStorage.getItem(key+'_rec')||'{}');
  const fmt=e=>e?`<span class="hs-record">${e.v}${unit}</span><span class="hs-date">(${fmtDate(e.date)})</span>`:'<span class="hs-val">--</span>';
  const tV=d.today?.date===today?fmt(d.today):'<span class="hs-val">--</span>';
  const wV=d.week?.key===wk?fmt(d.week):'<span class="hs-val">--</span>';
  const mV=d.month?.key===mo?fmt(d.month):'<span class="hs-val">--</span>';
  return`<div class="hs-table"><div class="hs-row"><span class="hs-period">本日</span>${tV}</div><div class="hs-row"><span class="hs-period">今週</span>${wV}</div><div class="hs-row"><span class="hs-period">今月</span>${mV}</div><div class="hs-row"><span class="hs-period">全期間</span>${fmt(d.all)}</div></div>`;
}

// Stars
(function(){
  const c=document.getElementById('stars'),ctx=c.getContext('2d');let stars=[];
  function resize(){c.width=window.innerWidth;c.height=window.innerHeight;stars=[];for(let i=0;i<120;i++)stars.push({x:Math.random()*c.width,y:Math.random()*c.height,r:Math.random()*1.5+0.3,a:Math.random(),da:(Math.random()-0.5)*0.008});}
  function draw(){ctx.clearRect(0,0,c.width,c.height);stars.forEach(s=>{s.a=Math.max(0.1,Math.min(1,s.a+s.da));if(s.a<=0.1||s.a>=1)s.da*=-1;ctx.globalAlpha=s.a;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,6.28);ctx.fill();});ctx.globalAlpha=1;requestAnimationFrame(draw);}
  window.addEventListener('resize',resize);resize();draw();
})();

// Visual Viewport fix
const actionBar = document.querySelector('.action-bar');
function fixActionBar() {
  const vv = window.visualViewport;
  if (!vv) return;
  const layoutWidth = document.documentElement.clientWidth || window.innerWidth;
  const scaleRatio = layoutWidth / vv.width;
  const isZoomed = vv.scale > 1.05 || scaleRatio > 1.05;
  if (!isZoomed) {
    actionBar.style.top = actionBar.style.bottom = '';
    actionBar.style.left = actionBar.style.right = '';
    actionBar.style.width = actionBar.style.transform = '';
    actionBar.style.transformOrigin = '';
    return;
  }
  const scale = Math.max(vv.scale, scaleRatio);
  const inv = 1 / scale;
  const barH = actionBar.offsetHeight || 52;
  const layoutW = document.documentElement.clientWidth || Math.round(vv.width * scale);
  actionBar.style.top = Math.round(vv.offsetTop + vv.height - barH) + 'px';
  actionBar.style.bottom = 'auto';
  actionBar.style.left = Math.round(vv.offsetLeft) + 'px';
  actionBar.style.width = layoutW + 'px';
  actionBar.style.right = 'auto';
  actionBar.style.transform = `scale(${inv})`;
  actionBar.style.transformOrigin = 'bottom left';
}
if (window.visualViewport) {
  window.visualViewport.addEventListener('resize', fixActionBar);
  window.visualViewport.addEventListener('scroll', fixActionBar);
  fixActionBar();
}

// Modal helpers
function openModal(id) { document.getElementById(id).classList.add('visible'); }
function closeModal(id) { document.getElementById(id).classList.remove('visible'); }

// Game
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

const GRID = 20;
let cellSize, cols, rows;
let snake, dir, nextDir, food, score, best, level;
let gameState = 'idle'; // idle, running, over
let loopTimer = null;
let baseInterval = 150;

function setupCanvas() {
  const wrap = document.getElementById('game-wrap');
  const maxW = Math.min(wrap.clientWidth - 16, 380);
  const size = Math.floor(maxW / GRID) * GRID;
  canvas.width = size;
  canvas.height = size;
  cols = GRID;
  rows = GRID;
  cellSize = size / GRID;
}

function initGame() {
  snake = [
    {x: Math.floor(cols/2), y: Math.floor(rows/2)},
    {x: Math.floor(cols/2)-1, y: Math.floor(rows/2)},
    {x: Math.floor(cols/2)-2, y: Math.floor(rows/2)},
  ];
  dir = {x:1, y:0};
  nextDir = {x:1, y:0};
  score = 0;
  level = 1;
  placeFood();
  updateLEDs();
}

function placeFood() {
  let pos;
  do {
    pos = {x: Math.floor(Math.random()*cols), y: Math.floor(Math.random()*rows)};
  } while (snake.some(s => s.x===pos.x && s.y===pos.y));
  food = pos;
}

function getInterval() {
  return Math.max(60, baseInterval - (level-1)*15);
}

function startGame() {
  setupCanvas();
  initGame();
  gameState = 'running';
  hideOverlay();
  document.getElementById('home-btn').style.display = 'block';
  clearInterval(loopTimer);
  loopTimer = setInterval(gameLoop, getInterval());
}

function resetGame() {
  localStorage.removeItem('snake_save');
  clearInterval(loopTimer);
  gameState = 'idle';
  document.getElementById('home-btn').style.display = 'none';
  setupCanvas();
  initGame();
  drawGame();
  showOverlay('SNAKE', 'タップ / スペースでスタート', '');
}

function gameLoop() {
  dir = nextDir;
  const head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};

  // Wall collision
  if (head.x < 0 || head.x >= cols || head.y < 0 || head.y >= rows) {
    endGame(); return;
  }
  // Self collision
  if (snake.some(s => s.x===head.x && s.y===head.y)) {
    endGame(); return;
  }

  snake.unshift(head);

  if (head.x === food.x && head.y === food.y) {
    score += 10;
    playBeep(880, 0.06, 'sine');
    const newLevel = Math.floor(score / 50) + 1;
    if (newLevel > level) {
      level = newLevel;
      clearInterval(loopTimer);
      loopTimer = setInterval(gameLoop, getInterval());
      playBeep(1100, 0.12, 'sine');
    }
    updateLEDs();
    placeFood();
    saveGame();
  } else {
    snake.pop();
  }

  drawGame();
}

function endGame() {
  localStorage.removeItem('snake_save');
  clearInterval(loopTimer);
  gameState = 'over';
  document.getElementById('home-btn').style.display = 'none';
  best = Math.max(best || 0, score);
  saveBest(best);
  saveHiRec('snake', score);
  updateLEDs();
  drawGame();
  playBeep(200, 0.3, 'sawtooth');
  showOverlay('GAME OVER', 'タップ / スペースで再スタート', `SCORE: ${score}`);
}

function drawGame() {
  const w = canvas.width, h = canvas.height;
  // Background
  ctx.fillStyle = '#0f0f1a';
  ctx.fillRect(0, 0, w, h);

  // Grid lines
  ctx.strokeStyle = 'rgba(123,237,159,0.06)';
  ctx.lineWidth = 0.5;
  for(let x=0; x<=cols; x++) {
    ctx.beginPath(); ctx.moveTo(x*cellSize, 0); ctx.lineTo(x*cellSize, h); ctx.stroke();
  }
  for(let y=0; y<=rows; y++) {
    ctx.beginPath(); ctx.moveTo(0, y*cellSize); ctx.lineTo(w, y*cellSize); ctx.stroke();
  }

  // Food - pulsing red circle with glow
  if (food) {
    const fx = food.x * cellSize + cellSize/2;
    const fy = food.y * cellSize + cellSize/2;
    const pulse = 0.85 + 0.15 * Math.sin(Date.now() / 200);
    const r = cellSize * 0.38 * pulse;
    ctx.save();
    ctx.shadowColor = '#ff4444';
    ctx.shadowBlur = 18 + 8 * pulse;
    const grad = ctx.createRadialGradient(fx-r*0.3, fy-r*0.3, 1, fx, fy, r);
    grad.addColorStop(0, '#ffaa60');
    grad.addColorStop(0.5, '#ff5020');
    grad.addColorStop(1, '#cc2000');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(fx, fy, r, 0, Math.PI*2);
    ctx.fill();
    // Shine
    ctx.shadowBlur = 0;
    ctx.fillStyle = 'rgba(255,255,255,0.4)';
    ctx.beginPath();
    ctx.arc(fx - r*0.3, fy - r*0.3, r*0.25, 0, Math.PI*2);
    ctx.fill();
    ctx.restore();
  }

  // Snake body
  snake.forEach((seg, i) => {
    const sx = seg.x * cellSize;
    const sy = seg.y * cellSize;
    const pad = 1.5;
    const size = cellSize - pad*2;
    const x = sx + pad, y = sy + pad;
    const cr = Math.min(5, size*0.3);

    ctx.save();
    if (i === 0) {
      // Head - bright green with glow
      ctx.shadowColor = '#7bed9f';
      ctx.shadowBlur = 22;
      const g = ctx.createLinearGradient(x, y, x+size, y+size);
      g.addColorStop(0, '#ccffdd');
      g.addColorStop(0.5, '#7bed9f');
      g.addColorStop(1, '#2ecc71');
      ctx.fillStyle = g;
    } else {
      const t = i / snake.length;
      ctx.shadowColor = '#7bed9f';
      ctx.shadowBlur = 6;
      const g = ctx.createLinearGradient(x, y, x+size, y+size);
      g.addColorStop(0, `rgba(${Math.round(80-t*15)},${Math.round(220-t*40)},${Math.round(120-t*20)},0.95)`);
      g.addColorStop(1, `rgba(${Math.round(40-t*8)},${Math.round(170-t*30)},${Math.round(80-t*12)},0.85)`);
      ctx.fillStyle = g;
    }

    ctx.beginPath();
    ctx.moveTo(x + cr, y);
    ctx.lineTo(x + size - cr, y);
    ctx.quadraticCurveTo(x + size, y, x + size, y + cr);
    ctx.lineTo(x + size, y + size - cr);
    ctx.quadraticCurveTo(x + size, y + size, x + size - cr, y + size);
    ctx.lineTo(x + cr, y + size);
    ctx.quadraticCurveTo(x, y + size, x, y + size - cr);
    ctx.lineTo(x, y + cr);
    ctx.quadraticCurveTo(x, y, x + cr, y);
    ctx.closePath();
    ctx.fill();

    if (i === 0) {
      // Eyes
      ctx.shadowBlur = 0;
      ctx.fillStyle = '#fff';
      const eyeR = 2.5;
      let e1, e2;
      if (dir.x === 1)      { e1={x:sx+size*0.75,y:sy+size*0.3}; e2={x:sx+size*0.75,y:sy+size*0.7}; }
      else if (dir.x === -1){ e1={x:sx+size*0.25,y:sy+size*0.3}; e2={x:sx+size*0.25,y:sy+size*0.7}; }
      else if (dir.y === -1){ e1={x:sx+size*0.3,y:sy+size*0.25}; e2={x:sx+size*0.7,y:sy+size*0.25}; }
      else                  { e1={x:sx+size*0.3,y:sy+size*0.75}; e2={x:sx+size*0.7,y:sy+size*0.75}; }
      ctx.beginPath(); ctx.arc(e1.x, e1.y, eyeR, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(e2.x, e2.y, eyeR, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#220044';
      ctx.beginPath(); ctx.arc(e1.x+0.5, e1.y+0.5, 1.2, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(e2.x+0.5, e2.y+0.5, 1.2, 0, Math.PI*2); ctx.fill();
    }
    ctx.restore();
  });
}

function showOverlay(title, sub, scoreText) {
  document.getElementById('overlay').style.display = 'block';
  document.getElementById('overlay-title').textContent = title;
  document.getElementById('overlay-sub').innerHTML = sub;
  document.getElementById('overlay-score').textContent = scoreText;
}
function hideOverlay() {
  document.getElementById('overlay').style.display = 'none';
}

function updateLEDs() {
  document.getElementById('score-led').textContent = score || 0;
  best = parseInt(localStorage.getItem('snake_best') || '0');
  const bestVal = Math.max(best, score || 0);
  document.getElementById('best-led').textContent = bestVal;
  document.getElementById('level-led').textContent = level || 1;
  const titleBest = document.getElementById('title-best');
  if (titleBest) titleBest.textContent = bestVal;
}

function saveBest(val) {
  const cur = parseInt(localStorage.getItem('snake_best') || '0');
  if (val > cur) localStorage.setItem('snake_best', val);
}

function goHome() {
  if (!confirm('タイトル画面に戻りますか？（進行中のゲームは終了します）')) return;
  clearInterval(loopTimer);
  gameState = 'idle';
  document.getElementById('home-btn').style.display = 'none';
  localStorage.removeItem('snake_save');
  setupCanvas(); initGame(); drawGame();
  showOverlay('SNAKE', 'タップ / スペースでスタート', '');
}

function saveGame() {
  if (gameState !== 'running') return;
  localStorage.setItem('snake_save', JSON.stringify({
    snake: snake, food: food, dir: dir, nextDir: nextDir,
    score: score, level: level, savedAt: Date.now()
  }));
}

function tryLoadSave() {
  const raw = localStorage.getItem('snake_save');
  if (!raw) return false;
  try {
    const s = JSON.parse(raw);
    if (!s.savedAt || Date.now() - s.savedAt > 7*24*60*60*1000) { localStorage.removeItem('snake_save'); return false; }
    window._pendingSnakeSave = s;
    showOverlay('続きから再開しますか？', '', '');
    document.getElementById('overlay-sub').innerHTML =
      '<button onclick="resumeSnake()" style="margin:4px 6px;padding:8px 20px;border-radius:14px;background:linear-gradient(160deg,#3a2080,#22105a);color:#b898ff;border:1px solid #5a3aaa;font-weight:bold;cursor:pointer;">はい</button>' +
      '<button onclick="declineSnake()" style="margin:4px 6px;padding:8px 20px;border-radius:14px;background:linear-gradient(160deg,#1a0e3a,#0d0820);color:#6858a0;border:1px solid #3a2870;font-weight:bold;cursor:pointer;">いいえ</button>';
    document.getElementById('overlay-score').textContent = '';
    return true;
  } catch(e) { localStorage.removeItem('snake_save'); return false; }
}

window.resumeSnake = function() {
  const s = window._pendingSnakeSave;
  if (!s) { declineSnake(); return; }
  setupCanvas();
  snake = s.snake; food = s.food; dir = s.dir; nextDir = s.nextDir;
  score = s.score; level = s.level;
  gameState = 'running';
  hideOverlay();
  document.getElementById('home-btn').style.display = 'block';
  updateLEDs();
  drawGame();
  clearInterval(loopTimer);
  loopTimer = setInterval(gameLoop, getInterval());
};

window.declineSnake = function() {
  localStorage.removeItem('snake_save');
  resetGame();
};

function showHiScore() {
  document.getElementById('hiscore-body').innerHTML = renderHiRec('snake','点');
  openModal('hiscore-modal');
}

// Input handling
function trySetDir(dx, dy) {
  if (gameState !== 'running') return;
  if (dx === -dir.x && dy === -dir.y) return; // no reverse
  nextDir = {x:dx, y:dy};
}

document.addEventListener('keydown', e => {
  if (e.code === 'Space' || e.code === 'Enter') {
    if (gameState !== 'running') startGame();
    e.preventDefault(); return;
  }
  const map = {ArrowUp:[0,-1], ArrowDown:[0,1], ArrowLeft:[-1,0], ArrowRight:[1,0]};
  if (map[e.code]) {
    if (gameState !== 'running') startGame();
    else trySetDir(...map[e.code]);
    e.preventDefault();
  }
});

// Dpad buttons with touchMoved pattern
(function(){
  const dpadMap = {
    'dpad-up':    [0,-1],
    'dpad-down':  [0, 1],
    'dpad-left':  [-1,0],
    'dpad-right': [1, 0]
  };
  Object.keys(dpadMap).forEach(id => {
    const btn = document.getElementById(id);
    const [dx, dy] = dpadMap[id];
    let txS=0, tyS=0, moved=false;
    btn.addEventListener('touchstart', e => {
      if (e.touches.length > 1) { moved = true; return; }
      txS = e.touches[0].clientX; tyS = e.touches[0].clientY; moved = false;
    }, { passive: true });
    btn.addEventListener('touchmove', e => {
      if (!moved) {
        const ddx = e.touches[0].clientX - txS, ddy = e.touches[0].clientY - tyS;
        if (Math.abs(ddx) > 10 || Math.abs(ddy) > 10) moved = true;
      }
    }, { passive: true });
    btn.addEventListener('touchend', e => {
      e.preventDefault();
      if (moved) return;
      if (gameState !== 'running') startGame(); else trySetDir(dx, dy);
    }, { passive: false });
    btn.addEventListener('click', () => {
      if (gameState !== 'running') startGame(); else trySetDir(dx, dy);
    });
  });
})();

// Canvas tap to start (mouse)
canvas.addEventListener('click', ()=>{ if(gameState!=='running') startGame(); });

// Canvas swipe with touchMoved pattern
let touchStartX=0, touchStartY=0, touchMoved=false;
canvas.addEventListener('touchstart', e=>{
  if (e.touches.length > 1) { touchMoved = true; e.preventDefault(); return; }
  touchStartX=e.touches[0].clientX; touchStartY=e.touches[0].clientY; touchMoved=false;
  e.preventDefault();
}, {passive:false});
canvas.addEventListener('touchmove', e=>{
  if (!touchMoved) {
    const dx=e.touches[0].clientX-touchStartX, dy=e.touches[0].clientY-touchStartY;
    if (Math.abs(dx)>10||Math.abs(dy)>10) touchMoved=true;
  }
}, {passive:true});
canvas.addEventListener('touchend', e=>{
  e.preventDefault();
  if (!touchMoved) {
    if (gameState !== 'running') startGame();
    return;
  }
  const dx = e.changedTouches[0].clientX - touchStartX;
  const dy = e.changedTouches[0].clientY - touchStartY;
  if (gameState !== 'running') { startGame(); return; }
  if (Math.abs(dx) > Math.abs(dy)) trySetDir(dx>0?1:-1, 0);
  else trySetDir(0, dy>0?1:-1);
}, {passive:false});

function showSaveToast(){
  const t=document.createElement('div');
  t.textContent='✅ 保存しました';
  t.style.cssText='position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:rgba(0,160,80,0.92);color:#fff;padding:8px 20px;border-radius:20px;font-size:13px;font-weight:bold;z-index:99999;pointer-events:none;transition:opacity 0.5s';
  document.body.appendChild(t);
  setTimeout(()=>{t.style.opacity='0';setTimeout(()=>t.remove(),500);},1500);
}

window.addEventListener('beforeunload', ()=>{ if(gameState==='running') saveGame(); });
document.addEventListener('visibilitychange', ()=>{ if(document.hidden&&gameState==='running') saveGame(); });
setInterval(()=>{ if(gameState==='running') saveGame(); }, 30000);

// Web Audio
function playBeep(freq=660, dur=0.07, type='square') {
  try {
    const ac = new (window.AudioContext||window.webkitAudioContext)();
    const o = ac.createOscillator(), g = ac.createGain();
    o.connect(g); g.connect(ac.destination);
    o.frequency.value = freq; o.type = type;
    g.gain.setValueAtTime(0.12, ac.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + dur);
    o.start(); o.stop(ac.currentTime + dur);
  } catch(e) {}
}

// Init
setupCanvas();
score = 0; level = 1;
best = parseInt(localStorage.getItem('snake_best') || '0');
initGame();
drawGame();
updateLEDs();
if (!tryLoadSave()) showOverlay('SNAKE', 'タップ / スペースでスタート', '');
</script>

<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>RPG ～バトルクエスト～</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: radial-gradient(ellipse at center, #120830 0%, #050210 100%);
  min-height: 100vh;
  font-family: 'Segoe UI', 'Hiragino Sans', sans-serif;
  color: #ddd;
  overflow-x: hidden;
}
#starCanvas { position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0; }
#confettiCanvas { position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:999;display:none; }
#app { position:relative;z-index:1;max-width:480px;margin:0 auto;padding-bottom:70px;padding-top:8px; }
.window {
  background: linear-gradient(160deg,#1e1248 0%,#0d0830 100%);
  border: 2px solid #7060ff;
  border-radius: 16px;
  box-shadow: 0 0 30px rgba(112,90,255,0.55),0 0 60px rgba(80,40,200,0.2);
  margin: 8px; overflow: hidden;
}
.titlebar {
  background: linear-gradient(90deg,#a06008 0%,#f5c842 28%,#ffe870 50%,#f5c842 72%,#a06008 100%);
  color: #3a1a00; font-weight: 900; font-size: 14px;
  padding: 6px 12px;
  display: flex; align-items: center; justify-content: space-between;
  letter-spacing: 1px;
}
.titlebar a { text-decoration:none;font-size:16px; }
.titlebar .tc { flex:1;text-align:center; }
.titlebar .side { min-width:24px; }
.content { padding:12px; }
.led {
  background:#0a0018;color:#ff60c0;border:1px solid #ff40a0;border-radius:6px;
  font-family:monospace;font-size:16px;padding:3px 8px;
  box-shadow:0 0 10px rgba(255,80,160,0.5);letter-spacing:2px;display:inline-block;
}
.btn {
  background:linear-gradient(160deg,#3a2080 0%,#22105a 100%);
  color:#b898ff;border:1px solid #5a3aaa;border-radius:10px;
  padding:8px 14px;font-weight:bold;font-size:14px;
  cursor:pointer;transition:filter 0.15s;font-family:inherit;
}
.btn:hover { filter:brightness(1.3); }
.btn:disabled { opacity:0.4;cursor:not-allowed; }
.btn:disabled:hover { filter:none; }
.btn-danger { background:linear-gradient(160deg,#801020 0%,#5a0a10 100%);color:#ffaaaa;border-color:#aa2030; }
.btn-success { background:linear-gradient(160deg,#206040 0%,#104020 100%);color:#88ffbb;border-color:#30aa60; }
.btn-gold { background:linear-gradient(160deg,#806020 0%,#5a4010 100%);color:#ffe870;border-color:#aa8020; }
.action-bar {
  background:linear-gradient(0deg,#060412 0%,rgba(10,6,28,0.97) 100%);
  border-top:1px solid #4030a0;
  position:fixed;bottom:0;left:0;right:0;
  padding:8px 12px 10px;
  display:flex;gap:8px;justify-content:center;z-index:100;
}
.hp-bar-wrap { background:#0a0018;border-radius:4px;overflow:hidden;border:1px solid #1a0a30; }
.hp-bar { height:100%;border-radius:4px;transition:width 0.4s,background-color 0.4s; }
.mp-bar-wrap { background:#0a0018;border-radius:4px;overflow:hidden;border:1px solid #1a0a30; }
.mp-bar { height:100%;background:linear-gradient(90deg,#0044bb,#0088ff);border-radius:4px;transition:width 0.3s; }
.screen { display:none; }
.screen.active { display:block; }
.game-title {
  font-size:28px;font-weight:900;color:#ffe870;
  text-shadow:0 0 20px rgba(255,200,50,0.8),0 0 40px rgba(255,150,0,0.4);
  margin-bottom:4px;letter-spacing:3px;
  font-family:'Courier New',monospace;
}
.game-subtitle { font-size:13px;color:#b898ff;margin-bottom:20px; }
.title-art { font-size:64px;margin:14px 0;animation:floatY 3s ease-in-out infinite;display:block; }
@keyframes floatY { 0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)} }
.village-grid { display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0; }
.village-card {
  background:linear-gradient(160deg,#1a0a40 0%,#0d0525 100%);
  border:1px solid #5040a0;border-radius:12px;
  padding:14px 10px;text-align:center;
  cursor:pointer;transition:filter 0.15s,border-color 0.15s;
  font-size:13px;color:#b898ff;
}
.village-card:hover { filter:brightness(1.3);border-color:#9070ff; }
.village-card .ce { font-size:26px;display:block;margin-bottom:5px; }
.village-card .cn { font-weight:bold;font-size:14px; }
.hero-panel {
  background:#05010f;border:1px solid #3a2080;border-radius:10px;
  padding:10px;margin-bottom:10px;display:flex;align-items:center;gap:10px;
}
.hero-emoji { font-size:30px; }
.hero-info { flex:1; }
.area-card {
  background:linear-gradient(160deg,#1a0a40 0%,#0d0525 100%);
  border:1px solid #5040a0;border-radius:12px;
  padding:12px;margin-bottom:8px;cursor:pointer;transition:filter 0.15s;
}
.area-card:hover { filter:brightness(1.3); }
.area-card.locked { opacity:0.4;cursor:not-allowed;filter:none; }
.shop-row {
  display:flex;align-items:center;justify-content:space-between;
  background:#05010f;border-radius:8px;padding:8px 10px;
  border:1px solid #2a1860;margin-bottom:6px;
}
.party-card { background:#05010f;border:1px solid #2a1860;border-radius:10px;padding:12px;margin-bottom:8px; }
.monster-entry {
  background:#05010f;border:1px solid #2a1060;border-radius:8px;
  padding:10px;margin-bottom:6px;display:flex;align-items:center;gap:10px;
}
.monster-entry.caught { border-color:#5040a0;background:#0a0520; }
.monster-entry.uncaught { opacity:0.45; }
.overlay {
  position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.75);
  z-index:500;display:flex;align-items:center;justify-content:center;
}
.overlay-box {
  background:linear-gradient(160deg,#1e1248 0%,#0d0830 100%);
  border:2px solid #7060ff;border-radius:16px;padding:22px;
  max-width:320px;width:90%;text-align:center;
  box-shadow:0 0 30px rgba(112,90,255,0.55);
}
.hidden { display:none !important; }
.gold-display { color:#ffe870;font-weight:bold;font-size:14px;margin-bottom:10px; }
hr.sep { border:none;border-top:1px solid #2a1860;margin:10px 0; }
.label { color:#8070c0;font-size:11px;letter-spacing:1px;text-transform:uppercase; }
.tg{color:#ffe870} .tp{color:#ff60c0} .tb{color:#60b0ff}
.tgr{color:#60ff90} .tr{color:#ff6060} .tpu{color:#b898ff}
.ending-title { font-size:26px;color:#ffe870;text-shadow:0 0 20px gold;margin:16px 0; }

/* ===== JRPG BATTLE STYLES ===== */
#battle-field {
  height: 210px;
  position: relative;
  overflow: hidden;
  transition: background 0.5s;
}
/* Ground strip */
#battle-field::after {
  content: '';
  position: absolute;
  bottom: 0; left: 0; right: 0;
  height: 36px;
  background: rgba(0,0,0,0.18);
  border-top: 2px solid rgba(255,255,255,0.08);
}
/* Enemy HUD - top left (Pokemon-style) */
#enemy-hud {
  position: absolute;
  top: 10px; left: 8px;
  background: rgba(8,4,22,0.88);
  border: 2px solid #ffe870;
  border-radius: 6px;
  padding: 5px 9px 5px 9px;
  min-width: 155px;
  z-index: 10;
}
.ehud-name {
  font-family: 'Courier New', monospace;
  font-weight: bold;
  color: #fff;
  font-size: 12px;
  letter-spacing: 0.5px;
  white-space: nowrap;
}
.ehud-hp {
  font-family: monospace;
  font-size: 10px;
  color: #aaa;
  margin-top: 1px;
  text-align: right;
}
.ehud-row { margin-bottom: 0; }
.ehud-row + .ehud-row { margin-top: 5px; border-top: 1px solid #2a1860; padding-top: 4px; }

/* JRPG HP bar */
.jrpg-hpbar-wrap {
  background: #1a0830;
  border-radius: 2px;
  height: 7px;
  margin: 2px 0 1px 0;
  border: 1px solid #3a1a60;
  overflow: hidden;
}
.jrpg-hpbar {
  height: 100%;
  border-radius: 2px;
  transition: width 0.45s ease, background-color 0.45s ease;
}

/* Enemy sprites - large, right side */
#enemy-sprites {
  position: absolute;
  right: 10px;
  top: 8px;
  display: flex;
  flex-direction: row;
  align-items: flex-start;
  gap: 0px;
  z-index: 5;
}
.enemy-spr {
  display: block;
  line-height: 1;
  filter: drop-shadow(3px 4px 8px rgba(0,0,0,0.7));
  transition: opacity 0.3s;
  cursor: default;
  user-select: none;
}
.enemy-spr.faded { opacity: 0.12; }
@keyframes enemyShake {
  0%,100%{transform:translateX(0)}
  20%{transform:translateX(-10px)}
  40%{transform:translateX(10px)}
  60%{transform:translateX(-6px)}
  80%{transform:translateX(6px)}
}
.enemy-shake { animation: enemyShake 0.35s; }

/* Player sprite - bottom left */
#player-sprite-el {
  position: absolute;
  left: 14px;
  bottom: 42px;
  font-size: 44px;
  z-index: 5;
  filter: drop-shadow(2px 3px 5px rgba(0,0,0,0.6));
  line-height: 1;
}
@keyframes playerFlash {
  0%,100%{filter:drop-shadow(2px 3px 5px rgba(0,0,0,0.6))}
  40%{filter:drop-shadow(0 0 12px #ff4444) brightness(1.8)}
  70%{filter:drop-shadow(2px 3px 5px rgba(0,0,0,0.6)) brightness(0.5)}
}
.player-flash { animation: playerFlash 0.45s; }

/* Player HUD - bottom right (Pokemon-style) */
#player-hud {
  position: absolute;
  right: 8px;
  bottom: 6px;
  background: rgba(8,4,22,0.9);
  border: 2px solid #ffe870;
  border-radius: 6px;
  padding: 5px 9px;
  min-width: 165px;
  max-width: 185px;
  z-index: 10;
}
.phud-name {
  font-family: 'Courier New', monospace;
  font-weight: bold;
  color: #ffe870;
  font-size: 12px;
  letter-spacing: 0.5px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.phud-lv { color: #b898ff; font-size: 11px; }
.phud-bar-row {
  display: flex;
  align-items: center;
  gap: 4px;
  margin-top: 2px;
}
.phud-label { font-family: monospace; font-size: 10px; color: #ffe870; min-width: 16px; }
.phud-bar { flex: 1; }
.phud-num { font-family: monospace; font-size: 10px; color: #ccc; min-width: 44px; text-align: right; }

/* Battle UI area (below field) */
#battle-ui {
  background: #050115;
  padding: 7px 8px 8px;
  border-top: 2px solid #2a1060;
}

/* DQ-style message box */
#dq-msgbox {
  background: #08041a;
  border: 3px solid #ffe870;
  border-radius: 4px;
  padding: 9px 12px 8px;
  min-height: 62px;
  margin-bottom: 7px;
  position: relative;
  font-family: 'Courier New', 'MS Gothic', monospace;
}
#msg-text {
  color: #ffffff;
  font-size: 14px;
  line-height: 1.55;
  letter-spacing: 0.3px;
  min-height: 42px;
  white-space: pre-wrap;
}
#msg-cursor {
  position: absolute;
  bottom: 5px; right: 9px;
  color: #ffe870;
  font-size: 11px;
  display: none;
  animation: blink 0.75s infinite;
}
@keyframes blink { 0%,100%{opacity:1}50%{opacity:0} }

/* Command panel */
#cmd-panel { min-height: 82px; }
.jrpg-cmd-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 5px;
}
.jrpg-cmd-btn {
  background: linear-gradient(180deg,#18094a 0%,#0c0530 100%);
  border: 2px solid #4a38a0;
  border-radius: 4px;
  color: #fff;
  font-family: 'Courier New', monospace;
  font-size: 15px;
  font-weight: bold;
  padding: 11px 6px;
  cursor: pointer;
  letter-spacing: 1px;
  text-align: center;
  transition: background 0.1s, border-color 0.1s;
  touch-action: manipulation;
}
.jrpg-cmd-btn:hover, .jrpg-cmd-btn:active {
  background: linear-gradient(180deg,#2a1490 0%,#160a50 100%);
  border-color: #ffe870;
  color: #ffe870;
}
.jrpg-cmd-btn:disabled {
  opacity: 0.35;
  cursor: not-allowed;
  border-color: #2a1860;
}
.jrpg-cmd-btn:disabled:hover { background:linear-gradient(180deg,#18094a 0%,#0c0530 100%);border-color:#2a1860;color:#fff; }

/* Submenu (spell/item/target list) */
.jrpg-submenu {
  background: #08041a;
  border: 2px solid #4a38a0;
  border-radius: 4px;
  overflow: hidden;
  max-height: 150px;
  overflow-y: auto;
}
.jrpg-subitem {
  padding: 7px 12px;
  font-family: 'Courier New', monospace;
  font-size: 13px;
  color: #fff;
  cursor: pointer;
  border-bottom: 1px solid #1a0a40;
  display: flex;
  justify-content: space-between;
  align-items: center;
  touch-action: manipulation;
}
.jrpg-subitem:last-child { border-bottom: none; }
.jrpg-subitem:hover, .jrpg-subitem:active { background: #1e0c60; color: #ffe870; }
.jrpg-subitem.disabled { opacity: 0.35; cursor: not-allowed; pointer-events: none; }
.jrpg-back-btn {
  display: block;
  width: 100%;
  text-align: center;
  padding: 7px;
  font-family: monospace;
  font-size: 13px;
  color: #b898ff;
  cursor: pointer;
  border-top: 1px solid #2a1860;
  background: #050112;
  touch-action: manipulation;
}
.jrpg-back-btn:hover { color: #ffe870; }

/* Floating damage numbers */
.float-dmg {
  position: absolute;
  font-family: 'Courier New', monospace;
  font-size: 22px;
  font-weight: bold;
  pointer-events: none;
  animation: floatUp 1.1s ease-out forwards;
  z-index: 50;
  text-shadow: 2px 2px 0 #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000;
}
@keyframes floatUp {
  0%{transform:translateY(0) scale(1.2);opacity:1}
  20%{transform:translateY(-10px) scale(1);opacity:1}
  100%{transform:translateY(-55px) scale(0.8);opacity:0}
}

/* Victory / Defeat panels */
.result-panel {
  text-align: center;
  padding: 6px 0 4px;
}
.result-title {
  font-size: 20px;
  font-weight: bold;
  font-family: 'Courier New', monospace;
  letter-spacing: 2px;
  margin-bottom: 5px;
}
.result-btns {
  display: flex;
  gap: 6px;
  justify-content: center;
  flex-wrap: wrap;
  margin-top: 8px;
}
</style>

<body>
<div id="home-top-bar"><button id="home-top-btn" onclick="showHomeConfirm()">&#x1F3E0; ホーム</button></div>

<canvas id="starCanvas"></canvas>
<canvas id="confettiCanvas"></canvas>

<div id="app">

<!-- TITLE SCREEN -->
<div id="title-screen" class="screen">
  <div class="window">
    <div class="titlebar">
      <a href="index.html" class="side">🏠</a>
      <span class="tc">ミニRPG</span>
      <span class="side"></span>
    </div>
    <div class="content" style="text-align:center;padding:24px 16px">

        <button class="btn btn-gold" style="width:100%;padding:14px;font-size:16px;font-family:'Courier New',monospace;letter-spacing:2px" onclick="startNewGame()">⚔️ はじめから</button>
        <button class="btn" style="width:100%;padding:14px;font-size:16px;font-family:'Courier New',monospace;letter-spacing:2px" id="continue-btn" onclick="continueGame()">📖 つづきから</button>

<!-- VILLAGE SCREEN -->
<div id="village-screen" class="screen">
  <div class="window">
    <div class="titlebar">
      <a href="index.html" class="side" onclick="confirmHome(event)">🏠</a>
      <span class="tc">むらのひろば</span>
      <span class="side"></span>
    </div>
    <div class="content">
      <div id="village-hero-panel"></div>
      <div class="village-grid">

        </div>
        <div class="village-card" onclick="showScreen('shop-screen')">
          <span class="ce">🛒</span><div class="cn">ショップ</div>
          <div style="font-size:11px;color:#8070c0;margin-top:3px">アイテムを買う</div>
        </div>
        <div class="village-card" onclick="goToInn()">
          <span class="ce">🏨</span><div class="cn">やどや</div>
          <div style="font-size:11px;color:#8070c0;margin-top:3px">HP/MP回復(50G)</div>
        </div>
        <div class="village-card" onclick="showScreen('party-screen')">
          <span class="ce">👥</span><div class="cn">パーティ</div>
          <div style="font-size:11px;color:#8070c0;margin-top:3px">仲間を確認する</div>
        </div>
      </div>
      <div class="village-card" style="margin-top:0" onclick="showScreen('encyclopedia-screen')">
        <span class="ce">📖</span><div class="cn">図鑑</div>
        <div style="font-size:11px;color:#8070c0;margin-top:3px">捕まえたモンスターを見る</div>
      </div>
    </div>
  </div>
</div>

<!-- AREA SELECT -->
<div id="area-select-screen" class="screen">
  <div class="window">
    <div class="titlebar">
      <span class="side" onclick="showScreen('village-screen')" style="cursor:pointer">◀</span>
      <span class="tc">エリア選択</span>
      <span class="side"></span>
    </div>
    <div class="content" id="area-list"></div>
  </div>
</div>

<!-- BATTLE SCREEN - JRPG STYLE -->

// ============================================================
// AUDIO (Web Audio API)
// ============================================================
let _audioCtx = null;
function getAudio() {
  if (!_audioCtx) _audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return _audioCtx;
}
function beep(freq, dur, type='square', vol=0.1, delay=0) {
  try {
    const ctx = getAudio();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    osc.type = type; osc.frequency.value = freq;
    const t = ctx.currentTime + delay;
    gain.gain.setValueAtTime(0.001, t);
    gain.gain.linearRampToValueAtTime(vol, t + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.001, t + dur);
    osc.start(t); osc.stop(t + dur + 0.02);
  } catch(e){}
}

const SC = document.getElementById('starCanvas');
const SX = SC.getContext('2d');
let stars = [];
function initStars() {
  SC.width = window.innerWidth; SC.height = window.innerHeight;
  stars = Array.from({length:150}, () => ({
    x: Math.random()*SC.width, y: Math.random()*SC.height,
    r: Math.random()*1.5+0.3, a: Math.random(),
    da: (Math.random()*0.01+0.002)*(Math.random()<0.5?1:-1)
  }));
}
function drawStars() {
  SX.clearRect(0,0,SC.width,SC.height);
  for (const s of stars) {
    s.a += s.da;
    if (s.a<=0||s.a>=1) s.da*=-1;
    SX.beginPath(); SX.arc(s.x,s.y,s.r,0,Math.PI*2);
    SX.fillStyle = `rgba(255,255,255,${s.a})`; SX.fill();
  }
  requestAnimationFrame(drawStars);
}

// ============================================================
// CONFETTI
// ============================================================
const CC = document.getElementById('confettiCanvas');
const CX = CC.getContext('2d');
let confetti=[], confettiOn=false;
function startConfetti() {
  CC.width=window.innerWidth; CC.height=window.innerHeight;
  CC.style.display='block'; confettiOn=true;
  confetti=Array.from({length:120},()=>({
    x:Math.random()*CC.width, y:Math.random()*CC.height-CC.height,
    w:Math.random()*10+5, h:Math.random()*6+3,
    color:['#ff60c0','#ffe870','#b898ff','#60ff90','#60b0ff'][Math.floor(Math.random()*5)],
    vy:Math.random()*3+1, vx:(Math.random()-0.5)*2,
    rot:Math.random()*Math.PI*2, vrot:(Math.random()-0.5)*0.1,
  }));
  animateConfetti();
  setTimeout(stopConfetti,5000);
}
function animateConfetti() {
  if(!confettiOn)return;
  CX.clearRect(0,0,CC.width,CC.height);
  for(const p of confetti){
    p.x+=p.vx; p.y+=p.vy; p.rot+=p.vrot;
    if(p.y>CC.height){p.y=-10;p.x=Math.random()*CC.width;}
    CX.save(); CX.translate(p.x,p.y); CX.rotate(p.rot);
    CX.fillStyle=p.color; CX.fillRect(-p.w/2,-p.h/2,p.w,p.h);
    CX.restore();
  }
  requestAnimationFrame(animateConfetti);
}
function stopConfetti(){confettiOn=false;CC.style.display='none';}

function ri(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function hpColor(p){return p>0.5?'#00cc44':p>0.25?'#ffcc00':'#dd2200';}
function hpBar(hp,max,h='9px'){
  const p=Math.max(0,hp/max);
  return `<div class="hp-bar-wrap" style="height:${h}"><div class="hp-bar" style="width:${Math.round(p*100)}%;background:${hpColor(p)}"></div></div>`;
}
function mpBar(mp,max){
  const p=Math.max(0,mp/max);
  return `<div class="mp-bar-wrap" style="height:6px"><div class="mp-bar" style="width:${Math.round(p*100)}%"></div></div>`;
}

function doInn(){
  G.gold-=50;
  G.hero.hp=G.hero.maxHp; G.hero.mp=G.hero.maxMp; G.hero.status=[];
  for(const m of G.party){m.hp=m.maxHp;m.status=[];}

  showOverlay(`<div style="font-size:30px;margin-bottom:10px">😴✨</div>
    <p style="margin-bottom:16px">ゆっくり休んで体力が全回復した！</p>

// ============================================================
// BATTLE: SETUP
// ============================================================
function mkEnemy(typeId,scaleLv){
  const t=MONSTER_TYPES[typeId];
  const sc=1+(scaleLv-1)*0.12;
  return{
    typeId,emoji:t.emoji,name:t.name,type:t.type,
    hp:Math.round(t.baseHp*sc),maxHp:Math.round(t.baseHp*sc),
    atk:Math.round(t.baseAtk*sc),def:Math.round(t.baseDef*sc),spd:t.baseSpd,
    skills:t.skills,exp:Math.round(20*sc),gold:Math.round(15*sc),
    status:[],isBoss:false,catchable:true,
  };
}
function mkBoss(data){return{...data,maxHp:data.hp,status:[],isBoss:true,catchable:false,typeId:-1};}
function mkPartyMon(typeId,lv){
  const t=MONSTER_TYPES[typeId];
  const sc=1+(lv-1)*0.12;
  return{
    typeId,emoji:t.emoji,name:t.name,type:t.type,
    hp:Math.round(t.baseHp*sc),maxHp:Math.round(t.baseHp*sc),
    atk:Math.round(t.baseAtk*sc),def:Math.round(t.baseDef*sc),spd:t.baseSpd,
    skills:t.skills,lv:lv,exp:0,status:[],
  };
}

function startBattle(area,isBoss,isFB){
  battleOver=false; battleBusy=false;
  _pendingSkill=null; _pendingItem=null;

  let enemies=[];
  let bgGrad='linear-gradient(180deg,#4e8abf 0%,#70b8e8 35%,#6ab04c 65%,#4a8030 100%)';

  if(isFB){
    enemies=[{...FINAL_BOSS,maxHp:FINAL_BOSS.hp,hp:FINAL_BOSS.hp,status:[],isBoss:true,catchable:false,phase:1}];
    document.getElementById('battle-area-title').textContent='最終決戦 ～魔王ゾルダ～';
    bgGrad=FB_BG;
  } else if(isBoss){
    enemies=[mkBoss(area.boss)];
    document.getElementById('battle-area-title').textContent=area.name+' ボス戦';
    bgGrad=area.bgGrad||bgGrad;
  } else {
    const num=Math.floor(Math.random()*2)+1;
    const scaleLv=Math.max(1,G.hero.lv-1+area.id*3);
    for(let i=0;i<num;i++) enemies.push(mkEnemy(area.enemies[Math.floor(Math.random()*area.enemies.length)],scaleLv));
    document.getElementById('battle-area-title').textContent=area.name;
    bgGrad=area.bgGrad||bgGrad;
  }

  document.getElementById('battle-field').style.background=bgGrad;

  const allies=[
    {...G.hero,isHero:true,atk:heroAtk(),def:heroDef(),status:[...(G.hero.status||[])]},
    ...G.party.map(m=>({...m,status:[...(m.status||[])]}))
  ];

  BT={enemies,allies,turnOrder:[],currentTurn:0,area,isBoss,isFB,isNormal:!isBoss&&!isFB,roundCount:0};
  buildTurnOrder();
  showScreen('battle-screen');
  renderBattle();

  const names=enemies.map(e=>e.name).join('と');
  logMsg(`${names}があらわれた！`, ()=>setTimeout(advanceTurn,300));
}

function buildTurnOrder(){
  const units=[];
  BT.allies.forEach((a,i)=>{if(a.hp>0)units.push({t:'a',i,spd:a.status.includes('slow')?Math.floor(a.spd/2):a.spd});});
  BT.enemies.forEach((e,i)=>{if(e.hp>0)units.push({t:'e',i,spd:e.status.includes('slow')?Math.floor(e.spd/2):e.spd});});
  units.sort((a,b)=>b.spd-a.spd);
  BT.turnOrder=units; BT.currentTurn=0;
}

// ============================================================
// BATTLE: TURN ENGINE
// ============================================================
function advanceTurn(){
  if(battleOver||battleBusy)return;
  const ae=BT.enemies.filter(e=>e.hp>0);
  const aa=BT.allies.filter(a=>a.hp>0);
  if(ae.length===0){battleBusy=true;setTimeout(endVictory,500);return;}
  if(aa.length===0){battleBusy=true;setTimeout(endDefeat,500);return;}
  if(BT.currentTurn>=BT.turnOrder.length){
    applyStatusTick();
    buildTurnOrder();
    BT.roundCount=(BT.roundCount||0)+1;
    const ae2=BT.enemies.filter(e=>e.hp>0);
    const aa2=BT.allies.filter(a=>a.hp>0);
    if(ae2.length===0){battleBusy=true;setTimeout(endVictory,500);return;}
    if(aa2.length===0){battleBusy=true;setTimeout(endDefeat,500);return;}
  }
  let found=false;
  while(BT.currentTurn<BT.turnOrder.length&&!found){
    const u=BT.turnOrder[BT.currentTurn];
    const obj=u.t==='a'?BT.allies[u.i]:BT.enemies[u.i];
    BT.currentTurn++;
    if(obj.hp<=0)continue;
    found=true;
    if(u.t==='a'&&u.i===0){
      showPlayerActions('main');
    } else if(u.t==='a'){
      battleBusy=true;
      setTimeout(()=>{allyAuto(u.i);battleBusy=false;},500);
    } else {
      battleBusy=true;
      setTimeout(()=>{enemyAct(u.i);battleBusy=false;},600);
    }
  }
  if(!found)setTimeout(advanceTurn,100);
}

function applyStatusTick(){
  const all=[...BT.allies,...BT.enemies];
  const msgs=[];
  for(const u of all){
    if(!u.status)u.status=[];
    if(u.hp>0&&u.status.includes('poison')){
      u.hp=Math.max(0,u.hp-10);
      if(u.isHero)G.hero.hp=u.hp;
      msgs.push(`${u.name}は毒のダメージ！(-10)`);
    }
  }
  if(msgs.length){renderBattle();msgs.forEach((m,i)=>setTimeout(()=>logMsg(m),i*400));}
}

// ============================================================
// BATTLE: TYPEWRITER MESSAGE BOX
// ============================================================
let _typeTimer=null;
let _typeCb=null;

function logMsg(text,cb){
  if(_typeTimer){clearTimeout(_typeTimer);_typeTimer=null;}
  const el=document.getElementById('msg-text');
  const cursor=document.getElementById('msg-cursor');
  if(!el)return;
  cursor.style.display='none';
  el.textContent='';
  let i=0;
  const speed=26;
  function tick(){
    if(i<text.length){
      el.textContent+=text[i++];
      _typeTimer=setTimeout(tick,speed);
    } else {
      cursor.style.display='block';
      if(cb){
        _typeCb=cb;
        _typeTimer=setTimeout(()=>{
          cursor.style.display='none';
          _typeCb=null;
          cb();
        },420);
      }
    }
  }
  tick();
}

function seqLog(msgs,finalCb){
  let i=0;
  function next(){
    if(i>=msgs.length){if(finalCb)finalCb();return;}
    logMsg(msgs[i++],next);
  }
  next();
}

function clearActions(){
  document.getElementById('cmd-panel').innerHTML='';
}

// BATTLE: PLAYER ACTIONS (DQ COMMAND MENU)
// ============================================================

  const panel=document.getElementById('cmd-panel');

    const ae=BT.enemies.filter(e=>e.hp>0);

      <button class="jrpg-cmd-btn" onclick="heroAttack()">⚔️ たたかう</button>
      <button class="jrpg-cmd-btn" onclick="showPlayerActions('skill')">✨ まほう</button>
      <button class="jrpg-cmd-btn" onclick="showPlayerActions('item')">🧪 どうぐ</button>
      <button class="jrpg-cmd-btn" onclick="attemptEscape()">🏃 にげる</button>
    </div>
    ${canCatch?`<div style="text-align:center;margin-top:5px"><button class="jrpg-cmd-btn" style="width:100%;padding:7px;font-size:13px" onclick="attemptCapture()">🔮 つかまえる (ボール:${G.inventory.monsterBall}個)</button></div>`:''}`;
  } else if(mode==='skill'){
    let h='<div class="jrpg-submenu">';

    }
    h+=`</div><div class="jrpg-back-btn" onclick="showPlayerActions('main')">◀ もどる</div>`;
    panel.innerHTML=h;
  } else if(mode==='item'){
    const defs=[{id:'potion',n:'ポーション'},{id:'hiPotion',n:'ハイポーション'},{id:'elixir',n:'エリクサー'}];
    let h='<div class="jrpg-submenu">';
    let hasAny=false;
    for(const it of defs){
      const cnt=G.inventory[it.id]||0;
      if(!cnt)continue;
      hasAny=true;
      h+=`<div class="jrpg-subitem" onclick="useItem('${it.id}')">
        <span>${it.n}</span><span style="color:#aaa;font-size:11px">${cnt}個</span>
      </div>`;
    }
    if(!hasAny)h+=`<div class="jrpg-subitem" style="color:#555;pointer-events:none">アイテムなし</div>`;
    h+=`</div><div class="jrpg-back-btn" onclick="showPlayerActions('main')">◀ もどる</div>`;
    panel.innerHTML=h;
  } else if(mode==='selectAlly'){
    let h='<div class="jrpg-submenu">';
    for(let i=0;i<BT.allies.length;i++){
      const a=BT.allies[i];
      if(a.hp<=0)continue;
      h+=`<div class="jrpg-subitem" onclick="${ctx.cb}(${i})">
        <span>${a.emoji} ${a.name}</span>
        <span style="color:#aaa;font-size:11px">HP ${a.hp}/${a.maxHp}</span>
      </div>`;
    }
    h+=`</div><div class="jrpg-back-btn" onclick="showPlayerActions('main')">◀ もどる</div>`;
    panel.innerHTML=h;
  } else if(mode==='selectEnemy'){
    let h='<div class="jrpg-submenu">';
    for(let i=0;i<BT.enemies.length;i++){
      const e=BT.enemies[i];
      if(e.hp<=0)continue;
      h+=`<div class="jrpg-subitem" onclick="${ctx.cb}(${i})">
        <span>${e.emoji} ${e.name}</span>
        <span style="color:#aaa;font-size:11px">HP ${e.hp}/${e.maxHp}</span>
      </div>`;
    }

// ── Hero: basic attack ──
function heroAttack(){
  const ae=BT.enemies.filter(e=>e.hp>0);
  if(ae.length===1)doHeroAttack(BT.enemies.indexOf(ae[0]));
  else showPlayerActions('selectEnemy',{cb:'doHeroAttack'});
}
function doHeroAttack(ei){
  clearActions();
  const h=BT.allies[0],e=BT.enemies[ei];
  const dmg=Math.max(1,h.atk-Math.floor(e.def/2)+ri(-3,3));
  e.hp=Math.max(0,e.hp-dmg);
  sndAttack();
  const pos=enemyDmgPos(ei);
  showFloatDmg(`-${dmg}`,pos.x,pos.y,'#ff5555');
  shakeEnemy(ei);
  logMsg(`${h.name}のこうげき！\n${e.name}に${dmg}のダメージ！`,()=>{renderBattle();setTimeout(advanceTurn,350);});
}

// ── Hero: skills ──
function heroSkill(name){
  const sk=HERO_SKILLS.find(s=>s.name===name);
  if(!sk)return;
  _pendingSkill=name;
  if(sk.effect==='physical'){heroAttack();return;}
  if(sk.target==='ally'||sk.effect==='heal'||sk.effect==='healFull')
    showPlayerActions('selectAlly',{cb:'execHealSkill'});
  else if(sk.effect==='magicAll')
    execMagicAll();
  else {
    const ae=BT.enemies.filter(e=>e.hp>0);
    if(ae.length===1)execMagicSingle(BT.enemies.indexOf(ae[0]));
    else showPlayerActions('selectEnemy',{cb:'execMagicSingle'});
  }
}
function execHealSkill(ai){
  clearActions();
  const sk=HERO_SKILLS.find(s=>s.name===_pendingSkill);
  const hero=BT.allies[0];const tgt=BT.allies[ai];
  hero.mp-=sk.mp;G.hero.mp=hero.mp;
  sndHeal();
  let msg;
  if(sk.effect==='healFull'){
    tgt.hp=tgt.maxHp;if(tgt.isHero)G.hero.hp=tgt.hp;
    msg=`${hero.name}の${sk.name}！\n${tgt.name}のHPが全回復した！`;
  } else {
    const heal=sk.power||60;
    tgt.hp=Math.min(tgt.maxHp,tgt.hp+heal);if(tgt.isHero)G.hero.hp=tgt.hp;
    msg=`${hero.name}の${sk.name}！\n${tgt.name}のHPが${heal}回復した！`;
  }
  logMsg(msg,()=>{renderBattle();setTimeout(advanceTurn,350);});
}
function execMagicSingle(ei){
  clearActions();
  const sk=HERO_SKILLS.find(s=>s.name===_pendingSkill);
  const hero=BT.allies[0];const e=BT.enemies[ei];
  hero.mp-=sk.mp;G.hero.mp=hero.mp;
  let dmg=(sk.power||0)+ri(-5,5);
  if(sk.effect!=='magicIgnoreDef')dmg=Math.max(1,dmg-Math.floor(e.def/4));
  dmg=Math.max(1,dmg);
  e.hp=Math.max(0,e.hp-dmg);
  sndMagic();
  const pos=enemyDmgPos(ei);
  showFloatDmg(`-${dmg}`,pos.x,pos.y,'#88ccff');
  shakeEnemy(ei);
  logMsg(`${hero.name}の${sk.name}！\n${e.name}に${dmg}のダメージ！`,()=>{renderBattle();setTimeout(advanceTurn,350);});
}
function execMagicAll(){
  clearActions();
  const sk=HERO_SKILLS.find(s=>s.name===_pendingSkill);
  const hero=BT.allies[0];
  hero.mp-=sk.mp;G.hero.mp=hero.mp;
  sndMagic();
  const msgs=[`${hero.name}の${sk.name}！`];
  for(let i=0;i<BT.enemies.length;i++){
    const e=BT.enemies[i];
    if(e.hp<=0)continue;
    const dmg=Math.max(1,(sk.power||50)+ri(-5,5));
    e.hp=Math.max(0,e.hp-dmg);
    const pos=enemyDmgPos(i);
    showFloatDmg(`-${dmg}`,pos.x,pos.y,'#88ccff');
    shakeEnemy(i);
    msgs.push(`${e.name}に${dmg}のダメージ！`);
  }
  seqLog(msgs,()=>{renderBattle();setTimeout(advanceTurn,350);});
}

// ── Hero: items ──
function useItem(itemId){_pendingItem=itemId;showPlayerActions('selectAlly',{cb:'execItem'});}
function execItem(ai){
  clearActions();
  const id=_pendingItem;const tgt=BT.allies[ai];
  G.inventory[id]--;
  sndHeal();
  let msg;
  if(id==='potion'){tgt.hp=Math.min(tgt.maxHp,tgt.hp+80);if(tgt.isHero)G.hero.hp=tgt.hp;msg=`${tgt.name}のHPが80回復した！`;}
  else if(id==='hiPotion'){tgt.hp=Math.min(tgt.maxHp,tgt.hp+250);if(tgt.isHero)G.hero.hp=tgt.hp;msg=`${tgt.name}のHPが250回復した！`;}
  else if(id==='elixir'){tgt.hp=tgt.maxHp;if(tgt.isHero){tgt.mp=tgt.maxMp;G.hero.hp=tgt.hp;G.hero.mp=tgt.mp;}msg=`${tgt.name}のHP・MPが全回復した！`;}
  logMsg(msg,()=>{renderBattle();setTimeout(advanceTurn,350);});
}

// ── Capture ──
function attemptCapture(){
  const ae=BT.enemies.filter(e=>e.hp>0);
  if(ae.length!==1||ae[0].isBoss)return;
  clearActions();
  const enemy=ae[0];
  G.inventory.monsterBall--;
  const pct=Math.min(90,(1-enemy.hp/enemy.maxHp)*80+10)*(MONSTER_TYPES[enemy.typeId]?.catchRate||1);
  logMsg(`🔮 モンスターボールを投げた！`,()=>{
    if(Math.random()*100<pct){
      if(!G.caughtMonsters.includes(enemy.typeId))G.caughtMonsters.push(enemy.typeId);
      if(G.party.length<2){
        G.party.push(mkPartyMon(enemy.typeId,1));

// ============================================================
// BATTLE: ALLY AUTO
// ============================================================
function allyAuto(ai){
  const ally=BT.allies[ai];
  if(!ally||ally.hp<=0){advanceTurn();return;}
  if(ally.status.includes('paralysis')&&Math.random()<0.5){
    logMsg(`${ally.name}はまひで動けない！`,()=>{renderBattle();setTimeout(advanceTurn,350);});return;
  }
  const ae=BT.enemies.filter(e=>e.hp>0);
  if(!ae.length){advanceTurn();return;}
  const tgt=ae[Math.floor(Math.random()*ae.length)];
  const healSk=ally.skills.find(s=>s.effect==='heal');
  if(healSk){
    const lowAlly=BT.allies.find(a=>a.hp>0&&a.hp<a.maxHp*0.4);
    if(lowAlly){
      lowAlly.hp=Math.min(lowAlly.maxHp,lowAlly.hp+healSk.power);
      if(lowAlly.isHero)G.hero.hp=lowAlly.hp;
      sndHeal();
      logMsg(`${ally.name}の${healSk.name}！\n${lowAlly.name}のHPが${healSk.power}回復！`,()=>{renderBattle();setTimeout(advanceTurn,350);});return;
    }
  }
  const atkSk=ally.skills.find(s=>s.effect==='dmg');
  if(atkSk&&Math.random()<0.45){
    let dmg=atkSk.power||Math.max(1,ally.atk-Math.floor(tgt.def/2));
    if(atkSk.atkMult)dmg=Math.round(ally.atk*atkSk.atkMult);
    dmg=Math.max(1,dmg+ri(-3,3));
    tgt.hp=Math.max(0,tgt.hp-dmg);
    if(atkSk.status)addStatus(tgt,atkSk.status);
    sndAttack();
    const idx=BT.enemies.indexOf(tgt);
    const pos=enemyDmgPos(idx);
    showFloatDmg(`-${dmg}`,pos.x,pos.y,'#ff9955');
    shakeEnemy(idx);
    logMsg(`${ally.name}の${atkSk.name}！\n${tgt.name}に${dmg}のダメージ！`,()=>{renderBattle();setTimeout(advanceTurn,350);});return;
  }
  const dmg=Math.max(1,ally.atk-Math.floor(tgt.def/2)+ri(-3,3));
  tgt.hp=Math.max(0,tgt.hp-dmg);
  sndAttack();
  const idx=BT.enemies.indexOf(tgt);
  const pos=enemyDmgPos(idx);
  showFloatDmg(`-${dmg}`,pos.x,pos.y,'#ff9955');
  shakeEnemy(idx);
  logMsg(`${ally.name}のこうげき！\n${tgt.name}に${dmg}のダメージ！`,()=>{renderBattle();setTimeout(advanceTurn,350);});
}

// ============================================================
// BATTLE: ENEMY AI
// ============================================================
function enemyAct(ei){
  const enemy=BT.enemies[ei];
  if(!enemy||enemy.hp<=0){advanceTurn();return;}
  if(enemy.status.includes('paralysis')&&Math.random()<0.5){
    logMsg(`${enemy.name}はまひで動けない！`,()=>{renderBattle();setTimeout(advanceTurn,300);});return;
  }
  if(BT.isFB&&enemy.phase===1&&enemy.hp<enemy.maxHp*0.5){
    enemy.phase=2;enemy.atk=Math.round(enemy.atk*1.3);
    logMsg('魔王ゾルダが激怒した！\nパワーアップ！！',()=>doEnemySkill(enemy));
    return;
  }
  doEnemySkill(enemy);
}
function doEnemySkill(enemy){
  const aa=BT.allies.filter(a=>a.hp>0);
  if(!aa.length){advanceTurn();return;}
  const tgt=aa[Math.floor(Math.random()*aa.length)];
  const sk=enemy.skills[Math.floor(Math.random()*enemy.skills.length)];

  if(sk.effect==='dmgAll'){
    const msgs=[`${enemy.name}の${sk.name}！`];
    for(const a of BT.allies){
      if(a.hp<=0)continue;
      const defV=a.isHero?heroDef():a.def;
      let d=sk.power?Math.max(1,sk.power-Math.floor(defV/3)+ri(-5,5)):Math.max(1,enemy.atk-Math.floor(defV/2)+ri(-5,5));
      a.hp=Math.max(0,a.hp-d);
      if(a.isHero)G.hero.hp=a.hp;
      if(sk.status)addStatus(a,sk.status);
      msgs.push(`${a.name}に${d}のダメージ！`);
    }
    sndHit();
    flashPlayer();
    seqLog(msgs,()=>{renderBattle();setTimeout(advanceTurn,350);});
  } else {
    const defV=tgt.isHero?heroDef():tgt.def;
    let dmg;
    if(sk.atkMult)dmg=Math.max(1,Math.round(enemy.atk*sk.atkMult)-Math.floor(defV/3)+ri(-5,5));
    else if(sk.power)dmg=Math.max(1,sk.power-Math.floor(defV/3)+ri(-5,5));
    else dmg=Math.max(1,enemy.atk-Math.floor(defV/2)+ri(-5,5));
    tgt.hp=Math.max(0,tgt.hp-dmg);
    if(tgt.isHero)G.hero.hp=tgt.hp;
    if(sk.status)addStatus(tgt,sk.status);
    sndHit();
    if(tgt.isHero)flashPlayer();
    // Show floating damage on player HUD area
    showFloatDmg(`-${dmg}`,70,130,'#ff4444');
    logMsg(`${enemy.name}の${sk.name}！\n${tgt.name}に${dmg}のダメージ！`,()=>{renderBattle();setTimeout(advanceTurn,350);});
  }
}

function addStatus(unit,st){
  if(!unit.status)unit.status=[];
  if(!unit.status.includes(st))unit.status.push(st);
}

// BATTLE: RESULTS
// ============================================================
function endVictory(){
  battleOver=true;
  let totalExp=0,totalGold=0;
  for(const e of BT.enemies){totalExp+=e.exp||0;totalGold+=e.gold||0;}
  G.gold+=totalGold;
  G.totalBattles=(G.totalBattles||0)+1;
  G.hero.hp=BT.allies[0].hp;
  G.hero.mp=BT.allies[0].mp;
  G.hero.status=[...(BT.allies[0].status||[])];
  G.hero.exp+=totalExp;
  for(let i=0;i<G.party.length;i++){
    if(BT.allies[i+1]){G.party[i].hp=BT.allies[i+1].hp;G.party[i].status=[...(BT.allies[i+1].status||[])];}
  }
  if(BT.isBoss&&!BT.isFB&&BT.area&&BT.area.boss.unlocks>G.unlockedAreas)
    G.unlockedAreas=BT.area.boss.unlocks;

  const lvMsgs=checkLevelUps();
  save();
  sndVictory();

  const msgs=[`てきをたおした！`,`+${totalExp}EXP  +${totalGold}G`,...lvMsgs];
  seqLog(msgs,()=>showVictoryPanel(totalExp,totalGold));
}

function checkLevelUps(){
  const msgs=[];
  while(G.hero.exp>=G.hero.lv*50&&G.hero.lv<20){
    G.hero.exp-=G.hero.lv*50;G.hero.lv++;
    G.hero.maxHp+=20;G.hero.maxMp+=8;G.hero.baseAtk+=4;G.hero.baseDef+=3;G.hero.spd+=2;
    G.hero.hp=Math.min(G.hero.hp+20,G.hero.maxHp);
    G.hero.mp=Math.min(G.hero.mp+8,G.hero.maxMp);
    if(BT.allies&&BT.allies[0]){
      Object.assign(BT.allies[0],{lv:G.hero.lv,maxHp:G.hero.maxHp,maxMp:G.hero.maxMp,
        hp:G.hero.hp,mp:G.hero.mp,atk:heroAtk(),def:heroDef(),spd:G.hero.spd});
    }
    sndLevelUp();
    msgs.push(`★ ${G.hero.name}はLV${G.hero.lv}にあがった！`);
    const ns=HERO_SKILLS.find(s=>s.lv===G.hero.lv);
    if(ns)msgs.push(`「${ns.name}」をおぼえた！`);
  }
  return msgs;
}

function buyItem(id,price){if(G.gold<price)return;G.gold-=price;G.inventory[id]=(G.inventory[id]||0)+1;save();renderShop();}
function buyEquip(id,price){
  if(G.gold<price)return;

  if(eq.type==='weapon')G.hero.weapon=id;else G.hero.armor=id;
  save();renderShop();
}

// Touch fix
(function(){
  let txM=false,txX=0,txY=0;
  document.addEventListener('touchstart',e=>{
    if(e.touches.length>1){txM=true;return;}
    txX=e.touches[0].clientX;txY=e.touches[0].clientY;txM=false;
  },{passive:true});
  document.addEventListener('touchmove',e=>{
    if(txM)return;
    if(e.touches.length>1){txM=true;return;}
    const dx=e.touches[0].clientX-txX,dy=e.touches[0].clientY-txY;
    if(dx*dx+dy*dy>100)txM=true;
  },{passive:true});
  function addDel(container,sel){
    container.addEventListener('touchend',e=>{
      if(txM)return;
      const tgt=e.target.closest(sel);
      if(!tgt||tgt.disabled)return;
      e.preventDefault();
      tgt.click();
    },{passive:false});
  }
  const app=document.getElementById('app');
  const ov=document.getElementById('overlay');
  const ab=document.getElementById('action-bar');
  if(app)addDel(app,'.btn,.village-card,.area-card,.jrpg-cmd-btn,.jrpg-subitem,.jrpg-back-btn');
  if(ov)addDel(ov,'.btn');
  if(ab)addDel(ab,'.btn');
})();

    window.visualViewport.addEventListener('resize',upd);
    upd();
  }
})();
</script>

<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>2048パズル</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
body {
  background:
    radial-gradient(ellipse at 25% 20%, rgba(80,30,180,0.5) 0%, transparent 50%),
    radial-gradient(ellipse at 75% 80%, rgba(20,60,180,0.4) 0%, transparent 50%),
    radial-gradient(ellipse at 50% 50%, #120830 0%, #050210 100%);
  display: flex; justify-content: center; align-items: flex-start;
  min-height: 100vh; padding: 16px 8px 80px;
  font-family: Arial, sans-serif; overflow-x: hidden;
}
#stars { position: fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:0; }
.window {
  position: relative; z-index: 1;
  background: linear-gradient(160deg, #1e1248 0%, #0d0830 100%);
  border: 2px solid #7060ff; border-radius: 16px;
  box-shadow: 0 0 30px rgba(112,90,255,0.55), 0 0 80px rgba(112,90,255,0.2), 0 24px 64px rgba(0,0,0,0.85);
  max-width: 460px; width: 100%; overflow: hidden;
}
.titlebar {
  background: linear-gradient(90deg, #a06008 0%, #f5c842 28%, #ffe870 50%, #f5c842 72%, #a06008 100%);
  color: #3a1a00; font-size: 14px; font-weight: 900; padding: 7px 14px;
  text-align: center; letter-spacing: 2px; text-shadow: 0 1px 0 rgba(255,255,200,0.8);
  border-bottom: 2px solid #804000;
  display: flex; justify-content: space-between; align-items: center;
}
.action-bar {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 600;
  display: flex; gap: 6px; padding: 8px 12px 10px;
  background: linear-gradient(0deg, #060412 0%, rgba(10,6,28,0.97) 100%);
  border-top: 1px solid #4030a0;
  box-shadow: 0 -4px 20px rgba(0,0,0,0.85), 0 -1px 0 rgba(112,90,255,0.3);
  flex-wrap: wrap; justify-content: center;
  backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
}
.act-btn {
  padding: 5px 14px; font-size: 11px; border-radius: 14px;
  background: linear-gradient(160deg, #3a2080 0%, #22105a 100%);
  color: #b898ff; border: 1px solid #5a3aaa;
  box-shadow: 0 2px 8px rgba(0,0,0,0.5);
  cursor: pointer; font-weight: bold; transition: all 0.15s; touch-action: manipulation;
}
.act-btn:active { transform: scale(0.93); }
.modal-overlay {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,0.78); z-index: 10000;
  justify-content: center; align-items: center; padding: 16px;
}
.modal-overlay.visible { display: flex; }
.modal-box {
  background: linear-gradient(160deg, #1e1248 0%, #0d0830 100%);
  border: 2px solid #7060ff; border-radius: 16px;
  box-shadow: 0 0 40px rgba(112,90,255,0.6), 0 24px 64px rgba(0,0,0,0.9);
  max-width: 360px; width: 100%; max-height: 88vh; overflow-y: auto;
}
.modal-title {
  background: linear-gradient(90deg, #a06008 0%, #f5c842 28%, #ffe870 50%, #f5c842 72%, #a06008 100%);
  color: #3a1a00; font-size: 14px; font-weight: 900; padding: 8px 14px;
  text-align: center; letter-spacing: 2px; border-radius: 14px 14px 0 0;
  display: flex; justify-content: space-between; align-items: center;
}
.modal-close { background: none; border: none; font-size: 18px; cursor: pointer; color: #3a1a00; }
.modal-body { padding: 14px; color: #c0b0e8; font-size: 13px; line-height: 1.6; }
.led {
  background: linear-gradient(160deg, #080518 0%, #040210 100%);
  color: #ff44aa; font-family: 'Courier New', monospace;
  font-size: 22px; font-weight: bold; padding: 3px 10px;
  min-width: 64px; text-align: right; border-radius: 6px; border: 1px solid #4020a0;
  text-shadow: 0 0 10px #ff44aa, 0 0 20px #ff2288;
  box-shadow: inset 0 2px 4px rgba(0,0,0,0.8), 0 0 10px rgba(255,68,170,0.3);
  display: inline-block;
}
.led-label { font-size: 9px; color: #6050a0; display: block; text-align: center; margin-top: 2px; }
.status-panel {
  background: linear-gradient(160deg, #100a30 0%, #08051a 100%);
  border: 1px solid #4030a0; border-radius: 10px;
  padding: 6px 12px; margin: 8px;
  display: flex; justify-content: space-around; align-items: center;
  box-shadow: inset 0 2px 8px rgba(0,0,0,0.6);
}
.led-group { display: flex; flex-direction: column; align-items: center; gap: 2px; }
.content { padding: 8px; }
#confetti { position: fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:9999; display:none; }

/* 2048 grid */
.grid-wrapper { position: relative; }
.grid-container {
  background: #04020e; border-radius: 8px; padding: 6px; gap: 6px;
  display: grid; grid-template-columns: repeat(4, 1fr);
  touch-action: none;
}
.tile {
  aspect-ratio: 1;
  display: flex; align-items: center; justify-content: center;
  border-radius: 6px; font-weight: 900;
  font-size: clamp(18px, 6vw, 32px);
  background: #0a0620; color: #2a1850;
}
.tile.t2    { background: #2a1870; color: #c0a8ff; }
.tile.t4    { background: #3a2880; color: #d0b8ff; }
.tile.t8    { background: #4a2890; color: #60b8ff; text-shadow: 0 0 8px #60b8ff; }
.tile.t16   { background: #5a30a0; color: #60ff90; text-shadow: 0 0 8px #60ff90; }
.tile.t32   { background: #6a30b0; color: #ff6060; text-shadow: 0 0 8px #ff6060; }
.tile.t64   { background: #7a30c0; color: #c060ff; text-shadow: 0 0 8px #c060ff; }
.tile.t128  { background: #8040d0; color: #ffa040; text-shadow: 0 0 10px #ffa040; font-size: clamp(14px,4.5vw,24px); }
.tile.t256  { background: #9040e0; color: #40ffee; text-shadow: 0 0 10px #40ffee; font-size: clamp(14px,4.5vw,24px); }
.tile.t512  { background: #a050f0; color: #ffee40; text-shadow: 0 0 12px #ffee40; font-size: clamp(13px,4vw,22px); }
.tile.t1024 { background: #b060ff; color: #ff44aa; text-shadow: 0 0 14px #ff44aa; font-size: clamp(11px,3.5vw,18px); }
.tile.t2048 { background: radial-gradient(circle, #ffe060, #c88010); color: #3a1a00; box-shadow: 0 0 20px #f5c842; font-size: clamp(11px,3.5vw,18px); }
.tile.thi   { background: radial-gradient(circle, #ff4060, #880020); color: #fff; box-shadow: 0 0 20px #ff4060; font-size: clamp(10px,3vw,16px); }
@keyframes pop { 0%{transform:scale(0.2);opacity:0} 60%{transform:scale(1.15)} 100%{transform:scale(1);opacity:1} }
@keyframes merge-anim { 0%{transform:scale(1)} 30%{transform:scale(1.22)} 70%{transform:scale(0.94)} 100%{transform:scale(1)} }
.tile.pop { animation: pop 0.18s cubic-bezier(.17,.67,.47,1.3); }
.tile.merged { animation: merge-anim 0.22s ease-out; }

/* Overlays */
.overlay {
  display: none; position: absolute; inset: 0;
  background: rgba(4,2,14,0.9); border-radius: 8px; z-index: 100;
  justify-content: center; align-items: center; flex-direction: column; gap: 14px;
}
.overlay.visible { display: flex; }
.overlay h2 { font-size: clamp(22px,6vw,32px); font-weight: 900; text-align: center; }
.overlay p  { color: #c0b0e8; font-size: 13px; text-align: center; padding: 0 20px; }
.overlay .btn-row { display: flex; gap: 10px; }
.o-btn {
  padding: 9px 22px; font-size: 14px; border-radius: 20px;
  background: linear-gradient(160deg, #6040c0 0%, #3a1880 100%);
  color: #e0d0ff; border: 1px solid #8060e0; cursor: pointer; font-weight: bold;
}
.o-btn2 {
  padding: 9px 18px; font-size: 13px; border-radius: 20px;
  background: linear-gradient(160deg, #3a2080 0%, #22105a 100%);
  color: #b898ff; border: 1px solid #5a3aaa; cursor: pointer; font-weight: bold;
}
.hs-table{width:100%;}
.hs-row{display:flex;justify-content:space-between;align-items:center;padding:5px 10px;background:rgba(80,60,180,0.1);border:1px solid rgba(80,60,180,0.2);border-radius:8px;margin:3px 0;}
.hs-period{color:#a090d0;font-size:12px;font-weight:bold;min-width:50px;}
.hs-record{color:#60ff90;font-weight:900;text-shadow:0 0 6px #60ff90;}
.hs-val{color:#4038a0;}
.hs-date{color:#7060a0;font-size:9px;margin-left:4px;}

<script>
function getDateKey(){return new Date().toISOString().slice(0,10);}
function getWeekKey(){const d=new Date(),day=d.getDay()||7,mon=new Date(d);mon.setDate(d.getDate()-day+1);return mon.toISOString().slice(0,10);}
function getMonthKey(){return new Date().toISOString().slice(0,7);}
function fmtDate(s){const p=s.slice(5).split('-');return`${parseInt(p[0])}/${parseInt(p[1])}`;}
function saveHiRec(key,val){
  const today=getDateKey(),wk=getWeekKey(),mo=getMonthKey();
  let d=JSON.parse(localStorage.getItem(key+'_rec')||'{}');
  if(!d.all||val>d.all.v)d.all={v:val,date:today};
  if(!d.today||d.today.date!==today||val>d.today.v)d.today={v:val,date:today};
  if(!d.week||d.week.key!==wk||val>d.week.v)d.week={v:val,key:wk,date:today};
  if(!d.month||d.month.key!==mo||val>d.month.v)d.month={v:val,key:mo,date:today};
  localStorage.setItem(key+'_rec',JSON.stringify(d));
}
function renderHiRec(key,unit){
  const today=getDateKey(),wk=getWeekKey(),mo=getMonthKey();
  const d=JSON.parse(localStorage.getItem(key+'_rec')||'{}');
  const fmt=e=>e?`<span class="hs-record">${e.v}${unit}</span><span class="hs-date">(${fmtDate(e.date)})</span>`:'<span class="hs-val">--</span>';
  const tV=d.today?.date===today?fmt(d.today):'<span class="hs-val">--</span>';
  const wV=d.week?.key===wk?fmt(d.week):'<span class="hs-val">--</span>';
  const mV=d.month?.key===mo?fmt(d.month):'<span class="hs-val">--</span>';
  return`<div class="hs-table"><div class="hs-row"><span class="hs-period">本日</span>${tV}</div><div class="hs-row"><span class="hs-period">今週</span>${wV}</div><div class="hs-row"><span class="hs-period">今月</span>${mV}</div><div class="hs-row"><span class="hs-period">全期間</span>${fmt(d.all)}</div></div>`;
}

// ── Stars ─────────────────────────────────────────────────────────────────────
(function(){
  const c=document.getElementById('stars'),ctx=c.getContext('2d');let stars=[];
  function resize(){c.width=window.innerWidth;c.height=window.innerHeight;stars=[];for(let i=0;i<120;i++)stars.push({x:Math.random()*c.width,y:Math.random()*c.height,r:Math.random()*1.5+0.3,a:Math.random(),da:(Math.random()-0.5)*0.008});}
  function draw(){ctx.clearRect(0,0,c.width,c.height);stars.forEach(s=>{s.a=Math.max(0.1,Math.min(1,s.a+s.da));if(s.a<=0.1||s.a>=1)s.da*=-1;ctx.globalAlpha=s.a;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,6.28);ctx.fill();});ctx.globalAlpha=1;requestAnimationFrame(draw);}
  window.addEventListener('resize',resize);resize();draw();
})();

// ── Confetti ──────────────────────────────────────────────────────────────────
function startConfetti(){
  const cv=document.getElementById('confetti');cv.style.display='block';
  const ctx=cv.getContext('2d');cv.width=window.innerWidth;cv.height=window.innerHeight;
  const parts=Array.from({length:80},()=>({x:Math.random()*cv.width,y:-10,r:Math.random()*6+3,c:`hsl(${Math.random()*360},90%,60%)`,vx:(Math.random()-0.5)*4,vy:Math.random()*4+2,rot:Math.random()*360,drot:(Math.random()-0.5)*10}));
  let frame=0;
  function anim(){if(frame++>180){cv.style.display='none';return;}ctx.clearRect(0,0,cv.width,cv.height);parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.rot+=p.drot;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot*Math.PI/180);ctx.fillStyle=p.c;ctx.fillRect(-p.r,-p.r/2,p.r*2,p.r);ctx.restore();});requestAnimationFrame(anim);}
  anim();
}

// ── Game State ────────────────────────────────────────────────────────────────
let board, score, bestScore, wonShown, isGameOver, newTilePos, mergedSet;

const TILE_CLASSES = {
  2:'t2', 4:'t4', 8:'t8', 16:'t16', 32:'t32', 64:'t64',
  128:'t128', 256:'t256', 512:'t512', 1024:'t1024', 2048:'t2048'
};
function getTileClass(v) {
  if (!v) return '';
  return TILE_CLASSES[v] || 'thi';
}

function loadBest() {
  bestScore = parseInt(localStorage.getItem('2048_best') || '0');
}
function saveBest() {
  if (score > bestScore) {
    bestScore = score;
    localStorage.setItem('2048_best', String(bestScore));
    saveHiRec('g2048', bestScore);
  }
}

function saveGame() {
  if (isGameOver) { localStorage.removeItem('2048_save'); return; }
  localStorage.setItem('2048_save', JSON.stringify({
    board: board, score: score, bestScore: bestScore, wonShown: wonShown, savedAt: Date.now()
  }));
}

function tryLoadSave() {
  const raw = localStorage.getItem('2048_save');
  if (!raw) return false;
  try {
    const s = JSON.parse(raw);
    if (!s.savedAt || Date.now() - s.savedAt > 7*24*60*60*1000) { localStorage.removeItem('2048_save'); return false; }
    window._pendingSave2048 = s;
    document.getElementById('over-resume').classList.add('visible');
    return true;
  } catch(e) { localStorage.removeItem('2048_save'); return false; }
}

function resumeGame() {
  const s = window._pendingSave2048;
  if (!s) { declineResume(); return; }
  board = s.board; score = s.score; bestScore = s.bestScore || bestScore;
  wonShown = s.wonShown || false; isGameOver = false;
  newTilePos = null; mergedSet = new Set();
  document.getElementById('over-resume').classList.remove('visible');
  render();
}

function declineResume() {
  localStorage.removeItem('2048_save');
  document.getElementById('over-resume').classList.remove('visible');
  newGame();
}

function newGame() {
  localStorage.removeItem('2048_save');
  board = Array.from({length:4}, () => Array(4).fill(0));
  score = 0;
  wonShown = false; isGameOver = false;
  newTilePos = null; mergedSet = new Set();
  loadBest();
  document.getElementById('over-gameover').classList.remove('visible');
  document.getElementById('over-win').classList.remove('visible');
  closeAllModals();
  spawnTile();
  spawnTile();
  render();
}

function spawnTile() {
  const empty = [];
  for (let r = 0; r < 4; r++) for (let c = 0; c < 4; c++) if (!board[r][c]) empty.push([r, c]);
  if (!empty.length) return;
  const [r, c] = empty[Math.floor(Math.random() * empty.length)];
  board[r][c] = Math.random() < 0.9 ? 2 : 4;
  newTilePos = r * 4 + c;
}

function slide(row) {
  let vals = row.filter(v => v);
  let sc = 0;
  let result = [];
  let mergedAt = new Set();
  let i = 0;
  while (i < vals.length) {
    if (i + 1 < vals.length && vals[i] === vals[i + 1]) {
      const v = vals[i] * 2;
      result.push(v);
      sc += v;
      mergedAt.add(result.length - 1);
      i += 2;
    } else {
      result.push(vals[i]);
      i++;
    }
  }
  while (result.length < 4) result.push(0);
  return { row: result, score: sc, mergedAt };
}

function move(dir) {
  if (isGameOver) return;
  const old = board.map(r => r.slice());
  let totalScore = 0;
  mergedSet = new Set();

  if (dir === 'left') {
    for (let r = 0; r < 4; r++) {
      const { row, score: s, mergedAt } = slide(board[r]);
      board[r] = row; totalScore += s;
      mergedAt.forEach(c => mergedSet.add(r * 4 + c));
    }
  } else if (dir === 'right') {
    for (let r = 0; r < 4; r++) {
      const { row, score: s, mergedAt } = slide([...board[r]].reverse());
      board[r] = row.reverse(); totalScore += s;
      mergedAt.forEach(mc => mergedSet.add(r * 4 + (3 - mc)));
    }
  } else if (dir === 'up') {
    for (let c = 0; c < 4; c++) {
      const col = [0,1,2,3].map(r => board[r][c]);
      const { row, score: s, mergedAt } = slide(col);
      for (let r = 0; r < 4; r++) board[r][c] = row[r];
      totalScore += s;
      mergedAt.forEach(mr => mergedSet.add(mr * 4 + c));
    }
  } else if (dir === 'down') {
    for (let c = 0; c < 4; c++) {
      const col = [3,2,1,0].map(r => board[r][c]);
      const { row, score: s, mergedAt } = slide(col);
      for (let r = 0; r < 4; r++) board[3 - r][c] = row[r];
      totalScore += s;
      mergedAt.forEach(mr => mergedSet.add((3 - mr) * 4 + c));
    }
  }

  const changed = board.some((row, r) => row.some((v, c) => v !== old[r][c]));
  if (!changed) return;

  score += totalScore;
  saveBest();
  newTilePos = null;
  spawnTile();
  render();
  checkWin();
  checkGameOver();
  saveGame();
}

function checkWin() {
  if (wonShown) return;
  for (let r = 0; r < 4; r++) for (let c = 0; c < 4; c++) {
    if (board[r][c] === 2048) {
      wonShown = true;
      document.getElementById('over-win').classList.add('visible');
      startConfetti();
      return;
    }
  }
}

function continueGame() {
  document.getElementById('over-win').classList.remove('visible');
}

function checkGameOver() {
  for (let r = 0; r < 4; r++) for (let c = 0; c < 4; c++) {
    if (!board[r][c]) return;
    if (c < 3 && board[r][c] === board[r][c+1]) return;
    if (r < 3 && board[r][c] === board[r+1][c]) return;
  }
  isGameOver = true;
  document.getElementById('go-score').textContent = score.toLocaleString();
  document.getElementById('over-gameover').classList.add('visible');
}

function render() {
  const grid = document.getElementById('grid');
  document.getElementById('score-led').textContent = score.toLocaleString();
  document.getElementById('best-led').textContent = bestScore.toLocaleString();

  grid.innerHTML = '';
  for (let r = 0; r < 4; r++) {
    for (let c = 0; c < 4; c++) {
      const v = board[r][c];
      const idx = r * 4 + c;
      const div = document.createElement('div');
      div.className = 'tile' + (v ? ' ' + getTileClass(v) : '');
      if (v) {
        div.textContent = v.toLocaleString();
        if (idx === newTilePos) {
          div.classList.add('pop');
        } else if (mergedSet.has(idx)) {
          div.classList.add('merged');
        }
      }
      grid.appendChild(div);
    }
  }
}

// ── Input ─────────────────────────────────────────────────────────────────────
document.addEventListener('keydown', e => {
  const map = { ArrowLeft:'left', ArrowRight:'right', ArrowUp:'up', ArrowDown:'down' };
  if (map[e.key]) { e.preventDefault(); move(map[e.key]); }
});

let tx = 0, ty = 0, touchMoved = false;
const gridEl = document.getElementById('grid');
gridEl.addEventListener('touchstart', e => {
  if (e.touches.length > 1) { touchMoved = true; return; }
  tx = e.touches[0].clientX; ty = e.touches[0].clientY; touchMoved = false;
}, { passive: true });
gridEl.addEventListener('touchmove', e => {
  if (e.touches.length > 1) touchMoved = true;
}, { passive: true });
gridEl.addEventListener('touchend', e => {
  e.preventDefault();
  if (touchMoved) return;
  const dx = e.changedTouches[0].clientX - tx;
  const dy = e.changedTouches[0].clientY - ty;
  if (Math.max(Math.abs(dx), Math.abs(dy)) < 30) return;
  move(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up'));
}, { passive: false });

// ── Visual Viewport fix ───────────────────────────────────────────────────────
const actionBar = document.querySelector('.action-bar');
function fixActionBar() {
  const vv = window.visualViewport;
  if (!vv) return;
  const layoutWidth = document.documentElement.clientWidth || window.innerWidth;
  const scaleRatio = layoutWidth / vv.width;
  const isZoomed = vv.scale > 1.05 || scaleRatio > 1.05;
  if (!isZoomed) {
    actionBar.style.top = actionBar.style.bottom = '';
    actionBar.style.left = actionBar.style.right = '';
    actionBar.style.width = actionBar.style.transform = '';
    actionBar.style.transformOrigin = '';
    return;
  }
  const scale = Math.max(vv.scale, scaleRatio);
  const inv = 1 / scale;
  const barH = actionBar.offsetHeight || 52;
  const layoutW = document.documentElement.clientWidth || Math.round(vv.width * scale);
  actionBar.style.top = Math.round(vv.offsetTop + vv.height - barH) + 'px';
  actionBar.style.bottom = 'auto';
  actionBar.style.left = Math.round(vv.offsetLeft) + 'px';
  actionBar.style.width = layoutW + 'px';
  actionBar.style.right = 'auto';
  actionBar.style.transform = `scale(${inv})`;
  actionBar.style.transformOrigin = 'bottom left';
}
if (window.visualViewport) {
  window.visualViewport.addEventListener('resize', fixActionBar);
  window.visualViewport.addEventListener('scroll', fixActionBar);
  fixActionBar();
}

function showSaveToast(){

}

<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>ファイブボンバー</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background: linear-gradient(180deg, #0a0520 0%, #1a0a3a 40%, #2a1050 100%);
  min-height:100vh; font-family:'Hiragino Sans','Yu Gothic',sans-serif;
  overflow:hidden; color:#fff; touch-action:manipulation;
  display:flex; flex-direction:column; align-items:center;
}

/* Stage background */
#stage-bg {
  position:fixed; inset:0; z-index:0;
  background: radial-gradient(ellipse at 50% 110%, rgba(80,40,160,0.8) 0%, transparent 60%),
              linear-gradient(180deg, #050215 0%, #0d0530 50%, #1a0845 100%);
}

/* Audience silhouette */
#audience {
  position:fixed; bottom:0; left:0; right:0; height:80px; z-index:1;
  background: linear-gradient(180deg, transparent 0%, rgba(0,0,20,0.9) 100%);
}

/* Title */
#game-title {
  position:relative; z-index:10;
  font-size:clamp(20px,6vw,36px); font-weight:900;
  color:#ffcc00; text-shadow:0 0 20px #ff8800, 3px 3px 0 #cc6600, -1px -1px 0 #cc6600;
  padding:10px 0 4px;
  letter-spacing:2px;
}

/* Screens */
.screen { position:fixed; inset:0; z-index:20; display:none; flex-direction:column; align-items:center; }
.screen.active { display:flex; }

/* ===== TITLE SCREEN ===== */
#title-screen {
  justify-content:center; gap:20px;
  background:linear-gradient(160deg,#0a0520,#1a0a3a);
}
.title-bomb { font-size:clamp(80px,20vw,140px); animation:bombSway 2s ease-in-out infinite; }
@keyframes bombSway { 0%,100%{transform:rotate(-5deg)} 50%{transform:rotate(5deg)} }
.game-name { font-size:clamp(28px,8vw,52px); font-weight:900; color:#ffcc00;
  text-shadow:0 0 30px #ff8800, 4px 4px 0 #994400, -2px -2px 0 #994400; letter-spacing:3px; }
.tagline { font-size:14px; color:rgba(255,255,255,0.6); }
.start-btn { background:linear-gradient(135deg,#ff4400,#ffcc00); color:#fff;
  border:none; padding:16px 48px; font-size:20px; font-weight:900;
  border-radius:50px; cursor:pointer; box-shadow:0 6px 30px rgba(255,100,0,0.5);
  transition:transform 0.15s cubic-bezier(0.34,1.56,0.64,1); letter-spacing:2px; margin-top:8px; }
.start-btn:active { transform:scale(0.93); }

/* ===== GAME SCREEN ===== */
#game-screen { justify-content:flex-start; padding:0; }

/* Category header */
#cat-header {
  width:100%; padding:8px 16px;
  background:linear-gradient(135deg,#2244aa,#4466cc);
  display:flex; justify-content:space-between; align-items:center;
  position:relative; z-index:30;
}
#cat-name { font-size:16px; font-weight:bold; }
#round-info { font-size:12px; opacity:0.8; }

/* Bomb area */
#bomb-area {
  width:100%; flex:0 0 auto;
  display:flex; flex-direction:column; align-items:center;
  padding:10px 0 6px;
  position:relative; z-index:30;
}
/* Chain */
#chain-container { position:relative; height:60px; display:flex; flex-direction:column; align-items:center; }
.chain-link { width:8px; height:12px; border:3px solid #888; border-radius:3px; background:#aaa; margin:-1px 0; }
/* Bomb */
#bomb {
  font-size:clamp(70px,18vw,110px);
  transition:transform 0.3s ease, filter 0.3s;
  filter:drop-shadow(0 0 20px rgba(255,100,0,0.6));
  cursor:default; user-select:none;
  transform-origin:center top;
}
#bomb.correct-jump { animation:bombJump 0.5s ease; }
#bomb.wrong-drop { animation:bombShake 0.4s ease; }
#bomb.explode { animation:bombExplode 0.8s ease forwards; }
@keyframes bombJump { 0%{transform:translateY(0)} 30%{transform:translateY(-20px) scale(1.05)} 100%{transform:translateY(0)} }
@keyframes bombShake { 0%,100%{transform:translateX(0) rotate(0)} 25%{transform:translateX(-12px) rotate(-8deg)} 75%{transform:translateX(12px) rotate(8deg)} }
@keyframes bombExplode { 0%{transform:scale(1);filter:drop-shadow(0 0 30px red)} 50%{transform:scale(2.5);opacity:1;filter:drop-shadow(0 0 60px #ff4400)} 100%{transform:scale(4);opacity:0} }
@keyframes bombExplode2 { 0%{transform:scale(1)} 50%{transform:scale(2.5);filter:brightness(3)} 100%{transform:scale(1);opacity:0.5} }

/* Danger level bars */
#danger-bars {
  display:flex; gap:4px; margin-top:6px;
}
.dbar {
  width:32px; height:10px; border-radius:3px; border:1px solid rgba(255,255,255,0.3);
  background:rgba(255,255,255,0.1); transition:all 0.3s;
}
.dbar.active { background:#ff4400; box-shadow:0 0 8px #ff4400; }

/* Bomb level label */
#bomb-level-label { font-size:11px; opacity:0.6; margin-top:2px; }

/* Question area */
#q-area {
  flex:1; width:100%; max-width:500px;
  display:flex; flex-direction:column; align-items:center;
  padding:10px 16px; gap:10px;
  position:relative; z-index:30; overflow-y:auto;
}
/* Timer */
#timer-bar-wrap { width:100%; }
#timer-bar { height:6px; border-radius:3px; background:rgba(255,255,255,0.15); overflow:hidden; }
#timer-fill { height:100%; background:linear-gradient(90deg,#44cc44,#ffcc00); border-radius:3px; transition:width 0.2s linear; }
#timer-num { text-align:right; font-size:11px; opacity:0.7; margin-top:2px; }
/* Consecutive counter */
#consecutive {
  font-size:13px; font-weight:bold; color:#ffcc00;
  text-shadow:0 0 10px #ffcc00;
}
/* Question */
#question-box {
  background:rgba(255,255,255,0.08);
  border:2px solid rgba(255,255,255,0.15);
  border-radius:14px; padding:16px; width:100%;
  font-size:clamp(14px,4vw,18px); line-height:1.5;
  text-align:center; font-weight:bold;
}
#question-num { font-size:11px; opacity:0.5; margin-bottom:4px; }
/* Options */
#options { display:grid; grid-template-columns:1fr 1fr; gap:8px; width:100%; }
.opt-btn {
  background:rgba(255,255,255,0.08); border:2px solid rgba(255,255,255,0.2);
  color:#fff; border-radius:12px; padding:12px 8px;
  font-size:clamp(13px,3.5vw,16px); font-weight:bold; cursor:pointer;
  transition:all 0.15s cubic-bezier(0.34,1.56,0.64,1);
  text-align:center; line-height:1.3;
}
.opt-btn:active { transform:scale(0.95); }
.opt-btn.correct { background:linear-gradient(135deg,#22aa44,#44ee66); border-color:#44ee66; box-shadow:0 0 20px rgba(68,238,100,0.5); }
.opt-btn.wrong { background:linear-gradient(135deg,#aa2222,#ee4444); border-color:#ee4444; box-shadow:0 0 20px rgba(238,68,68,0.5); }
/* Free input */
#input-wrap { width:100%; display:flex; gap:8px; }
#answer-input {
  flex:1; background:rgba(255,255,255,0.1); border:2px solid rgba(255,255,255,0.3);
  color:#fff; font-size:18px; text-align:center; padding:12px;
  border-radius:12px; outline:none; font-family:inherit;
}
#answer-input:focus { border-color:#ffcc00; }
#ans-btn { background:linear-gradient(135deg,#ff6600,#ffcc00); border:none; color:#fff; padding:12px 20px; border-radius:12px; font-size:16px; font-weight:bold; cursor:pointer; }

/* Flash overlay */
#flash { position:fixed; inset:0; z-index:100; pointer-events:none; opacity:0; transition:opacity 0.1s; }
#flash.correct-flash { background:rgba(0,255,100,0.25); opacity:1; }
#flash.wrong-flash { background:rgba(255,0,0,0.35); opacity:1; }

/* Big feedback */
#big-feedback {
  position:fixed; top:30%; left:50%; transform:translateX(-50%);
  font-size:clamp(40px,12vw,80px); font-weight:900;
  pointer-events:none; z-index:200; opacity:0;
  text-shadow:4px 4px 0 rgba(0,0,0,0.5);
  white-space:nowrap;
}
#big-feedback.show { animation:bigFeedPop 0.8s ease forwards; }
@keyframes bigFeedPop {
  0%{opacity:0;transform:translateX(-50%) scale(0.4)}
  40%{opacity:1;transform:translateX(-50%) scale(1.1)}
  70%{opacity:1;transform:translateX(-50%) scale(0.95)}
  100%{opacity:0;transform:translateX(-50%) scale(1)}
}

/* Explosion screen */
#explode-screen {
  background:radial-gradient(circle,#ff8800 0%,#ff2200 30%,#220000 80%);
  justify-content:center; gap:20px;
}
#explode-text { font-size:clamp(36px,10vw,64px); font-weight:900; text-shadow:4px 4px 0 rgba(0,0,0,0.5); }

/* Clear screen */
#clear-screen {
  background:radial-gradient(circle,#004488 0%,#0a0520 70%);
  justify-content:center; gap:16px;
}
.firework { font-size:clamp(32px,9vw,52px); animation:fw 1.5s ease-in-out infinite; }
@keyframes fw { 0%,100%{transform:scale(1);opacity:1} 50%{transform:scale(1.2);opacity:0.7} }
.firework:nth-child(2){animation-delay:0.3s} .firework:nth-child(3){animation-delay:0.6s}
.clear-title { font-size:clamp(28px,8vw,48px); font-weight:900; color:#ffcc00; text-shadow:0 0 30px #ff8800; }
.clear-score { background:rgba(255,255,255,0.1); border-radius:16px; padding:16px 32px; text-align:center; }

/* Result screen */
#result-screen { justify-content:center; gap:16px; background:linear-gradient(160deg,#050215,#0d0530); }
.result-title { font-size:28px; font-weight:900; }
.result-card { background:rgba(255,255,255,0.07); border-radius:16px; padding:20px 28px; width:90%; max-width:340px; }
.result-row { display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px solid rgba(255,255,255,0.1); font-size:15px; }
.result-row:last-child { border-bottom:none; }
.result-val { font-weight:bold; color:#ffcc00; }
.result-btns { display:flex; gap:12px; margin-top:8px; }
.rbtn { padding:14px 28px; border-radius:30px; font-size:16px; font-weight:bold; cursor:pointer; border:none; }
.rbtn-retry { background:linear-gradient(135deg,#ff4400,#ffcc00); color:#fff; }
.rbtn-menu { background:rgba(255,255,255,0.12); color:#fff; border:1px solid rgba(255,255,255,0.2); }
</style>
</head>
<body>
<div id="stage-bg"></div>
<div id="audience"></div>
<div id="flash"></div>
<div id="big-feedback"></div>

<!-- TITLE -->
<div id="title-screen" class="screen active">
  <div class="title-bomb">💣</div>
  <div class="game-name">ファイブボンバー</div>
  <div class="tagline">5問連続正解で爆弾を止めろ！</div>
  <button class="start-btn" onclick="showScreen('mode-screen')">スタート！</button>
  <div style="margin-top:12px;font-size:12px;opacity:0.4">5ミスで爆発　カテゴリ制クイズゲーム</div>
</div>

<!-- MODE SELECT -->
<div id="mode-screen" class="screen">
  <div style="font-size:24px;font-weight:bold;margin-bottom:8px">モードを選んでね</div>
  <div style="font-size:13px;opacity:0.6;margin-bottom:24px">回答方式を選択してください</div>
  <div style="display:flex;flex-direction:column;gap:16px;width:90%;max-width:360px">
    <div onclick="selectMode('choice')" style="background:linear-gradient(135deg,#2244cc,#4466ff);border-radius:16px;padding:20px;cursor:pointer;transition:transform 0.15s cubic-bezier(0.34,1.56,0.64,1);border:2px solid rgba(255,255,255,0.2)" onmousedown="this.style.transform='scale(0.95)'" onmouseup="this.style.transform=''" ontouchstart="this.style.transform='scale(0.95)'" ontouchend="this.style.transform=''">
      <div style="font-size:20px;font-weight:900;margin-bottom:4px">📋 選択式</div>
      <div style="font-size:13px;opacity:0.8">4つの選択肢から選ぶ</div>
      <div style="font-size:11px;opacity:0.5;margin-top:4px">初めての方におすすめ</div>
    </div>
    <div onclick="selectMode('input')" style="background:linear-gradient(135deg,#cc4400,#ff8800);border-radius:16px;padding:20px;cursor:pointer;transition:transform 0.15s cubic-bezier(0.34,1.56,0.64,1);border:2px solid rgba(255,255,255,0.2)" onmousedown="this.style.transform='scale(0.95)'" onmouseup="this.style.transform=''" ontouchstart="this.style.transform='scale(0.95)'" ontouchend="this.style.transform=''">
      <div style="font-size:20px;font-weight:900;margin-bottom:4px">⌨️ 入力式</div>
      <div style="font-size:13px;opacity:0.8">答えを自分で入力する</div>
      <div style="font-size:11px;opacity:0.5;margin-top:4px">上級者・本格派向け</div>
    </div>
  </div>
  <button onclick="showScreen('title-screen')" style="margin-top:20px;background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.2);color:#fff;padding:10px 24px;border-radius:20px;font-size:14px;cursor:pointer;">← 戻る</button>
</div>

<!-- GAME -->
<div id="game-screen" class="screen">
  <div id="cat-header">
    <div id="cat-name">カテゴリ</div>
    <div id="round-info">ラウンド 1/5</div>
  </div>
  <div id="bomb-area">
    <div id="chain-container">
      <div class="chain-link"></div><div class="chain-link"></div>
      <div class="chain-link"></div><div class="chain-link"></div>
    </div>
    <div id="bomb">💣</div>
    <div id="danger-bars">
      <div class="dbar" id="db0"></div><div class="dbar" id="db1"></div>
      <div class="dbar" id="db2"></div><div class="dbar" id="db3"></div>
      <div class="dbar" id="db4"></div>
    </div>
    <div id="bomb-level-label">危険度: 0/5</div>
  </div>
  <div id="q-area">
    <div id="timer-bar-wrap">
      <div id="timer-bar"><div id="timer-fill" style="width:100%"></div></div>
      <div id="timer-num">30秒</div>
    </div>
    <div id="consecutive">連続正解: 0</div>
    <div id="question-box">
      <div id="question-num">Q1</div>
      <div id="question-text">問題文</div>
    </div>
    <div id="char-hint" style="display:none;text-align:center;letter-spacing:8px;font-size:20px;color:rgba(255,255,255,0.5);margin:4px 0"></div>
    <div id="options"></div>
    <div id="input-wrap" style="display:none">
      <input id="answer-input" type="text" inputmode="text" autocomplete="off" spellcheck="false" placeholder="答えを入力...">
      <button id="ans-btn" onclick="submitFree()">→</button>
    </div>
  </div>
</div>

<!-- EXPLOSION -->
<div id="explode-screen" class="screen">
  <div style="font-size:80px;animation:bombExplode2 1s ease forwards">💥</div>
  <div id="explode-text">💣 爆発！！</div>
  <div style="font-size:16px;opacity:0.8">残念！次回頑張ろう！</div>
  <div style="display:flex;gap:12px;margin-top:16px">
    <button class="rbtn rbtn-retry" onclick="showScreen('mode-screen')">もう一度</button>
    <button class="rbtn rbtn-menu" onclick="showScreen('title-screen')">タイトル</button>
  </div>
</div>

<!-- CLEAR (per round) -->
<div id="clear-screen" class="screen">
  <div style="display:flex;gap:16px">
    <div class="firework">🎆</div><div class="firework">🎇</div><div class="firework">✨</div>
  </div>
  <div class="clear-title">クリア！！</div>
  <div class="clear-score">
    <div id="clear-cat" style="font-size:14px;opacity:0.7;margin-bottom:4px"></div>
    <div id="clear-correct" style="font-size:22px;font-weight:bold;color:#ffcc00"></div>
  </div>
  <button class="rbtn rbtn-retry" style="margin-top:8px" onclick="nextRound()">次のカテゴリへ →</button>
</div>

<!-- RESULT -->
<div id="result-screen" class="screen">
  <div class="result-title">🏆 ゲームクリア！</div>
  <div class="result-card">
    <div class="result-row"><span>クリアラウンド</span><span class="result-val" id="res-rounds">-</span></div>
    <div class="result-row"><span>総正解数</span><span class="result-val" id="res-correct">-</span></div>
    <div class="result-row"><span>総ミス数</span><span class="result-val" id="res-wrong">-</span></div>
    <div class="result-row"><span>最高連続正解</span><span class="result-val" id="res-streak">-</span></div>
    <div class="result-row"><span>ランク</span><span class="result-val" id="res-rank">-</span></div>
  </div>
  <div class="result-btns">
    <button class="rbtn rbtn-retry" onclick="showScreen('mode-screen')">もう一度</button>
    <button class="rbtn rbtn-menu" onclick="showScreen('title-screen')">タイトル</button>
  </div>
</div>

<script>
// ===== QUIZ DATABASE =====
const CATEGORIES = [
  {

// ===== GAME STATE =====
const G = {
  round:0, qi:0, wrongs:0, consecutive:0, maxConsecutive:0,
  totalCorrect:0, totalWrong:0, roundsCleared:0,
  timer:null, timeLeft:30, answered:false,
  currentCat:null, questions:[], usedCatIndices:[],
  mode:'choice',
  inputAttempts: 0
};

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function selectMode(mode) {
  G.mode = mode;
  startGame();
}

function startGame() {
  G.round=0; G.totalCorrect=0; G.totalWrong=0; G.maxConsecutive=0; G.roundsCleared=0;
  G.usedCatIndices=[];
  startRound();
}

function startRound() {
  G.wrongs=0; G.consecutive=0; G.qi=0;

  if (G.mode === 'input') {
    // Use INPUT_DB for input mode — shuffle and take up to 20 questions per round
    const pool = [...INPUT_DB].sort(() => Math.random() - 0.5);
    G.questions = pool.slice(0, Math.min(20, pool.length));
    G.currentCat = { name: '⌨️ 入力式クイズ' };
  } else {
    // Pick unused category index
    const available = CATEGORIES.map((_,i)=>i).filter(i=>!G.usedCatIndices.includes(i));
    const pick = available.length > 0
      ? available[Math.floor(Math.random()*available.length)]
      : Math.floor(Math.random()*CATEGORIES.length);
    G.usedCatIndices.push(pick);
    G.currentCat = CATEGORIES[pick];
    G.questions = [...G.currentCat.qs].sort(()=>Math.random()-0.5);
  }

  document.getElementById('cat-name').textContent = G.currentCat.name;
  document.getElementById('round-info').textContent = `ラウンド ${G.round+1}/5`;
  updateBombDisplay();
  showScreen('game-screen');
  showQuestion();
}

function showQuestion() {
  if (G.consecutive >= 5 || G.qi >= G.questions.length) {
    roundClear(); return;
  }
  G.answered = false;
  G.inputAttempts = 0;
  const q = G.questions[G.qi];
  document.getElementById('question-num').textContent = `Q${G.qi+1}`;
  document.getElementById('question-text').textContent = q.q;
  document.getElementById('consecutive').textContent = `連続正解: ${G.consecutive}/5`;

  const optsEl = document.getElementById('options');
  const inputWrap = document.getElementById('input-wrap');
  const charHintEl = document.getElementById('char-hint');

  if (G.mode === 'choice' && q.opts) {
    optsEl.style.display = 'grid';
    inputWrap.style.display = 'none';
    charHintEl.style.display = 'none';
    optsEl.innerHTML = '';
    const shuffled = [...q.opts].sort(() => Math.random() - 0.5);
    shuffled.forEach(opt => {
      const btn = document.createElement('button');
      btn.className = 'opt-btn';
      btn.textContent = opt;
      btn.onclick = () => chooseOption(btn, opt, q.a);
      optsEl.appendChild(btn);
    });
  } else {
    // input mode (or no opts available)
    optsEl.style.display = 'none';
    inputWrap.style.display = 'flex';
    const inputEl = document.getElementById('answer-input');
    inputEl.value = '';
    inputEl.style.borderColor = '';

    // Show character count hint as underscores
    const answerLen = q.a.replace(/[・（）()「」【】\s]/g, '').length;
    charHintEl.textContent = '＿'.repeat(answerLen);
    charHintEl.style.display = 'block';

    // Update placeholder with language and length hint
    const isJapanese = /[぀-ヿ一-鿿]/.test(q.a);
    inputEl.placeholder = isJapanese
      ? `日本語で入力（${q.a.length}文字）`
      : `答えを入力（${q.a.length}文字）`;

    setTimeout(() => inputEl.focus(), 100);
  }
  startTimer();
}

function startTimer() {
  clearInterval(G.timer);
  G.timeLeft=30;
  updateTimerDisplay();
  G.timer=setInterval(()=>{
    G.timeLeft--;
    updateTimerDisplay();
    if(G.timeLeft<=0){ clearInterval(G.timer); timeUp(); }
  },1000);
}

function updateTimerDisplay() {
  const pct=G.timeLeft/30*100;
  document.getElementById('timer-fill').style.width=pct+'%';
  document.getElementById('timer-fill').style.background=
    pct>60?'linear-gradient(90deg,#44cc44,#88ff44)':
    pct>30?'linear-gradient(90deg,#ccaa00,#ffdd44)':
    'linear-gradient(90deg,#cc2200,#ff4422)';
  document.getElementById('timer-num').textContent=G.timeLeft+'秒';
}

function timeUp() {
  if(G.answered)return;
  G.answered=true;
  clearInterval(G.timer);
  showFeedbackBig('⏰ タイムオーバー！','#ff8800');
  flashScreen('wrong');
  handleWrong();
}

function chooseOption(btn, chosen, correct) {
  if(G.answered)return;
  G.answered=true;
  clearInterval(G.timer);
  if(chosen===correct){
    btn.classList.add('correct');
    handleCorrect();
  } else {
    btn.classList.add('wrong');
    document.querySelectorAll('.opt-btn').forEach(b=>{ if(b.textContent===correct)b.classList.add('correct'); });
    handleWrong();
  }
}

function submitFree() {
  if(G.answered)return;
  const q=G.questions[G.qi];
  const input=document.getElementById('answer-input').value.trim();
  if(!input)return;

  const norm=s=>s.replace(/[　\s・]/g,'').toLowerCase();
  const isCorrect=norm(input)===norm(q.a)||q.a.includes(input)||input.includes(q.a);

  if(isCorrect){
    G.answered=true;
    clearInterval(G.timer);
    handleCorrect();
  } else {
    // Wrong but can retry
    G.inputAttempts=(G.inputAttempts||0)+1;
    const inp=document.getElementById('answer-input');
    inp.value='';
    inp.focus();

    // Flash border red briefly
    inp.style.borderColor='#ff4444';
    setTimeout(()=>{ inp.style.borderColor=''; },500);

    // Progressive hints
    let hintMsg;
    if(G.inputAttempts===1){
      hintMsg=`❌ 違います！（${q.a.length}文字）`;
    } else if(G.inputAttempts===2){
      hintMsg=`❌ 違います！ヒント: 「${q.a[0]}」から始まります`;
    } else {
      hintMsg=`❌ 違います！ヒント: 「${q.a.slice(0,2)}...」`;
    }
    showFeedbackBig(hintMsg,'#ffaa44');

    // After 3 wrong attempts, count as miss
    if(G.inputAttempts>=3){
      G.answered=true;
      clearInterval(G.timer);
      handleWrong();
    }
  }
}

function handleCorrect() {
  G.consecutive++; G.totalCorrect++;
  if(G.consecutive>G.maxConsecutive)G.maxConsecutive=G.consecutive;
  showFeedbackBig('⭕ せいかい！','#44ff88');
  flashScreen('correct');
  bombCorrect();
  document.getElementById('consecutive').textContent=`連続正解: ${G.consecutive}/5`;
  setTimeout(()=>{ G.qi++; showQuestion(); },900);
}

function handleWrong() {
  G.consecutive=0; G.totalWrong++; G.wrongs++;
  flashScreen('wrong');
  bombWrong();
  updateBombDisplay();
  if(G.wrongs>=5){
    clearInterval(G.timer);
    setTimeout(()=>{
      document.getElementById('bomb').classList.add('explode');
      setTimeout(()=>showScreen('explode-screen'),800);
    },600);
    return;
  }
  setTimeout(()=>{ G.qi++; showQuestion(); },1200);
}

function bombCorrect() {
  const bomb=document.getElementById('bomb');
  bomb.classList.remove('wrong-drop');
  bomb.classList.add('correct-jump');
  setTimeout(()=>bomb.classList.remove('correct-jump'),500);
}

function bombWrong() {
  const bomb=document.getElementById('bomb');
  bomb.classList.remove('correct-jump');
  bomb.classList.add('wrong-drop');
  setTimeout(()=>bomb.classList.remove('wrong-drop'),400);
  const scale = 1 + G.wrongs*0.07;
  bomb.style.transform=`scale(${scale})`;
  bomb.style.filter=`drop-shadow(0 0 ${20+G.wrongs*10}px rgba(255,${Math.max(0,50-G.wrongs*10)},0,0.8))`;
}

function updateBombDisplay() {
  for(let i=0;i<5;i++){
    const bar=document.getElementById('db'+i);
    bar.classList.toggle('active',i<G.wrongs);
  }
  document.getElementById('bomb-level-label').textContent=`危険度: ${G.wrongs}/5`;
  if(G.wrongs===0){
    document.getElementById('bomb').style.transform='scale(1)';
    document.getElementById('bomb').style.filter='drop-shadow(0 0 20px rgba(255,100,0,0.6))';
  }
}

function roundClear() {
  clearInterval(G.timer);
  G.roundsCleared++;
  document.getElementById('clear-cat').textContent=G.currentCat.name;
  document.getElementById('clear-correct').textContent=
    G.consecutive >= 5 ? '5連続正解！！' : `${G.totalCorrect}問正解`;
  showScreen('clear-screen');
}

function nextRound() {
  G.round++;
  if(G.round>=5){ showResult(); return; }
  startRound();
}

function showResult() {
  const total=G.totalCorrect+G.totalWrong;
  const pct=total>0?G.totalCorrect/total:0;
  let rank='D';
  if(G.totalWrong===0)rank='S+';
  else if(pct>=0.9)rank='S';
  else if(pct>=0.8)rank='A';
  else if(pct>=0.65)rank='B';
  else if(pct>=0.5)rank='C';
  document.getElementById('res-rounds').textContent=`${G.roundsCleared}/5`;
  document.getElementById('res-correct').textContent=`${G.totalCorrect}問`;
  document.getElementById('res-wrong').textContent=`${G.totalWrong}回`;
  document.getElementById('res-streak').textContent=`${G.maxConsecutive}連続`;
  document.getElementById('res-rank').textContent=rank;
  showScreen('result-screen');
}

function showFeedbackBig(text,color){
  const el=document.getElementById('big-feedback');
  el.textContent=text; el.style.color=color;
  el.classList.remove('show');
  void el.offsetWidth;
  el.classList.add('show');
}

function flashScreen(type){
  const el=document.getElementById('flash');
  el.className='';
  void el.offsetWidth;
  el.classList.add(type==='correct'?'correct-flash':'wrong-flash');
  setTimeout(()=>el.className='',400);
}

document.getElementById('answer-input').addEventListener('keydown',e=>{if(e.key==='Enter')submitFree();});

// No live per-character feedback — blanks are shown statically in showQuestion()
</script>
</body>
</html>

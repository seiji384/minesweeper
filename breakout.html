<script>
function getDateKey(){return new Date().toISOString().slice(0,10);}
function getWeekKey(){const d=new Date(),day=d.getDay()||7,mon=new Date(d);mon.setDate(d.getDate()-day+1);return mon.toISOString().slice(0,10);}
function getMonthKey(){return new Date().toISOString().slice(0,7);}
function fmtDate(s){const p=s.slice(5).split('-');return`${parseInt(p[0])}/${parseInt(p[1])}`;}
function saveHiRec(key,val){
  const today=getDateKey(),wk=getWeekKey(),mo=getMonthKey();
  let d=JSON.parse(localStorage.getItem(key+'_rec')||'{}');
  if(!d.all||val>d.all.v)d.all={v:val,date:today};
  if(!d.today||d.today.date!==today||val>d.today.v)d.today={v:val,date:today};
  if(!d.week||d.week.key!==wk||val>d.week.v)d.week={v:val,key:wk,date:today};
  if(!d.month||d.month.key!==mo||val>d.month.v)d.month={v:val,key:mo,date:today};
  localStorage.setItem(key+'_rec',JSON.stringify(d));
}
function renderHiRec(key,unit){
  const today=getDateKey(),wk=getWeekKey(),mo=getMonthKey();
  const d=JSON.parse(localStorage.getItem(key+'_rec')||'{}');
  const fmt=e=>e?`<span class="hs-record">${e.v}${unit}</span><span class="hs-date">(${fmtDate(e.date)})</span>`:'<span class="hs-val">--</span>';
  const tV=d.today?.date===today?fmt(d.today):'<span class="hs-val">--</span>';
  const wV=d.week?.key===wk?fmt(d.week):'<span class="hs-val">--</span>';
  const mV=d.month?.key===mo?fmt(d.month):'<span class="hs-val">--</span>';
  return`<div class="hs-table"><div class="hs-row"><span class="hs-period">本日</span>${tV}</div><div class="hs-row"><span class="hs-period">今週</span>${wV}</div><div class="hs-row"><span class="hs-period">今月</span>${mV}</div><div class="hs-row"><span class="hs-period">全期間</span>${fmt(d.all)}</div></div>`;
}

// ===== STAR BACKGROUND =====
(function(){
  const sc = document.getElementById('starCanvas');
  const sx = sc.getContext('2d');
  function resizeStar(){ sc.width = window.innerWidth; sc.height = window.innerHeight; }
  resizeStar();
  window.addEventListener('resize', resizeStar);
  const stars = Array.from({length:160}, ()=>({
    x: Math.random(), y: Math.random(),
    r: Math.random()*1.5+0.3,
    a: Math.random(),
    da: (Math.random()-0.5)*0.008,
    speed: Math.random()*0.00015+0.00005
  }));
  function drawStars(){
    sx.clearRect(0,0,sc.width,sc.height);
    stars.forEach(s=>{
      s.y += s.speed;
      if(s.y>1) s.y=0;
      s.a += s.da;
      if(s.a>1||s.a<0.1) s.da=-s.da;
      sx.beginPath();
      sx.arc(s.x*sc.width, s.y*sc.height, s.r, 0, Math.PI*2);
      sx.fillStyle = `rgba(200,180,255,${s.a})`;
      sx.fill();
    });
    requestAnimationFrame(drawStars);
  }
  drawStars();
})();

// ===== CONFETTI =====
const confettiCanvas = document.getElementById('confettiCanvas');
const confettiCtx = confettiCanvas.getContext('2d');
let confettiParticles = [];
let confettiActive = false;
confettiCanvas.width = window.innerWidth;
confettiCanvas.height = window.innerHeight;
window.addEventListener('resize', ()=>{
  confettiCanvas.width = window.innerWidth;
  confettiCanvas.height = window.innerHeight;
});
function spawnConfetti(){
  confettiActive = true;
  const colors = ['#ffe870','#ff60c0','#60ffb0','#40e0ff','#b898ff','#ff8040'];
  for(let i=0;i<120;i++){
    confettiParticles.push({
      x: Math.random()*confettiCanvas.width,
      y: -10,
      vx: (Math.random()-0.5)*4,
      vy: Math.random()*4+2,
      rot: Math.random()*360,
      rotV: (Math.random()-0.5)*8,
      w: Math.random()*10+5,
      h: Math.random()*6+3,
      color: colors[Math.floor(Math.random()*colors.length)],
      life: 1
    });
  }
}
function animConfetti(){
  confettiCtx.clearRect(0,0,confettiCanvas.width,confettiCanvas.height);
  if(!confettiActive){ requestAnimationFrame(animConfetti); return; }
  confettiParticles = confettiParticles.filter(p=>{
    p.x+=p.vx; p.y+=p.vy; p.rot+=p.rotV; p.vy+=0.08;
    p.life-=0.008;
    confettiCtx.save();
    confettiCtx.globalAlpha = p.life;
    confettiCtx.translate(p.x,p.y);
    confettiCtx.rotate(p.rot*Math.PI/180);
    confettiCtx.fillStyle = p.color;
    confettiCtx.fillRect(-p.w/2,-p.h/2,p.w,p.h);
    confettiCtx.restore();
    return p.life>0 && p.y<confettiCanvas.height+20;
  });
  if(confettiParticles.length===0) confettiActive=false;
  requestAnimationFrame(animConfetti);
}
animConfetti();

const ctx = canvas.getContext('2d');

// Dynamic canvas sizing
{

  const Hr = Math.min(window.innerHeight * 0.65, 520);
  canvas.width = Math.max(Math.round(Wr), 280);

}
const W = canvas.width, H = canvas.height;

const BRICK_PAD = 2;
const BRICK_TOP = 28;
const BRICK_H = 18;

const PADDLE_H = 10, PADDLE_Y = H - 30;
const BALL_R = 6;
const POWERUP_SIZE = 14;

const POWERUP_TYPES = [
  { type:'wide', color:'#40e0ff', icon:'↔', label:'パドル拡張', duration:8000 },
  { type:'multi', color:'#ffdd40', icon:'✦', label:'マルチボール', duration:0 },
  { type:'slow', color:'#a040ff', icon:'❄', label:'スローボール', duration:6000 },
  { type:'fire', color:'#ff6040', icon:'🔥', label:'ファイアボール', duration:7000 }
];

// ---- STAGE DEFINITIONS ----
// layout(r, c, rows, cols) => { include, hp, indestructible, moving }
const STAGES = [
  // 1: Simple 5×6, slow ball, wide paddle
  { rows:5, cols:6, ballSpeed:2.5, paddleW:0.22,
    label:'シンプル',
    layout:(r,c)=>({include:true, hp:1, indestructible:false, moving:false}) },
  // 2: 6×8, middle row indestructible, slightly faster
  { rows:6, cols:8, ballSpeed:3.0, paddleW:0.20,
    label:'障害壁',
    layout:(r,c,R)=>({include:true, hp:1, indestructible:r===Math.floor(R/2), moving:false}) },
  // 3: Border-only, 7×9
  { rows:7, cols:9, ballSpeed:3.3, paddleW:0.18,
    label:'ボーダー',
    layout:(r,c,R,C)=>({include:r===0||r===R-1||c===0||c===C-1, hp:1, indestructible:false, moving:false}) },
  // 4: Checkerboard, top 2 rows 2-hit
  { rows:6, cols:9, ballSpeed:3.5, paddleW:0.18,
    label:'チェッカー',
    layout:(r,c)=>({include:(r+c)%2===0, hp:r<2?2:1, indestructible:false, moving:false}) },
  // 5: Full grid, alternating rows move
  { rows:6, cols:8, ballSpeed:3.7, paddleW:0.17,
    label:'移動ブロック',
    layout:(r,c)=>({include:true, hp:1, indestructible:false, moving:r%2===0}) },
  // 6: Diamond, multi-hit
  { rows:7, cols:9, ballSpeed:4.0, paddleW:0.16,
    label:'ダイヤモンド',
    layout:(r,c,R,C)=>{
      const mid=(C-1)/2, rm=(R-1)/2;
      const inc=Math.abs(r-rm)+Math.abs(c-mid)<4;
      return {include:inc, hp:r<2?2:1, indestructible:false, moving:false};
    }},
  // 7: Border indestructible + moving inner row
  { rows:7, cols:9, ballSpeed:4.2, paddleW:0.15,
    label:'要塞',
    layout:(r,c,R,C)=>{
      const border=r===0||r===R-1||c===0||c===C-1;
      const mid=Math.floor(R/2);
      return {include:true, hp:border?999:r<3?2:1, indestructible:border, moving:r===mid&&!border};
    }},
  // 8: X pattern, top/bottom rows moving, indestructible centre
  { rows:8, cols:10, ballSpeed:4.5, paddleW:0.14,
    label:'Xパターン',
    layout:(r,c,R,C)=>{
      const xp=Math.abs(c-Math.floor(C/2))===Math.abs(r-Math.floor(R/2));
      const centre=r===Math.floor(R/2)&&c===Math.floor(C/2);
      return {include:xp||centre, hp:r<3?2:1, indestructible:centre, moving:r<2||r>R-3};
    }},
  // 9: Full grid, every odd row moving, triple-hit top rows
  { rows:7, cols:9, ballSpeed:4.8, paddleW:0.13,
    label:'嵐',
    layout:(r,c)=>({include:true, hp:r<2?3:r<4?2:1, indestructible:false, moving:r%2===1}) },
  // 10: Max difficulty – border indestructible, moving inside rows, 3-hit upper
  { rows:8, cols:10, ballSpeed:5.2, paddleW:0.12,
    label:'地獄',
    layout:(r,c,R,C)=>{
      const border=r===0||r===R-1||c===0||c===C-1;
      return {include:true, hp:border?999:r<4?3:2, indestructible:border, moving:r===1||r===R-2};
    }},
];

const ROW_COLORS = [
  '#ff4040','#ff7020','#ffdd20','#80ff20',
  '#20ffc0','#20c0ff','#6040ff','#ff40c0',
  '#ff80c0','#a0ff60'
];

let state = 'idle'; // idle, playing, paused, stageclear, gameover
let score = 0, hiScore = parseInt(localStorage.getItem('breakout_hi')||'0');
let lives = 3, stage = 1;
let balls = [], paddle = {}, bricks = [], powerups = [], activePU = {};
let animId = null;
let stageClearTimeout = null;

function lerp(a,b,t){ return a+(b-a)*t; }

function getStageCfg(){ return STAGES[Math.min(stage-1, STAGES.length-1)]; }
function getBaseSpeed(){ return getStageCfg().ballSpeed; }
function getDefaultPaddleW(){ return Math.max(Math.round(W * getStageCfg().paddleW), 40); }

function mkBall(x,y,vx,vy){
  const spd = getBaseSpeed();
  const dir = (Math.random()<0.5?-1:1);
  return { x: x!=null?x:W/2, y: y!=null?y:PADDLE_Y-BALL_R-1,
    vx: vx!=null?vx:dir*spd*0.65,
    vy: vy!=null?vy:-spd, fire:false };
}

function mkPaddle(){
  return { x: W/2, w: getDefaultPaddleW() };
}

function mkBricks(){
  bricks = [];
  const cfg = getStageCfg();
  const cols = cfg.cols;
  const brickW = Math.floor((W - 20) / cols);
  for(let r=0; r<cfg.rows; r++){
    for(let c=0; c<cols; c++){
      const info = cfg.layout(r, c, cfg.rows, cols);
      if(!info.include) continue;
      const bx = 10 + c * brickW;
      const by = BRICK_TOP + r * BRICK_H;
      bricks.push({
        r, c,
        x: bx, y: by,
        w: brickW - BRICK_PAD, h: BRICK_H - BRICK_PAD,
        hp: info.hp, maxHp: info.indestructible ? 999 : info.hp,
        indestructible: info.indestructible,
        moving: info.moving,
        movePhase: Math.random() * Math.PI * 2,
        moveSpeed: 1.2 + Math.random() * 0.6,
        moveRange: Math.min(brickW * 1.2, 28),
        origX: bx,
        color: ROW_COLORS[r % ROW_COLORS.length]
      });
    }
  }
}

function startGame(){
  score=0; lives=3; stage=1;
  activePU={}; powerups=[];
  paddle = mkPaddle();
  balls = [mkBall()];
  mkBricks();
  state='playing';
  updateHUD();
  document.getElementById('overlay').style.display='none';
  document.getElementById('pauseBtn').disabled=false;
}

function startGameAtStage(n){
  document.getElementById('breakout-stage-modal').classList.remove('visible');
  score=0; lives=3; stage=n;
  activePU={}; powerups=[];
  paddle = mkPaddle();
  balls = [mkBall()];
  mkBricks();
  state='playing';
  updateHUD();
  document.getElementById('overlay').style.display='none';
  document.getElementById('pauseBtn').disabled=false;
  if(animId) cancelAnimationFrame(animId);
  startLoop();
}

function nextStage(){
  stage++;
  activePU={}; powerups=[];
  paddle = mkPaddle();
  balls = [mkBall()];
  mkBricks();
  state='playing';
  updateHUD();
  document.getElementById('overlay').style.display='none';
  startLoop(); // restart the game loop after stage clear
}

function updateHUD(){
  document.getElementById('scoreDisplay').textContent = String(score).padStart(5,'0');
  if(score>hiScore){ hiScore=score; localStorage.setItem('breakout_hi',hiScore); saveHiRec('breakout',hiScore); }
  document.getElementById('hiDisplay').textContent = String(hiScore).padStart(5,'0');
  document.getElementById('livesDisplay').textContent = '❤️'.repeat(Math.max(0,lives));
  document.getElementById('stageDisplay').textContent = String(stage).padStart(3,'0');
}

function showOverlay(title,msg,scoreVal){
  const ov = document.getElementById('overlay');
  ov.style.display='flex';
  document.getElementById('overlayTitle').textContent=title;
  document.getElementById('overlayMsg').textContent=msg;
  const os=document.getElementById('overlayScore');
  if(scoreVal!=null){ os.style.display='block'; os.textContent=String(scoreVal).padStart(6,'0'); }
  else os.style.display='none';
}

function loseLife(){
  lives--;
  updateHUD();
  activePU={}; powerups=[];
  paddle.w = getDefaultPaddleW();
  if(lives<=0){
    state='gameover';
    cancelAnimationFrame(animId);
    showOverlay('GAME OVER','スコア',score);
    document.getElementById('pauseBtn').disabled=true;
  } else {
    balls=[mkBall()];
  }
}

function applyPowerup(pu){
  const t = pu.puType;
  const dur = POWERUP_TYPES.find(p=>p.type===t)?.duration||0;
  const basePW = getDefaultPaddleW();
  if(t==='wide'){
    paddle.w = Math.min(paddle.w+30, Math.round(W*0.5));
    if(dur){ clearTimeout(activePU.wideTimer); activePU.wideTimer=setTimeout(()=>{paddle.w=Math.max(paddle.w-30,basePW);},dur); }
  } else if(t==='multi'){
    const extra = balls.map(b=>mkBall(b.x,b.y,b.vx+1,-(Math.abs(b.vy))));
    balls.push(...extra);
  } else if(t==='slow'){
    activePU.slow=true;
    if(dur){ clearTimeout(activePU.slowTimer); activePU.slowTimer=setTimeout(()=>{ activePU.slow=false; },dur); }
  } else if(t==='fire'){
    activePU.fire=true;
    balls.forEach(b=>b.fire=true);
    if(dur){ clearTimeout(activePU.fireTimer); activePU.fireTimer=setTimeout(()=>{ activePU.fire=false; balls.forEach(b=>b.fire=false); },dur); }
  }
}

function update(dt){
  if(state!=='playing') return;
  const slowFactor = activePU.slow ? 0.55 : 1;

  // Move powerups
  powerups = powerups.filter(pu=>{
    pu.y += 2*dt;
    if(pu.y+POWERUP_SIZE>PADDLE_Y && pu.y<PADDLE_Y+PADDLE_H+8 &&
       pu.x+POWERUP_SIZE>paddle.x-paddle.w/2 && pu.x<paddle.x+paddle.w/2){
      applyPowerup(pu);
      return false;
    }
    return pu.y < H+POWERUP_SIZE;
  });

  // Update moving bricks (sinusoidal oscillation)
  bricks.forEach(b=>{
    if(b.moving){
      b.movePhase += b.moveSpeed * dt * 0.04;
      b.x = b.origX + Math.sin(b.movePhase) * b.moveRange;
    }
  });

  // Move balls
  let aliveBalls = [];
  for(let ball of balls){
    ball.x += ball.vx * slowFactor * dt;
    ball.y += ball.vy * slowFactor * dt;

    // Wall bounce
    if(ball.x-BALL_R<0){ ball.x=BALL_R; ball.vx=Math.abs(ball.vx); }
    if(ball.x+BALL_R>W){ ball.x=W-BALL_R; ball.vx=-Math.abs(ball.vx); }
    if(ball.y-BALL_R<0){ ball.y=BALL_R; ball.vy=Math.abs(ball.vy); }

    // Paddle collision
    const px1=paddle.x-paddle.w/2, px2=paddle.x+paddle.w/2;
    if(ball.vy>0 && ball.y+BALL_R>PADDLE_Y && ball.y+BALL_R<PADDLE_Y+PADDLE_H+8 &&
       ball.x>px1 && ball.x<px2){
      ball.y=PADDLE_Y-BALL_R;
      const rel=(ball.x-paddle.x)/(paddle.w/2);
      const angle=rel*60*Math.PI/180;
      const spd=Math.sqrt(ball.vx*ball.vx+ball.vy*ball.vy);
      ball.vx=spd*Math.sin(angle);
      ball.vy=-spd*Math.cos(angle);
    }

    // Brick collision
    for(let i=bricks.length-1;i>=0;i--){
      const b=bricks[i];
      if(ball.x+BALL_R>b.x && ball.x-BALL_R<b.x+b.w &&
         ball.y+BALL_R>b.y && ball.y-BALL_R<b.y+b.h){
        // Always bounce off indestructible; fire passes through destructible only
        if(!ball.fire || b.indestructible){
          const overlapL=ball.x+BALL_R-b.x, overlapR=b.x+b.w-(ball.x-BALL_R);
          const overlapT=ball.y+BALL_R-b.y, overlapB=b.y+b.h-(ball.y-BALL_R);
          const minH=Math.min(overlapL,overlapR), minV=Math.min(overlapT,overlapB);
          if(minH<minV) ball.vx=-ball.vx; else ball.vy=-ball.vy;
        }
        if(!b.indestructible){
          b.hp--;
          if(b.hp<=0){
            const rowsTotal = getStageCfg().rows;
            const mult = rowsTotal - b.r;
            score += 10 * mult * stage;
            updateHUD();
            if(Math.random()<0.18){
              const pt=POWERUP_TYPES[Math.floor(Math.random()*POWERUP_TYPES.length)];
              powerups.push({ x:b.x+b.w/2-POWERUP_SIZE/2, y:b.y, puType:pt.type, color:pt.color, icon:pt.icon });
            }
            bricks.splice(i,1);
          }
        }
        break;
      }
    }

    if(ball.y-BALL_R<=H) aliveBalls.push(ball);
  }
  balls=aliveBalls;
  if(balls.length===0){ loseLife(); return; }

  // Stage clear = all destructible bricks gone
  if(bricks.filter(b=>!b.indestructible).length===0){
    state='stageclear';
    spawnConfetti();
    showOverlay('STAGE CLEAR！','✨ 次のステージへ ✨',score);
    document.getElementById('pauseBtn').disabled=true;
    clearTimeout(stageClearTimeout);
    stageClearTimeout=setTimeout(()=>{ nextStage(); document.getElementById('pauseBtn').disabled=false; },2200);
  }
}

function drawBrick(b){
  if(b.indestructible){
    // Steel look
    ctx.globalAlpha=1;
    const grad=ctx.createLinearGradient(b.x,b.y,b.x,b.y+b.h);
    grad.addColorStop(0,'#b0b8d0');
    grad.addColorStop(0.5,'#606878');
    grad.addColorStop(1,'#303848');
    ctx.fillStyle=grad;
    ctx.beginPath();
    ctx.roundRect(b.x,b.y,b.w,b.h,3);
    ctx.fill();
    ctx.strokeStyle='rgba(200,220,255,0.5)';
    ctx.lineWidth=1;
    ctx.stroke();
    // rivet dots
    ctx.fillStyle='rgba(255,255,255,0.25)';
    ctx.beginPath(); ctx.arc(b.x+4,b.y+b.h/2,2,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(b.x+b.w-4,b.y+b.h/2,2,0,Math.PI*2); ctx.fill();
    return;
  }
  const alpha = b.hp<b.maxHp ? 0.5 : 1;
  ctx.globalAlpha=alpha;
  const grad=ctx.createLinearGradient(b.x,b.y,b.x,b.y+b.h);
  grad.addColorStop(0, lighten(b.color,40));
  grad.addColorStop(1, darken(b.color,30));
  ctx.fillStyle=grad;
  ctx.beginPath();
  ctx.roundRect(b.x,b.y,b.w,b.h,3);
  ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,0.3)';
  ctx.lineWidth=1;
  ctx.stroke();
  if(b.maxHp>1){
    ctx.globalAlpha=1;
    ctx.fillStyle='#fff';
    ctx.font='bold 10px monospace';
    ctx.textAlign='center';
    ctx.textBaseline='middle';
    ctx.fillText(b.hp, b.x+b.w/2, b.y+b.h/2);
  }
  ctx.globalAlpha=1;
}

function lighten(hex,amt){
  let n=parseInt(hex.slice(1),16);
  let r=Math.min(255,(n>>16)+amt), g=Math.min(255,((n>>8)&0xff)+amt), bl=Math.min(255,(n&0xff)+amt);
  return `rgb(${r},${g},${bl})`;
}
function darken(hex,amt){
  let n=parseInt(hex.slice(1),16);
  let r=Math.max(0,(n>>16)-amt), g=Math.max(0,((n>>8)&0xff)-amt), bl=Math.max(0,(n&0xff)-amt);
  return `rgb(${r},${g},${bl})`;
}

function draw(){
  ctx.clearRect(0,0,W,H);

  // Background
  const bg=ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,'#0d0830');
  bg.addColorStop(1,'#050210');
  ctx.fillStyle=bg;
  ctx.fillRect(0,0,W,H);

  // Grid lines subtle
  ctx.strokeStyle='rgba(112,96,255,0.07)';
  ctx.lineWidth=1;
  for(let x=0;x<W;x+=40){ ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H); ctx.stroke(); }
  for(let y=0;y<H;y+=40){ ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); }

  // Bricks
  bricks.forEach(drawBrick);

  // Powerups
  powerups.forEach(pu=>{
    ctx.fillStyle=pu.color;
    ctx.shadowColor=pu.color;
    ctx.shadowBlur=8;
    ctx.beginPath();
    ctx.roundRect(pu.x,pu.y,POWERUP_SIZE,POWERUP_SIZE,4);
    ctx.fill();
    ctx.shadowBlur=0;
    ctx.fillStyle='#fff';
    ctx.font='bold 9px sans-serif';
    ctx.textAlign='center';
    ctx.textBaseline='middle';
    ctx.fillText(pu.icon, pu.x+POWERUP_SIZE/2, pu.y+POWERUP_SIZE/2);
  });

  // Paddle
  const pg=ctx.createLinearGradient(paddle.x-paddle.w/2, PADDLE_Y, paddle.x+paddle.w/2, PADDLE_Y+PADDLE_H);
  pg.addColorStop(0, activePU.fire?'#ff8040': activePU.slow?'#c070ff':'#b898ff');
  pg.addColorStop(1, activePU.fire?'#ff4000': activePU.slow?'#6020aa':'#5030b0');
  ctx.fillStyle=pg;
  ctx.shadowColor = activePU.fire?'#ff6020': activePU.slow?'#a040ff':'#8060ff';
  ctx.shadowBlur=15;
  ctx.beginPath();
  ctx.roundRect(paddle.x-paddle.w/2, PADDLE_Y, paddle.w, PADDLE_H, 5);
  ctx.fill();
  ctx.shadowBlur=0;

  // Balls
  balls.forEach(ball=>{
    const bc = ball.fire?'#ff8040':'#ffffff';
    ctx.beginPath();
    ctx.arc(ball.x,ball.y,BALL_R,0,Math.PI*2);
    const bg2=ctx.createRadialGradient(ball.x-2,ball.y-2,1,ball.x,ball.y,BALL_R);
    bg2.addColorStop(0,'#ffffff');
    bg2.addColorStop(1,ball.fire?'#ff4000':'#a080ff');
    ctx.fillStyle=bg2;
    ctx.shadowColor=bc;
    ctx.shadowBlur=12;
    ctx.fill();
    ctx.shadowBlur=0;
  });

  // Active powerup indicators
  let iy=4;
  if(activePU.slow){ drawIndicator('❄ SLOW',POWERUP_TYPES[2].color,iy); iy+=16; }
  if(activePU.fire){ drawIndicator('🔥 FIRE',POWERUP_TYPES[3].color,iy); iy+=16; }
  if(paddle.w>getDefaultPaddleW()){ drawIndicator('↔ WIDE',POWERUP_TYPES[0].color,iy); }
}

function drawIndicator(text,color,y){
  ctx.fillStyle=color;
  ctx.font='bold 10px monospace';
  ctx.textAlign='right';
  ctx.textBaseline='top';
  ctx.fillText(text, W-6, y);
}

let lastTs=0;
function gameLoop(ts){
  const dt = Math.min((ts-lastTs)/16.67, 3);
  lastTs=ts;
  update(dt);
  draw();
  if(state==='playing'||state==='idle'||state==='stageclear') animId=requestAnimationFrame(gameLoop);
}

function startLoop(){
  if(animId) cancelAnimationFrame(animId);
  lastTs=performance.now();
  animId=requestAnimationFrame(gameLoop);
}

// Controls
let dragging=false, dragStartX=0, paddleStartX=0;
let touchLeft=false, touchRight=false;

canvas.addEventListener('mousedown', e=>{
  if(state==='idle'||state==='gameover'){
    startGame(); startLoop(); return;
  }
  if(state==='stageclear') return;
  const rect=canvas.getBoundingClientRect();
  const mx=(e.clientX-rect.left)*(W/rect.width);
  // check if near paddle
  if(Math.abs(e.clientY-rect.top-PADDLE_Y*(rect.height/H))<30){
    dragging=true; dragStartX=mx; paddleStartX=paddle.x;
  }
});
canvas.addEventListener('mousemove', e=>{
  if(!dragging) return;
  const rect=canvas.getBoundingClientRect();
  const mx=(e.clientX-rect.left)*(W/rect.width);
  paddle.x=Math.max(paddle.w/2, Math.min(W-paddle.w/2, paddleStartX+(mx-dragStartX)));
});
canvas.addEventListener('mouseup', ()=>dragging=false);
canvas.addEventListener('mouseleave', ()=>dragging=false);

canvas.addEventListener('touchstart', e=>{
  e.preventDefault();
  if(state==='idle'||state==='gameover'){
    startGame(); startLoop(); return;
  }
  if(state==='stageclear') return;
  const rect=canvas.getBoundingClientRect();
  const t=e.touches[0];
  const mx=(t.clientX-rect.left)*(W/rect.width);
  dragging=true; dragStartX=mx; paddleStartX=paddle.x;
},{passive:false});
canvas.addEventListener('touchmove', e=>{
  e.preventDefault();
  if(!dragging) return;
  const rect=canvas.getBoundingClientRect();
  const t=e.touches[0];
  const mx=(t.clientX-rect.left)*(W/rect.width);
  paddle.x=Math.max(paddle.w/2, Math.min(W-paddle.w/2, paddleStartX+(mx-dragStartX)));
},{passive:false});
canvas.addEventListener('touchend', ()=>dragging=false);

// Keyboard
document.addEventListener('keydown', e=>{
  if(e.key==='ArrowLeft'||e.key==='a'||e.key==='A') paddle.x=Math.max(paddle.w/2, paddle.x-18);
  if(e.key==='ArrowRight'||e.key==='d'||e.key==='D') paddle.x=Math.min(W-paddle.w/2, paddle.x+18);
  if(e.key===' '){
    if(state==='playing') pauseGame();
    else if(state==='paused') resumeGame();
    else if(state==='idle'||state==='gameover'){ startGame(); startLoop(); }
  }
});

function pauseGame(){
  if(state!=='playing') return;
  state='paused';
  cancelAnimationFrame(animId);
  showOverlay('⏸ 一時停止','スペースキー or ボタンで再開',null);
}
function resumeGame(){
  if(state!=='paused') return;
  state='playing';
  document.getElementById('overlay').style.display='none';
  startLoop();
}

document.getElementById('startBtn').addEventListener('click', ()=>{
  if(state==='paused'){ resumeGame(); return; }
  startGame(); startLoop();
});
document.getElementById('pauseBtn').addEventListener('click', ()=>{
  if(state==='playing') pauseGame();
  else if(state==='paused') resumeGame();
});

// Initial draw
updateHUD();
showOverlay('ブロック崩し','タップ or クリックでスタート\n← → キーでパドルを移動',null);
draw();

// Keyboard repeat for smoother movement
const keys={};
document.addEventListener('keydown', e=>keys[e.key]=true);
document.addEventListener('keyup', e=>keys[e.key]=false);
function keyMove(){
  if(state==='playing'){
    if(keys['ArrowLeft']||keys['a']||keys['A']) paddle.x=Math.max(paddle.w/2,paddle.x-5);
    if(keys['ArrowRight']||keys['d']||keys['D']) paddle.x=Math.min(W-paddle.w/2,paddle.x+5);
  }
  requestAnimationFrame(keyMove);
}
keyMove();
</script>

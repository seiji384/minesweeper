<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>神経衰弱 - ミニゲーム</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
body {
  background:
    radial-gradient(ellipse at 25% 20%, rgba(80,30,180,0.5) 0%, transparent 50%),
    radial-gradient(ellipse at 75% 80%, rgba(20,60,180,0.4) 0%, transparent 50%),
    radial-gradient(ellipse at 50% 50%, #120830 0%, #050210 100%);
  display: flex; justify-content: center; align-items: flex-start;
  min-height: 100vh; padding: 16px 8px 80px;
  font-family: Arial, sans-serif; overflow-x: hidden;
}
#stars { position: fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:0; }
.window {
  position: relative; z-index: 1;
  background: linear-gradient(160deg, #1e1248 0%, #0d0830 100%);
  border: 2px solid #7060ff; border-radius: 16px;
  box-shadow: 0 0 30px rgba(112,90,255,0.55), 0 0 80px rgba(112,90,255,0.2), 0 24px 64px rgba(0,0,0,0.85);
  max-width: 460px; width: 100%; overflow: clip;
}
.titlebar {
  background: linear-gradient(90deg, #a06008 0%, #f5c842 28%, #ffe870 50%, #f5c842 72%, #a06008 100%);
  color: #3a1a00; font-size: 14px; font-weight: 900; padding: 7px 14px;
  text-align: center; letter-spacing: 2px; text-shadow: 0 1px 0 rgba(255,255,200,0.8);
  border-bottom: 2px solid #804000;
  display: flex; justify-content: space-between; align-items: center;
}
.titlebar a { color: #3a1a00; text-decoration: none; font-size: 18px; }
.action-bar {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 600;
  display: flex; gap: 6px; padding: 8px 12px 10px;
  background: linear-gradient(0deg, #060412 0%, rgba(10,6,28,0.97) 100%);
  border-top: 1px solid #4030a0;
  box-shadow: 0 -4px 20px rgba(0,0,0,0.85), 0 -1px 0 rgba(112,90,255,0.3);
  flex-wrap: wrap; justify-content: center;
  backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
}
.act-btn {
  padding: 5px 14px; font-size: 11px; border-radius: 14px;
  background: linear-gradient(160deg, #3a2080 0%, #22105a 100%);
  color: #b898ff; border: 1px solid #5a3aaa;
  box-shadow: 0 2px 8px rgba(0,0,0,0.5);
  cursor: pointer; font-weight: bold; transition: all 0.15s; touch-action: manipulation;
}
.act-btn:active { transform: scale(0.93); }
.modal-overlay {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,0.78); z-index: 10000;
  justify-content: center; align-items: center; padding: 16px;
}
.modal-overlay.visible { display: flex; }
.modal-box {
  background: linear-gradient(160deg, #1e1248 0%, #0d0830 100%);
  border: 2px solid #7060ff; border-radius: 16px;
  box-shadow: 0 0 40px rgba(112,90,255,0.6), 0 24px 64px rgba(0,0,0,0.9);
  max-width: 360px; width: 100%; max-height: 88vh; overflow-y: auto;
}
.modal-title {
  background: linear-gradient(90deg, #a06008 0%, #f5c842 28%, #ffe870 50%, #f5c842 72%, #a06008 100%);
  color: #3a1a00; font-size: 14px; font-weight: 900; padding: 8px 14px;
  text-align: center; letter-spacing: 2px; border-radius: 14px 14px 0 0;
  display: flex; justify-content: space-between; align-items: center;
}
.modal-close { background: none; border: none; font-size: 18px; cursor: pointer; color: #3a1a00; }
.modal-body { padding: 14px; color: #c0b0e8; font-size: 13px; line-height: 1.6; }
.led {
  background: linear-gradient(160deg, #080518 0%, #040210 100%);
  color: #ff44aa; font-family: 'Courier New', monospace;
  font-size: 22px; font-weight: bold; padding: 3px 10px;
  min-width: 64px; text-align: right; border-radius: 6px; border: 1px solid #4020a0;
  text-shadow: 0 0 10px #ff44aa, 0 0 20px #ff2288;
  box-shadow: inset 0 2px 4px rgba(0,0,0,0.8), 0 0 10px rgba(255,68,170,0.3);
  display: inline-block;
}
.led-label { font-size: 9px; color: #6050a0; display: block; text-align: center; margin-top: 2px; }
.status-panel {
  background: linear-gradient(160deg, #100a30 0%, #08051a 100%);
  border: 1px solid #4030a0; border-radius: 10px;
  padding: 6px 12px; margin: 8px;
  display: flex; justify-content: space-around; align-items: center;
  box-shadow: inset 0 2px 8px rgba(0,0,0,0.6);
}
.led-group { display: flex; flex-direction: column; align-items: center; gap: 2px; }
.content { padding: 8px; }
#confetti { position: fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:9999; display:none; }

/* Difficulty bar */
.diff-bar {
  display: flex; gap: 4px; margin: 8px 8px 4px; justify-content: center;
}
.diff-btn {
  flex: 1; padding: 6px 4px; font-size: 11px; border-radius: 10px; cursor: pointer;
  background: linear-gradient(160deg, #2a1860 0%, #180a40 100%);
  color: #8878c0; border: 1px solid #4030a0;
  font-weight: bold; transition: all 0.15s; touch-action: manipulation;
  text-align: center;
}
.diff-btn.active {
  background: linear-gradient(160deg, #5a3aaa 0%, #3a1a80 100%);
  color: #e8d8ff; border-color: #8060d0;
  box-shadow: 0 0 10px rgba(120,90,255,0.5);
}
.diff-btn:active { transform: scale(0.95); }

/* Card grid */
.card-grid {
  display: grid; gap: 6px; padding: 4px;
  overflow-x: auto; overflow-y: hidden;
  touch-action: pan-x pan-y;
}
.card { perspective: 600px; cursor: pointer; touch-action: manipulation; aspect-ratio: 1; }
.card-inner { position: relative; width: 100%; height: 100%; transform-style: preserve-3d; transition: transform 0.4s; }
.card.flipped .card-inner, .card.matched .card-inner { transform: rotateY(180deg); }
.card-front, .card-back { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; border-radius: 8px; display: flex; align-items: center; justify-content: center; }
.card-front {
  background: linear-gradient(145deg, #5a3aaa 10%, #3a1a8a 60%, #28106a 100%);
  border: 1px solid #6048b0; font-size: 20px; color: #6050a0;
}
.card-back {
  background: linear-gradient(145deg, #2a1870 0%, #1a0a50 100%);
  border: 1px solid #7060c0; transform: rotateY(180deg); font-size: 28px;
}
.card.matched .card-back {
  background: radial-gradient(circle, #3a2a00 0%, #1a1000 100%);
  border-color: #f5c842;
  box-shadow: 0 0 12px rgba(245,200,66,0.6);
}

/* Win message */
.win-msg {
  text-align: center; color: #f5c842; font-size: 20px; font-weight: 900;
  padding: 12px; display: none;
  text-shadow: 0 0 16px rgba(245,200,66,0.8);
}
.hs-table{width:100%;}
.hs-row{display:flex;justify-content:space-between;align-items:center;padding:5px 10px;background:rgba(80,60,180,0.1);border:1px solid rgba(80,60,180,0.2);border-radius:8px;margin:3px 0;}
.hs-period{color:#a090d0;font-size:12px;font-weight:bold;min-width:50px;}
.hs-record{color:#60ff90;font-weight:900;text-shadow:0 0 6px #60ff90;}
.hs-val{color:#4038a0;}
.hs-date{color:#7060a0;font-size:9px;margin-left:4px;}
</style>

<script>
// Stars
(function(){
  const c=document.getElementById('stars'),ctx=c.getContext('2d');let stars=[];
  function resize(){c.width=window.innerWidth;c.height=window.innerHeight;stars=[];for(let i=0;i<120;i++)stars.push({x:Math.random()*c.width,y:Math.random()*c.height,r:Math.random()*1.5+0.3,a:Math.random(),da:(Math.random()-0.5)*0.008});}
  function draw(){ctx.clearRect(0,0,c.width,c.height);stars.forEach(s=>{s.a=Math.max(0.1,Math.min(1,s.a+s.da));if(s.a<=0.1||s.a>=1)s.da*=-1;ctx.globalAlpha=s.a;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,6.28);ctx.fill();});ctx.globalAlpha=1;requestAnimationFrame(draw);}
  window.addEventListener('resize',resize);resize();draw();
})();

// Confetti
function startConfetti(){
  const cv=document.getElementById('confetti');cv.style.display='block';
  const ctx=cv.getContext('2d');cv.width=window.innerWidth;cv.height=window.innerHeight;
  const parts=Array.from({length:80},()=>({x:Math.random()*cv.width,y:-10,r:Math.random()*6+3,c:`hsl(${Math.random()*360},90%,60%)`,vx:(Math.random()-0.5)*4,vy:Math.random()*4+2,rot:Math.random()*360,drot:(Math.random()-0.5)*10}));
  let frame=0;
  function anim(){if(frame++>180){cv.style.display='none';return;}ctx.clearRect(0,0,cv.width,cv.height);parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.rot+=p.drot;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot*Math.PI/180);ctx.fillStyle=p.c;ctx.fillRect(-p.r,-p.r/2,p.r*2,p.r);ctx.restore();});requestAnimationFrame(anim);}
  anim();
}

// Visual Viewport
const actionBar = document.querySelector('.action-bar');
function fixActionBar() {
  const vv = window.visualViewport;
  if (!vv) return;
  const layoutWidth = document.documentElement.clientWidth || window.innerWidth;
  const scaleRatio = layoutWidth / vv.width;
  const isZoomed = vv.scale > 1.05 || scaleRatio > 1.05;
  if (!isZoomed) {
    actionBar.style.top = actionBar.style.bottom = '';
    actionBar.style.left = actionBar.style.right = '';
    actionBar.style.width = actionBar.style.transform = '';
    actionBar.style.transformOrigin = '';
    return;
  }
  const scale = Math.max(vv.scale, scaleRatio);
  const inv = 1 / scale;
  const barH = actionBar.offsetHeight || 52;
  const layoutW = document.documentElement.clientWidth || Math.round(vv.width * scale);
  actionBar.style.top = Math.round(vv.offsetTop + vv.height - barH) + 'px';
  actionBar.style.bottom = 'auto';
  actionBar.style.left = Math.round(vv.offsetLeft) + 'px';
  actionBar.style.width = layoutW + 'px';
  actionBar.style.right = 'auto';
  actionBar.style.transform = `scale(${inv})`;
  actionBar.style.transformOrigin = 'bottom left';
}
if (window.visualViewport) {
  window.visualViewport.addEventListener('resize', fixActionBar);
  window.visualViewport.addEventListener('scroll', fixActionBar);
  fixActionBar();
}

// Game state
function getDateKey(){return new Date().toISOString().slice(0,10);}
function getWeekKey(){const d=new Date(),day=d.getDay()||7,mon=new Date(d);mon.setDate(d.getDate()-day+1);return mon.toISOString().slice(0,10);}
function getMonthKey(){return new Date().toISOString().slice(0,7);}
function fmtDate(s){const p=s.slice(5).split('-');return`${parseInt(p[0])}/${parseInt(p[1])}`;}
function saveHiRec(key,val){const today=getDateKey(),wk=getWeekKey(),mo=getMonthKey();let d=JSON.parse(localStorage.getItem(key+'_rec')||'{}');if(!d.all||val>d.all.v)d.all={v:val,date:today};if(!d.today||d.today.date!==today||val>d.today.v)d.today={v:val,date:today};if(!d.week||d.week.key!==wk||val>d.week.v)d.week={v:val,key:wk,date:today};if(!d.month||d.month.key!==mo||val>d.month.v)d.month={v:val,key:mo,date:today};localStorage.setItem(key+'_rec',JSON.stringify(d));}
function saveHiRecLow(key,val){const today=getDateKey(),wk=getWeekKey(),mo=getMonthKey();let d=JSON.parse(localStorage.getItem(key+'_rec')||'{}');if(!d.all||val<d.all.v)d.all={v:val,date:today};if(!d.today||d.today.date!==today||val<d.today.v)d.today={v:val,date:today};if(!d.week||d.week.key!==wk||val<d.week.v)d.week={v:val,key:wk,date:today};if(!d.month||d.month.key!==mo||val<d.month.v)d.month={v:val,key:mo,date:today};localStorage.setItem(key+'_rec',JSON.stringify(d));}
function renderHiRec(key,unit){const today=getDateKey(),wk=getWeekKey(),mo=getMonthKey();const d=JSON.parse(localStorage.getItem(key+'_rec')||'{}');const fmt=e=>e?`<span class="hs-record">${e.v}${unit}</span><span class="hs-date">(${fmtDate(e.date)})</span>`:'<span class="hs-val">--</span>';const tV=d.today?.date===today?fmt(d.today):'<span class="hs-val">--</span>';const wV=d.week?.key===wk?fmt(d.week):'<span class="hs-val">--</span>';const mV=d.month?.key===mo?fmt(d.month):'<span class="hs-val">--</span>';return`<div class="hs-table"><div class="hs-row"><span class="hs-period">本日</span>${tV}</div><div class="hs-row"><span class="hs-period">今週</span>${wV}</div><div class="hs-row"><span class="hs-period">今月</span>${mV}</div><div class="hs-row"><span class="hs-period">全期間</span>${fmt(d.all)}</div></div>`;}

const EMOJIS = ['🐶','🐱','🐭','🐹','🐰','🦊','🐻','🐼','🐨','🐯','🦁','🐮','🐷','🐸','🐵','🐔','🐧','🦆'];
const DIFF = {
  easy:   { cols: 4, rows: 4, pairs: 8 },
  medium: { cols: 4, rows: 6, pairs: 12 },
  hard:   { cols: 6, rows: 6, pairs: 18 }
};

let currentDiff = 'easy';
let cards = [];
let flipped = [];
let matched = 0;
let attempts = 0;
let locked = false;
let timerInterval = null;
let startTime = null;
let elapsed = 0;

function setDifficulty(d) {
  currentDiff = d;
  document.querySelectorAll('.diff-btn').forEach(b => b.classList.toggle('active', b.dataset.diff === d));
  newGame();
}

function newGame() {
  localStorage.removeItem('memory_save');
  clearInterval(timerInterval);
  elapsed = 0; matched = 0; attempts = 0; flipped = []; locked = false;
  updateLEDs();
  document.getElementById('win-msg').style.display = 'none';
  buildGrid();
  startTimer();
}

function buildGrid() {
  const cfg = DIFF[currentDiff];
  const emojiSet = EMOJIS.slice(0, cfg.pairs);
  const deck = [...emojiSet, ...emojiSet];
  // Fisher-Yates shuffle
  for (let i = deck.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [deck[i], deck[j]] = [deck[j], deck[i]];
  }
  cards = deck.map((emoji, idx) => ({ emoji, id: idx, matched: false }));

  const grid = document.getElementById('card-grid');
  grid.style.gridTemplateColumns = `repeat(${cfg.cols}, minmax(58px, 1fr))`;

  // Compute card size based on actual container width (for font sizing)
  const contentEl = document.querySelector('.content');
  const availW = contentEl ? contentEl.clientWidth - 8 : 436; // subtract grid padding (4px each side)
  const cellW = Math.floor((availW - cfg.cols * 6) / cfg.cols);
  const cardSize = Math.max(58, cellW);
  const fontSize = Math.max(16, Math.floor(cardSize * 0.45));

  grid.innerHTML = '';
  cards.forEach((card, i) => {
    const el = document.createElement('div');
    el.className = 'card';
    el.innerHTML = `
      <div class="card-inner">
        <div class="card-front" style="font-size:${Math.floor(cardSize*0.35)}px">？</div>
        <div class="card-back" style="font-size:${fontSize}px">${card.emoji}</div>
      </div>`;
    el.addEventListener('click', () => onCardClick(i, el));
    let startX=0,startY=0,moved=false;
    el.addEventListener('touchstart',e=>{if(e.touches.length>1){moved=true;return;}startX=e.touches[0].clientX;startY=e.touches[0].clientY;moved=false;},{passive:true});
    el.addEventListener('touchmove',e=>{if(e.touches.length>1){moved=true;return;}const dx=e.touches[0].clientX-startX,dy=e.touches[0].clientY-startY;if(dx*dx+dy*dy>100)moved=true;},{passive:true});
    el.addEventListener('touchend',e=>{e.preventDefault();if(!moved)onCardClick(i,el);},{passive:false});
    grid.appendChild(el);
  });
}

function onCardClick(idx, el) {
  if (locked || cards[idx].matched || flipped.includes(idx) || el.classList.contains('flipped')) return;
  el.classList.add('flipped');
  flipped.push(idx);

  if (flipped.length === 2) {
    locked = true;
    attempts++;
    document.getElementById('led-attempts').textContent = attempts;
    const [a, b] = flipped;
    const els = document.getElementById('card-grid').children;
    if (cards[a].emoji === cards[b].emoji) {
      // Match
      setTimeout(() => {
        els[a].classList.add('matched');
        els[b].classList.add('matched');
        cards[a].matched = true;
        cards[b].matched = true;
        matched++;
        document.getElementById('led-pairs').textContent = matched;
        flipped = []; locked = false;
        if (matched === DIFF[currentDiff].pairs) onWin();
        else saveGame();
      }, 400);
    } else {
      // No match
      setTimeout(() => {
        els[a].classList.remove('flipped');
        els[b].classList.remove('flipped');
        flipped = []; locked = false;
      }, 1000);
    }
  }
}

function startTimer() {
  startTime = Date.now() - elapsed * 1000;
  timerInterval = setInterval(() => {
    elapsed = Math.floor((Date.now() - startTime) / 1000);
    const m = Math.floor(elapsed / 60);
    const s = elapsed % 60;
    document.getElementById('led-time').textContent = m + ':' + String(s).padStart(2, '0');
  }, 500);
}

function updateLEDs() {
  document.getElementById('led-pairs').textContent = matched;
  document.getElementById('led-attempts').textContent = attempts;
  document.getElementById('led-time').textContent = '0:00';
}

function onWin() {
  clearInterval(timerInterval);
  localStorage.removeItem('memory_save');
  startConfetti();
  saveHiRecLow('memory_'+currentDiff, attempts);
  // Save high score
  const key = 'memory_hs_' + currentDiff;
  let scores = JSON.parse(localStorage.getItem(key) || '[]');
  scores.push({ attempts, time: elapsed });
  scores.sort((a, b) => a.attempts - b.attempts || a.time - b.time);
  scores = scores.slice(0, 5);
  localStorage.setItem(key, JSON.stringify(scores));

  const min = Math.floor(elapsed / 60), sec = elapsed % 60;
  document.getElementById('win-body').innerHTML = `
    <p style="font-size:16px;color:#f5c842;text-align:center;margin-bottom:12px">🎉 クリア！</p>
    <p>挑戦回数: <strong style="color:#ff44aa">${attempts}</strong></p>
    <p>タイム: <strong style="color:#ff44aa">${min}:${String(sec).padStart(2,'0')}</strong></p>
    <p>ペア数: <strong style="color:#ff44aa">${matched}</strong></p>
    <br><button class="act-btn" style="width:100%;padding:10px" onclick="newGame();closeModal('win-modal')">🔄 もう一度</button>
  `;
  showModal('win-modal');
}

function showHighScore() {
  const names = { easy:'かんたん', medium:'ふつう', hard:'むずかしい' };
  let html = '';
  ['easy','medium','hard'].forEach(d => {
    html += `<p style="color:#f5c842;font-weight:bold;margin:10px 0 4px">${names[d]}</p>`;
    html += renderHiRec('memory_'+d,'回');
  });
  document.getElementById('hs-body').innerHTML = html;
  showModal('hs-modal');
}

function showModal(id) { document.getElementById(id).classList.add('visible'); }
function closeModal(id) { document.getElementById(id).classList.remove('visible'); }

// Close modal on overlay click
document.querySelectorAll('.modal-overlay').forEach(el => {
  el.addEventListener('click', e => { if (e.target === el) el.classList.remove('visible'); });
});

// Save / Restore (1-hour TTL)
function saveGame(){
  if(matched===DIFF[currentDiff].pairs){localStorage.removeItem('memory_save');return;}
  localStorage.setItem('memory_save',JSON.stringify({
    currentDiff,
    cardEmojis:cards.map(c=>c.emoji),
    matchedCards:cards.map(c=>c.matched),
    attempts,elapsed,matched,savedAt:Date.now()
  }));
}

function rebuildGridFromSave(emojiArr,matchedArr){
  const cfg=DIFF[currentDiff];
  cards=emojiArr.map((emoji,idx)=>({emoji,id:idx,matched:matchedArr[idx]||false}));
  const grid=document.getElementById('card-grid');
  grid.style.gridTemplateColumns=`repeat(${cfg.cols},minmax(58px,1fr))`;
  const contentEl2=document.querySelector('.content');
  const availW2=contentEl2?contentEl2.clientWidth-8:436;
  const cellW=Math.floor((availW2-cfg.cols*6)/cfg.cols);
  const cardSize=Math.max(58,cellW);
  const fontSize=Math.max(16,Math.floor(cardSize*0.45));
  grid.innerHTML='';
  cards.forEach((card,i)=>{
    const el=document.createElement('div');
    el.className='card'+(card.matched?' matched flipped':'');
    el.innerHTML=`<div class="card-inner"><div class="card-front" style="font-size:${Math.floor(cardSize*0.35)}px">？</div><div class="card-back" style="font-size:${fontSize}px">${card.emoji}</div></div>`;
    el.addEventListener('click',()=>onCardClick(i,el));
    let sX=0,sY=0,mv=false;
    el.addEventListener('touchstart',e=>{if(e.touches.length>1){mv=true;return;}sX=e.touches[0].clientX;sY=e.touches[0].clientY;mv=false;},{passive:true});
    el.addEventListener('touchmove',e=>{if(e.touches.length>1){mv=true;return;}const dx=e.touches[0].clientX-sX,dy=e.touches[0].clientY-sY;if(dx*dx+dy*dy>100)mv=true;},{passive:true});
    el.addEventListener('touchend',e=>{e.preventDefault();if(!mv)onCardClick(i,el);},{passive:false});
    grid.appendChild(el);
  });
}

function tryLoadSave(){
  newGame();
  try{
    const raw=localStorage.getItem('memory_save');
    if(!raw)return;
    const s=JSON.parse(raw);
    if(!s||!s.savedAt||Date.now()-s.savedAt>60*60*1000){localStorage.removeItem('memory_save');return;}
    if(!s.cardEmojis||s.matched===DIFF[s.currentDiff]?.pairs){localStorage.removeItem('memory_save');return;}
    document.getElementById('resume-overlay').classList.add('visible');
    document.getElementById('resume-yes').onclick=function(){
      document.getElementById('resume-overlay').classList.remove('visible');
      clearInterval(timerInterval);
      currentDiff=s.currentDiff||'easy';
      document.querySelectorAll('.diff-btn').forEach(b=>b.classList.toggle('active',b.dataset.diff===currentDiff));
      attempts=s.attempts||0;matched=s.matched||0;elapsed=s.elapsed||0;
      flipped=[];locked=false;
      document.getElementById('win-msg').style.display='none';
      const m=Math.floor(elapsed/60),sec=elapsed%60;
      document.getElementById('led-pairs').textContent=matched;
      document.getElementById('led-attempts').textContent=attempts;
      document.getElementById('led-time').textContent=m+':'+String(sec).padStart(2,'0');
      rebuildGridFromSave(s.cardEmojis,s.matchedCards||[]);
      startTimer();
    };
    document.getElementById('resume-no').onclick=function(){
      document.getElementById('resume-overlay').classList.remove('visible');
      localStorage.removeItem('memory_save');
    };
  }catch(e){}
}

function showSaveToast(){
  const t=document.createElement('div');
  t.textContent='✅ 保存しました';
  t.style.cssText='position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:rgba(0,160,80,0.92);color:#fff;padding:8px 20px;border-radius:20px;font-size:13px;font-weight:bold;z-index:99999;pointer-events:none;transition:opacity 0.5s';
  document.body.appendChild(t);
  setTimeout(()=>{t.style.opacity='0';setTimeout(()=>t.remove(),500);},1500);
}

document.addEventListener('visibilitychange', ()=>{ if(document.hidden) saveGame(); });

// Init
tryLoadSave();
</script>
